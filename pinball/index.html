<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>PINBALL</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Courier New", Courier, monospace; font-weight: bold;
    color: #fff; -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #stage { position: relative; }
  canvas#screen { display: block; background: #000; image-rendering: pixelated; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; gap: 8px;
    background: rgba(0,0,0,.84); text-align: center; padding: 10px 10px 12px; overflow-y: auto;
  }
  #overlay.hidden { display: none; }
  #logo { image-rendering: pixelated; margin-top: 4px; }
  #sub { margin: 0; font-size: 12px; line-height: 1.7; color: #e8e8e8; letter-spacing: 1px; min-height: 1.7em; }
  #sub b { color: #fc74b4; }
  #presets { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #presets .lbl, .knob .lbl { font-size: 10px; color: #fc74b4; letter-spacing: 1px; }
  #presets button, .btnrow button {
    min-width: 64px; height: 28px; font: inherit; font-size: 11px; letter-spacing: 1px; color: #fff; padding: 0 8px;
    background: #0c1450; border: 2px solid #4240ff; border-radius: 5px; cursor: pointer;
  }
  #presets button:hover, .btnrow button:hover { border-color: #fff; }
  #presets button.sel { background: #4240ff; border-color: #fff; color: #fff; }
  #presets.row-sel .lbl { color: #ffff60; }
  #presets .custom { font-size: 11px; color: #fc74b4; letter-spacing: 1px; }
  #knobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 2px 10px; width: 100%; max-width: 700px; }
  .knob { display: grid; grid-template-columns: 1fr 26px 128px 26px; align-items: center; gap: 4px;
          padding: 1px 6px; border-radius: 4px; border: 1px solid transparent; }
  .knob.sel { border-color: #ffff60; background: rgba(255,255,96,.08); }
  .knob .lbl { text-align: left; }
  .knob .val { font-size: 11px; color: #fff; letter-spacing: 1px; }
  .knob button {
    width: 26px; height: 22px; font: inherit; font-size: 13px; color: #fff; padding: 0;
    background: #0c1450; border: 2px solid #4240ff; border-radius: 4px; cursor: pointer; line-height: 1;
  }
  .knob button:hover { border-color: #fff; }
  .knob.on .val { color: #ffff60; }
  #highs { font-size: 10px; color: #bdbdbd; letter-spacing: 1px; line-height: 1.7; }
  #highs b { color: #fff; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #play {
    font: inherit; font-size: 15px; letter-spacing: 3px; padding: 9px 22px; min-width: 120px; height: auto;
    color: #000; background: #fe6ecc; border: 2px solid #fe6ecc; border-radius: 5px; cursor: pointer;
  }
  #play:hover, #play.sel { background: #fff; border-color: #ffff60; }
  .hint { margin: 0; font-size: 10px; color: #8b8b8b; line-height: 1.8; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" width="256" height="240"></canvas>
  <div id="overlay">
    <canvas id="logo" width="192" height="108"></canvas>
    <p id="sub"></p>
    <div id="presets"><span class="lbl">PRESET</span></div>
    <div id="knobs"></div>
    <div id="highs"></div>
    <div class="btnrow">
      <button id="play">PLAY</button>
      <button id="resume">RESUME</button>
    </div>
    <p class="hint">LEFT FLIPPER: &larr; Z L-SHIFT &nbsp;&middot;&nbsp; RIGHT FLIPPER: &rarr; / R-SHIFT &nbsp;&middot;&nbsp; PLUNGER: hold &darr; or SPACE, release<br>
      NUDGE: &uarr; or N &nbsp;&middot;&nbsp; P pause &nbsp;&middot;&nbsp; M sound &nbsp;&middot;&nbsp; ESC menu &nbsp;&middot;&nbsp; touch: left / right half = flippers, bottom = plunger<br>
      menu: &uarr;&darr; pick a row, &larr;&rarr; change it, 1-4 presets, ENTER play</p>
  </div>
</div>

  if (game.stoppers[0] || settings.posts > 0) { spr(0x5E, 79, 166, 0x42); spr(0x5F, 71, 166, 0x42); }
  if (game.stoppers[1] || settings.posts > 0) { spr(0x5E, 201, 166, 2); spr(0x5F, 209, 166, 2); }
  if (!game.exitOpen) for (let k = 0; k < 3; k++) { spr(0x5A, 204, 55 + 8 * k, 3); spr(0x5B, 212, 55 + 8 * k, 3); }
  spr(0xFF, 90, 151, 0); spr(0xFF, 190, 151, 0x40);
  meta(HOLE, 200, 23);
  if (ball.state === 'plunger' || game.spring) {
    const fr = game.spring;
    for (const [i, t] of SPRING_BG) setTile(LOWER, i, fr ? t : SCN[LOWER].nt0[i]);
    if (fr) for (const e of SPRING[fr]) spr(e[0], 216 + e[1], e[2] - 1, 0);
  }
}
function drawBonus() {
  // floors under the lady
  for (let i = 0; i < 6; i++) if (game.floors[i]) spr(0x36, 128 + 8 * i, 56, (i & 1) ? 0x40 : 0);
  // Pauline
  const p = game.pauline, fr = PAULINE[(p.state === 'fall') ? 0 : ((p.anim >> 3) % 4 === 3 ? 2 : (p.anim >> 3) % 2)];
  const flip = p.dir < 0;
  for (let k = 0; k < 6; k++) {
    const dx = (k & 1) * 8, dy = (k >> 1) * 8;
    spr(fr[k], p.x + (flip ? 8 - dx : dx), p.y + dy, 2 | (flip ? 0x40 : 0));
  }
  // Mario with the paddle
  const mx = game.mario, mf = game.marioAnim ? ((game.marioAnim >> 3) % 3) : 0, right = game.marioDir > 0;
  const pad = MARIO_PADDLE[mf], body = MARIO_BODY[mf];
  if (right) {
    spr(0x25, mx, 184, 3); spr(pad[0], mx + 8, 184, 3); spr(pad[1], mx + 16, 184, 3); spr(0x25, mx + 24, 184, 0x43);
    spr(body[0], mx + 8, 192, 1); spr(body[1], mx + 16, 192, 1); spr(body[2], mx + 8, 200, 1); spr(body[3], mx + 16, 200, 1);
  } else {
    spr(0x25, mx, 184, 3); spr(pad[1], mx + 8, 184, 0x43); spr(pad[0], mx + 16, 184, 0x43); spr(0x25, mx + 24, 184, 0x43);
    spr(body[1], mx + 8, 192, 0x41); spr(body[0], mx + 16, 192, 0x41); spr(body[3], mx + 8, 200, 0x41); spr(body[2], mx + 16, 200, 0x41);
  }
  if (ball.state === 'emerge') meta(HOLE, 144, 154);
}
function drawTitle() { /* the ROM title screen nametable; the menu sits over it */ }
function badge() {
  if (settings.invuln && game.mode === 'play') { fillRect(2, 216, 60, 11, COL.black); drawText('INVULN', 4, 218, COL.yellow); }
}
function render() {
  let s = game.mode === 'play' ? game.scene : TITLE;
  curScene = s;
  if (s !== TITLE) { drawHUD(s); applyPalettes(); }
  if (s === LOWER) { /* spring tiles set in drawLower before BG */ }
  if (s === LOWER && (ball.state === 'plunger' || game.spring)) for (const [i, t] of SPRING_BG) setTile(LOWER, i, game.spring ? t : SCN[LOWER].nt0[i]);
  const S = SCN[s];
  if (S.dirty) renderBG(s);
  fb.set(S.cache);
  if (s === UPPER) drawUpper();
  else if (s === LOWER) drawLower();
  else if (s === BONUS) drawBonus();
  if (s === UPPER || s === LOWER) drawFlippers(s);
  if (s !== TITLE) drawBall();
  if (game.mode === 'play') {
    // messages sit in the empty part of the HUD column, so the table stays as on the NES
    if (game.msgT > 0 && (game.msgT > 30 || (game.msgT & 4))) {
      const lines = game.msg.split(' ');
      lines.forEach((l, i) => drawText(l, 32 - l.length * 4, 132 + i * 12, game.msgT & 8 ? COL.white : COL.yellow));
    }
    if (game.tilted) drawText('TILT', 16, 160, (game.frame & 16) ? COL.red : COL.white);
    if (game.over) { fillRect(110, 100, 84, 28, COL.black); drawText('GAME OVER', 116, 110, COL.white); }
    if (game.paused) { fillRect(122, 100, 60, 28, COL.black); drawText('PAUSE', 132, 110, COL.white); }
  }
  badge();
  // to the canvas
  const d = fb8;
  for (let i = 0, j = 0; i < fb.length; i++, j += 4) { const c = fb[i]; d[j] = c & 255; d[j + 1] = (c >> 8) & 255; d[j + 2] = (c >> 16) & 255; d[j + 3] = 255; }
  ctx.putImageData(img, 0, 0);
}

/* ------------------------------------------------------------------ *
 * Menu overlay
 * ------------------------------------------------------------------ */
const overlay = document.getElementById('overlay');
const subEl = document.getElementById('sub');
const presetsEl = document.getElementById('presets');
const knobsEl = document.getElementById('knobs');
const highsEl = document.getElementById('highs');
const playBtn = document.getElementById('play');
const resumeBtn = document.getElementById('resume');
const menu = { row: 0, rows: [] };
const presetBtns = {};
let customLbl = null;
const knobRows = {};
(function buildMenu() {
  for (const p of PRESET_ORDER) {
    const b = document.createElement('button'); b.textContent = p.toUpperCase();
    b.addEventListener('click', () => { applyPreset(p); refreshMenu(); });
    presetsEl.appendChild(b); presetBtns[p] = b;
  }
  customLbl = document.createElement('span'); customLbl.className = 'custom'; presetsEl.appendChild(customLbl);
  for (const k of KNOBS) {
    const row = document.createElement('div'); row.className = 'knob';
    const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = k.label;
    const minus = document.createElement('button'); minus.textContent = '−';
    const val = document.createElement('span'); val.className = 'val';
    const plus = document.createElement('button'); plus.textContent = '+';
    minus.addEventListener('click', () => { stepKnob(k.key, -1); refreshMenu(); });
    plus.addEventListener('click', () => { stepKnob(k.key, 1); refreshMenu(); });
    row.appendChild(lbl); row.appendChild(minus); row.appendChild(val); row.appendChild(plus);
    knobsEl.appendChild(row); knobRows[k.key] = { row, val };
  }
  menu.rows = ['presets'].concat(KNOBS.map(k => k.key), ['play']);
  // the PIN BALL logo, cut from the ROM's title nametable
  const lc = document.getElementById('logo').getContext('2d');
  const li = lc.createImageData(192, 108), l32 = new Uint32Array(li.data.buffer);
  const S = SCN[TITLE];
  for (let y = 0; y < 108; y++) for (let x = 0; x < 192; x++) {
    const sx = 32 + x, sy = 20 + y;
    const tx = sx >> 3, ty = sy >> 3, t = S.bgTable + S.nt0[ty * 32 + tx];
    const p = TILES[t * 64 + (sy & 7) * 8 + (sx & 7)];
    const at = S.nt0[0x3C0 + (ty >> 2) * 8 + (tx >> 2)], pal = (at >> (((ty & 2) << 1) | (tx & 2))) & 3;
    l32[y * 192 + x] = p ? NES32[S.pal0[pal * 4 + p]] : 0;
  }
  lc.putImageData(li, 0, 0);
})();
function refreshMenu() {
  const p = presetName();
  for (const q of PRESET_ORDER) presetBtns[q].classList.toggle('sel', q === p);
  customLbl.textContent = p === 'custom' ? 'CUSTOM' : '';
  presetsEl.classList.toggle('row-sel', menu.rows[menu.row] === 'presets');
  for (const k of KNOBS) {
    const r = knobRows[k.key], v = settings[k.key];
    r.val.textContent = k.fmt ? k.fmt(v) : String(v);
    r.row.classList.toggle('sel', menu.rows[menu.row] === k.key);
    r.row.classList.toggle('on', k.key === 'invuln' && v === 1);
  }
  playBtn.classList.toggle('sel', menu.rows[menu.row] === 'play');
  const L = settings.game;
  const parts = PRESET_ORDER.concat(['custom']).map(q => {
    const h = getHigh(highKey(q, 0, L)), hn = getHigh(highKey(q, 1, L));
    return q.toUpperCase() + ' <b>' + (h || '-') + '</b>' + (hn ? ' (' + hn + '*)' : '');
  });
  highsEl.innerHTML = 'HIGH SCORES, GAME ' + L + ': ' + parts.join(' &middot; ') + '<br>* = set with INVULNERABLE on';
  resumeBtn.style.display = (game.mode === 'play' && game.paused && !game.over) ? '' : 'none';
}
function showOverlay(text) { subEl.innerHTML = text || ''; overlay.classList.remove('hidden'); refreshMenu(); }
function hideOverlay() { overlay.classList.add('hidden'); }
function overlayOpen() { return !overlay.classList.contains('hidden'); }
function toMenu_(why) {
  let text = 'Flip with &larr; and &rarr;, pull the plunger with &darr; or SPACE. Pick a preset, then PLAY.';
  if (why === 'gameover' && game.lastSummary) {
    const s = game.lastSummary;
    text = '<b>GAME OVER</b> &nbsp; SCORE ' + s.score + (s.newHigh ? ' &nbsp; <b>NEW HIGH SCORE!</b>' : '');
    game.mode = 'title';
  } else if (why === 'pause') {
    text = 'PAUSED &nbsp; RESUME, or change settings and PLAY to restart.';
  } else game.mode = 'title';
  showOverlay(text);
}
function openMenu() { if (game.mode !== 'play' || game.over) return; game.paused = true; Sound.stopAll(); toMenu_('pause'); }
function resume() { hideOverlay(); game.paused = false; }
function togglePause() { if (game.mode !== 'play' || game.over) return; game.paused = !game.paused; if (game.paused) Sound.stopAll(); }
playBtn.addEventListener('click', () => { Sound.init(); startPlaying(); });
resumeBtn.addEventListener('click', () => resume());

/* ------------------------------------------------------------------ *
 * Input
 * ------------------------------------------------------------------ */
const KEYMAP = {
  ArrowLeft: 'left', z: 'left', Z: 'left', ShiftLeft: 'left',
  ArrowRight: 'right', '/': 'right', ShiftRight: 'right',
  ArrowDown: 'plunger', ' ': 'plunger', Spacebar: 'plunger'
};
function keyAction(e) { return KEYMAP[e.code === 'ShiftLeft' || e.code === 'ShiftRight' ? e.code : e.key] || (e.code === 'Slash' ? 'right' : null); }
window.addEventListener('keydown', e => {
  const k = e.key;
  Sound.init();
  if (k === 'm' || k === 'M') { Sound.setMuted(!Sound.isMuted()); return; }
  if (overlayOpen()) {
    const row = menu.rows[menu.row];
    if (k === 'ArrowDown') { menu.row = (menu.row + 1) % menu.rows.length; refreshMenu(); }
    else if (k === 'ArrowUp') { menu.row = (menu.row + menu.rows.length - 1) % menu.rows.length; refreshMenu(); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') {
      const d = k === 'ArrowLeft' ? -1 : 1;
      if (row === 'presets') { let i = PRESET_ORDER.indexOf(presetName()); i = i < 0 ? 0 : Math.max(0, Math.min(3, i + d)); applyPreset(PRESET_ORDER[i]); }
      else if (KNOB[row]) stepKnob(row, d);
      refreshMenu();
    } else if (k >= '1' && k <= '4') { applyPreset(PRESET_ORDER[+k - 1]); refreshMenu(); }
    else if (k === 'Enter') startPlaying();
    else if (k === 'Escape' && game.mode === 'play' && game.paused) resume();
    else return;
    if (e.preventDefault) e.preventDefault();
    return;
  }
  const a = keyAction(e);
  if (a) { input[a] = true; if (e.preventDefault) e.preventDefault(); return; }
  if (k === 'ArrowUp' || k === 'n' || k === 'N') { input.nudge = true; if (e.preventDefault) e.preventDefault(); return; }
  if (k === 'p' || k === 'P') togglePause();
  else if (k === 'Escape') openMenu();
  else return;
  if (e.preventDefault) e.preventDefault();
});
window.addEventListener('keyup', e => { const a = keyAction(e); if (a) input[a] = false; });
window.addEventListener('blur', () => { input.left = input.right = input.plunger = false; });
/* touch: left / right half = flippers; lower 20% of the right half = plunger */
const touches = new Map();
function touchUpdate() {
  input.left = input.right = false; let plg = false;
  for (const t of touches.values()) { if (t === 'p') plg = true; else input[t] = true; }
  input.plunger = plg;
}
function touchKind(t) {
  const r = canvas.getBoundingClientRect(), x = (t.clientX - r.left) / (r.width || 1), y = (t.clientY - r.top) / (r.height || 1);
  if (ball.state === 'plunger' && x > 0.5 && y > 0.8) return 'p';
  return x < 0.5 ? 'left' : 'right';
}
canvas.addEventListener('touchstart', e => {
  if (e.preventDefault) e.preventDefault(); Sound.init();
  for (const t of e.changedTouches) touches.set(t.identifier, touchKind(t));
  touchUpdate();
}, { passive: false });
const touchEnd = e => { if (e.preventDefault) e.preventDefault(); for (const t of e.changedTouches) touches.delete(t.identifier); touchUpdate(); };
canvas.addEventListener('touchend', touchEnd, { passive: false });
canvas.addEventListener('touchcancel', touchEnd, { passive: false });
document.addEventListener('visibilitychange', () => { if (document.hidden && game.mode === 'play' && !game.paused && !game.over) togglePause(); });

/* ------------------------------------------------------------------ *
 * Layout and main loop (fixed 60 Hz timestep)
 * ------------------------------------------------------------------ */
function layout() {
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / SW, window.innerHeight / SH)));
  canvas.style.width = SW * s + 'px'; canvas.style.height = SH * s + 'px';
  const st = document.getElementById('stage'); st.style.width = SW * s + 'px'; st.style.height = SH * s + 'px';
  const logo = document.getElementById('logo');
  const lsc = s >= 4 ? 2 : 1; logo.style.width = 192 * lsc + 'px'; logo.style.height = 108 * lsc + 'px';
}
window.addEventListener('resize', layout);
let last = 0, acc = 0;
const STEP = 1000 / 60;
function frame(ts) {
  if (!last) last = ts;
  acc += Math.min(250, ts - last); last = ts;
  let n = 0;
  while (acc >= STEP && n < 8) { update(); acc -= STEP; n++; }
  if (n) render();
  requestAnimationFrame(frame);
}
loadSettings();
layout();
toMenu_('menu');
render();
requestAnimationFrame(frame);
window.addEventListener('pointerdown', function first() { Sound.init(); window.removeEventListener('pointerdown', first); });
})();
</script>
