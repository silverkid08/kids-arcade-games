<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>DONKEY KONG</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Courier New", Courier, monospace; font-weight: bold;
    color: #fff; -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #stage { position: relative; }
  canvas { display: block; background: #000; image-rendering: pixelated; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: rgba(0,0,0,.86); text-align: center; padding: 10px; overflow: auto;
  }
  #overlay.hidden { display: none; }
  #title { margin: 0; font-size: 30px; letter-spacing: 6px; color: #ff6800;
           text-shadow: 0 0 14px rgba(255,104,0,.5); }
  #sub { margin: 0; font-size: 12px; line-height: 1.8; color: #e8e8e8; letter-spacing: 1px; }
  .row { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .lbl { font-size: 10px; color: #00ffff; letter-spacing: 2px; min-width: 150px; text-align: right; }
  .row button, #knobs button {
    font: inherit; font-size: 12px; color: #fff; padding: 4px 8px; min-width: 28px;
    background: #0b0b18; border: 2px solid #2121de; border-radius: 5px; cursor: pointer;
  }
  .row button:hover { border-color: #8ea0ff; }
  .row button.sel { background: #2121de; border-color: #ffb600; color: #ffb600; }
  #knobs { display: flex; flex-direction: column; gap: 3px; }
  .knob { display: flex; align-items: center; gap: 6px; justify-content: center; padding: 1px 6px; border-radius: 4px; }
  .knob.focus { background: rgba(255,182,0,.14); outline: 1px solid rgba(255,182,0,.5); }
  .knob .val { font-size: 12px; color: #ffb600; min-width: 74px; }
  .knob .val.on { color: #00ff66; }
  #play {
    font: inherit; font-size: 15px; letter-spacing: 3px; padding: 10px 22px;
    color: #000; background: #ffb600; border: 0; border-radius: 5px; cursor: pointer;
  }
  #play:hover, #play.focus { background: #fff; }
  #scores { font-size: 10px; color: #ff44aa; letter-spacing: 1px; line-height: 1.7; }
  .hint { margin: 0; font-size: 10px; color: #8b8b8b; line-height: 1.9; letter-spacing: 1px; }
</style>

/* US level order: L1 25m,100m; L2 25m,75m,100m; L3 25m,50m,75m,100m;
   L4 25,50,75,25,50,75,100; L5+ 25,50,75,25,50,75,25,50,75,100.
   50m and 75m are not implemented, so they are skipped. */
function stageOrder(level) {
  const n = level <= 3 ? 1 : level === 4 ? 2 : 3;
  const seq = [];
  for (let i = 0; i < n; i++) seq.push(STAGE_25);
  seq.push(STAGE_100);
  return seq;
}

function downhill(gd, x) {
  const d = gd.fn(Math.min(gd.x1, x + 8)) - gd.fn(Math.max(gd.x0, x - 8));
  return d > 0 ? 1 : d < 0 ? -1 : 0;
}

/* ------------------------------------------------------------------ *
 * Sprite rasterisation.  SPR entries are [w, h, pixels]; a canvas is
 * built per (sprite, flip, recolour) on first use.
 * ------------------------------------------------------------------ */
const spriteCache = {};
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function hexRGB(hex) { return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; }
function rasterise(def, flip, map) {
  const [w, h, px] = def;
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let ch = px[y * w + (flip ? w - 1 - x : x)];

/* ------------------------------------------------------------------ *
 * Settings, presets, persistence
 * ------------------------------------------------------------------ */
const PRESETS = {
  kid:      { throwRate: 50,  enemySpeed: 60,  playerSpeed: 110, timer: 300, fallDamage: false, lives: 5, startLevel: 1, extraLife: 5000, invuln: false },
  easy:     { throwRate: 75,  enemySpeed: 80,  playerSpeed: 100, timer: 150, fallDamage: true,  lives: 5, startLevel: 1, extraLife: 7000, invuln: false },
  normal:   { throwRate: 100, enemySpeed: 100, playerSpeed: 100, timer: 100, fallDamage: true,  lives: 3, startLevel: 1, extraLife: 7000, invuln: false },
  original: { throwRate: 100, enemySpeed: 100, playerSpeed: 100, timer: 100, fallDamage: true,  lives: 3, startLevel: 1, extraLife: 7000, invuln: false }
};
const PRESET_ORDER = ['kid', 'easy', 'normal', 'original'];
const KNOBS = [
  { key: 'throwRate',   label: 'BARREL THROW RATE', values: [25, 50, 75, 100, 125, 150, 200], fmt: v => v + '%' },
  { key: 'enemySpeed',  label: 'BARREL/FIRE SPEED',  values: [40, 60, 80, 100, 125, 150, 200], fmt: v => v + '%' },
  { key: 'playerSpeed', label: 'JUMPMAN SPEED',      values: [60, 80, 100, 110, 125, 150, 200], fmt: v => v + '%' },
  { key: 'timer',       label: 'BONUS TIMER',        values: [0, 50, 100, 150, 200, 300], fmt: v => v === 0 ? 'OFF' : v + '%' },
  { key: 'fallDamage',  label: 'FALL DAMAGE',        values: [true, false], fmt: v => v ? 'ON' : 'OFF' },
  { key: 'lives',       label: 'LIVES',              values: [1, 2, 3, 4, 5, 6, 7, 8, 9], fmt: v => String(v) },
  { key: 'startLevel',  label: 'STARTING LEVEL',     values: [1, 2, 3, 4, 5, 6, 7, 8, 9], fmt: v => String(v) },
  { key: 'extraLife',   label: 'EXTRA LIFE AT',      values: [0, 5000, 7000, 10000, 15000, 20000], fmt: v => v === 0 ? 'OFF' : String(v) },
  { key: 'invuln',      label: 'INVULNERABLE',       values: [false, true], fmt: v => v ? 'ON' : 'OFF' }
];
const settings = Object.assign({ preset: 'normal' }, PRESETS.normal);
const high = { kid: 0, easy: 0, normal: 0, original: 0, custom: 0, invuln: 0 };

function loadPersisted() {
  try {
    const s = JSON.parse(localStorage.getItem('dk.settings') || 'null');
    if (s && typeof s === 'object') {
      for (const k of KNOBS) if (k.key in s && k.values.includes(s[k.key])) settings[k.key] = s[k.key];
      if (typeof s.preset === 'string' && (PRESET_ORDER.includes(s.preset) || s.preset === 'custom')) settings.preset = s.preset;
    }
    const h = JSON.parse(localStorage.getItem('dk.high') || 'null');
    if (h && typeof h === 'object') for (const k in high) if (typeof h[k] === 'number') high[k] = h[k];
  } catch (e) { /* localStorage unavailable */ }
  if (settings.preset === 'original') Object.assign(settings, PRESETS.original);
}
function savePersisted() {
  try {
    localStorage.setItem('dk.settings', JSON.stringify(settings));
    localStorage.setItem('dk.high', JSON.stringify(high));
  } catch (e) { /* ignore */ }
}
function applyPreset(name) {
  settings.preset = name;
  Object.assign(settings, PRESETS[name]);
  savePersisted();
}
function setKnob(key, value) {
  settings[key] = value;
  settings.preset = 'custom';
  for (const p of PRESET_ORDER) {
    if (KNOBS.every(k => settings[k.key] === PRESETS[p][k.key])) { settings.preset = p; break; }
  }

}
function highKey() { return settings.invuln ? 'invuln' : settings.preset; }

/* ------------------------------------------------------------------ *
 * Game state
 * ------------------------------------------------------------------ */
const game = {
  state: 'menu',     // menu, howhigh, intro, ready, play, dying, win, gameover
  paused: false,
  frame: 0,
  level: 1, stageIndex: 0, stage: STAGE_25,
  score: 0, lives: 3, extraGiven: false,
  bonus: 0, bonusTimer: 0, difficulty: 1, diffTimer: 0,
  mario: null, kong: null, pauline: null,
  barrels: [], fireballs: [], hammers: [], items: [], rivets: [], holes: [], effects: [], popups: [],
  oilLit: false, barrelCount: 0, fireSpawnTimer: 0,
  t: 0, seqT: 0, flash: 0, bassT: 0,
  input: { left: false, right: false, up: false, down: false, jump: false, jumpEdge: false },
  rng: 1

/* deterministic PRNG so the headless tests are repeatable */
function rand() {
  game.rng = (game.rng * 1103515245 + 12345) & 0x7fffffff;
  return game.rng / 0x7fffffff;
}
function randInt(n) { return Math.floor(rand() * n); }

function enemySpeed() { return settings.enemySpeed / 100; }

function startBonus(level) { return Math.min(8000, (level * 10 + 40) * 100); }

  game.score += n;
  if (settings.extraLife && !game.extraGiven && game.score >= settings.extraLife) {
    game.extraGiven = true;
    game.lives++;
    Sound.extraLife();
  }
  if (game.score > currentHigh()) { high[highKey()] = game.score; }
}
function popup(kind, x, y) {

}

/* ------------------------------------------------------------------ *
 * Floors and ladders
 * ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ *
 * Set-up
 * ------------------------------------------------------------------ */
function newGame() {
  game.score = 0;
  game.lives = settings.lives;
  game.extraGiven = false;
  game.level = settings.startLevel;
  game.stageIndex = 0;
  game.rivetsLeft = [];
  game.holes = [];
  game.rng = (Date.now() & 0xffff) | 1;
  beginStage(true);
}

function beginStage(firstOfLevel) {
  const order = stageOrder(game.level);
  game.stage = order[game.stageIndex];
  game.holes = [];
  game.rivetsDone = [];
  game.itemsTaken = [];
  game.difficulty = Math.min(5, game.level);
  game.diffTimer = 0;
  resetActors();
  game.state = 'howhigh';
  game.seqT = 0;
  game.introPending = firstOfLevel && game.stage === STAGE_25;
  Sound.howHigh();
}

/* placed everything for a fresh attempt at the current stage */
function resetActors() {
  const st = game.stage;
  const sx = st.start.x, sy = st.girders[st.start.g].fn(sx + 8);
  game.mario = {
    x: sx, y: sy, dir: 1, state: 'stand', anim: 0, walkT: 0, g: st.start.g,
    jumpT: 0, jumpDir: 0, jumpY0: sy, vy: 0, fallY0: sy, jumped: [],
    ladder: null, climbT: 0, hammer: 0, hammerT: 0, deadT: 0, flash: 0, subX: 0, subY: 0
  };
  game.kong = { x: st.kong.x, y: st.kong.y, pose: 'k_idle', t: 0, phase: 'idle', phaseT: 0, nextThrow: 90, blue: false, wild: false, beat: 0 };
  game.pauline = { x: st.pauline.x, y: st.pauline.y, t: 0 };
  game.barrels = [];
  game.fireballs = [];
  game.effects = [];
  game.popups = [];
  game.hammers = st.hammers.map(h => ({ x: h.x, y: h.y, taken: false }));
  game.items = st.items.map((it, i) => ({ kind: it.kind, x: it.x, y: it.y, taken: game.itemsTaken.includes(i), i }));
  game.rivets = st.rivets.map((r, i) => ({ x: r.x, g: r.g, y: st.girders[r.g].fn(r.x), taken: game.rivetsDone.includes(i), i }));
  game.holes = game.rivets.filter(r => r.taken).map(r => ({ g: r.g, x: r.x }));
  game.oilLit = false;
  game.barrelCount = 0;
  game.fireSpawnTimer = 120;
  game.bonus = startBonus(game.level);
  game.bonusTimer = 0;
  game.t = 0;
  game.bassT = 0;
}

function startPlay() {
  game.state = 'ready';
  game.seqT = 0;
  Sound.start();
}

/* ------------------------------------------------------------------ *
 * Jumpman
 * ------------------------------------------------------------------ */
function marioBox(m) { return { x: m.x + 5, y: m.y - 12, w: 6, h: 12 }; }

  return b.state === 'ladder' ? { x: b.x + 4, y: b.y - 7, w: 6, h: 6 } : { x: b.x + 3, y: b.y - 7, w: 6, h: 6 };
}
function fireBox(f) { return { x: f.x + 5, y: f.y - 10, w: 6, h: 9 }; }

  const cx = m.x + 8;
  for (const l of game.stage.ladders) {
    if (Math.abs(cx - (l.x + 4)) > 4) continue;
    if (fromBelow) {
      if (ladderBottom(l) === m.y && (!l.broken || l.down > 0)) return l;
    } else {
      if (ladderTop(l) === m.y && !l.exit && (!l.broken || l.up > 0)) return l;
    }
  }
  return null;

function killMario(cause) {
  if (settings.invuln) {
    game.mario.flash = 30;
    game.flash = 6;
    Sound.bounce();
    if (cause === 'timer') { game.bonus = startBonus(game.level); }
    return false;
  }
  game.state = 'dying';
  game.mario.state = 'dead';
  game.mario.deadT = 0;
  game.mario.hammer = 0;
  Sound.death();
  return true;
}

function landMario(m, gi, fy) {
  const fallFrom = m.state === 'jump' ? m.jumpY0 : m.fallY0;
  const drop = fy - fallFrom;
  m.y = fy; m.g = gi; m.vy = 0;
  const jumped = m.jumped.length;
  m.state = 'stand';
  if (drop > FALL_LIMIT && settings.fallDamage) {
    if (killMario('fall')) return;
  }
  Sound.land();
  if (jumped > 0) {
    const pts = jumped === 1 ? 100 : jumped === 2 ? 300 : 500;      // 3+ shows "800" but pays 500 (arcade quirk)
    addScore(pts);
    popup(jumped >= 3 ? 's800' : 's' + pts, m.x, m.y - 24);
    Sound.score();
  }

  const m = game.mario, inp = game.input, st = game.stage;

  if (m.hammer > 0) {
    m.hammerT++;
    if (m.hammerT % 8 === 0) Sound.hammer((m.hammerT >> 3) & 1);
    m.hammer--;
  }

  if (m.state === 'stand' || m.state === 'walk') {
    let moved = false;
    if (inp.left !== inp.right) {
      m.dir = inp.left ? -1 : 1;
      m.subX += spd;
      while (m.subX >= 1) { m.x += m.dir; m.subX -= 1; }
      m.x = Math.max(0, Math.min(SW - 16, m.x));
      moved = true;
    }
    // support
    const gi = girderAt(m.x + 8, m.y, 3);
    if (gi < 0) { m.state = 'fall'; m.fallY0 = m.y; m.vy = 0; return; }
    m.g = gi; m.y = floorY(gi, m.x + 8);
    if (moved) {
      m.state = 'walk'; m.walkT++;
      if (m.walkT % 8 === 0) Sound.walk();
    } else { m.state = 'stand'; m.walkT = 0; }

    if (m.hammer <= 0) {
      if (inp.jumpEdge) {
        m.state = 'jump'; m.jumpT = 0; m.jumpDir = moved ? m.dir : 0; m.jumpY0 = m.y; m.jumped = [];
        Sound.jump();
        return;
      }
      if (inp.up || inp.down) {
        const l = findLadder(m, inp.up);
        if (l) {
          m.state = 'climb'; m.ladder = l; m.x = l.x - 4; m.climbT = 0; m.subY = 0;
          return;
        }
      }

  }

    const l = m.ladder, top = ladderTop(l), bot = ladderBottom(l);
    const cs = CLIMB_SPEED * playerSpeed();
    if (inp.up !== inp.down) {
      const dy = inp.up ? -cs : cs;
      let ny = m.y + dy;
      if (l.broken) {
        if (inp.up && m.y <= bot && m.y > top + l.up && ny < bot - l.down) ny = bot - l.down;
        if (inp.down && m.y >= top && m.y < bot - l.down && ny > top + l.up) ny = top + l.up;
      }
      ny = Math.max(top, Math.min(bot, ny));
      if (ny !== m.y) { m.y = ny; m.climbT += Math.abs(dy); }

        m.state = 'stand'; m.g = l.hi; m.ladder = null; m.y = top;

    m.y = m.jumpY0 - arc;

    for (const f of game.fireballs) if (!m.jumped.includes(f) && f.y - 12 > m.y - 2 && Math.abs(f.x + 8 - (m.x + 8)) < 6) m.jumped.push(f);

      if (gi >= 0) { landMario(m, gi, floorY(gi, m.x + 8)); return; }
    }

  }

  if (m.state === 'fall') {
    m.vy = Math.min(4, m.vy + 0.25);
    const prev = m.y;
    m.y += m.vy;
    const gi = floorBetween(m.x + 8, prev, m.y);
    if (gi >= 0) { landMario(m, gi, floorY(gi, m.x + 8)); return; }
    if (m.y > SH + 16) { m.y = SH; killMario('fall') || resetMarioToStart(); }
    return;
  }
}
function resetMarioToStart() {
  const st = game.stage, m = game.mario;
  m.x = st.start.x; m.g = st.start.g; m.y = st.girders[st.start.g].fn(m.x + 8); m.state = 'stand'; m.vy = 0;
}

/* ------------------------------------------------------------------ *
 * Kong and the barrels
 * ------------------------------------------------------------------ */
function throwInterval() {
  const base = Math.max(90, 150 - (game.difficulty - 1) * 12);
  let f = base * 100 / Math.max(10, settings.throwRate);
  if (randInt(32) === 0) f += 30;          // the arcade's 1-in-32 extra pause
  return Math.round(f);
}
function updateKong() {
  const k = game.kong;
  k.t++;
  if (game.stage.kind === 'rivets') {
    k.pose = (Math.floor(k.t / 20) & 1) ? 'k_beatR' : 'k_beatL';
    return;
  }
  k.phaseT++;
  if (k.phase === 'idle') {
    k.pose = k.phaseT % 90 < 60 ? 'k_idle' : ((Math.floor(k.phaseT / 15) & 1) ? 'k_beatR' : 'k_beatL');
    if (k.phaseT >= k.nextThrow && game.barrels.length < 12) {
      k.phase = 'grab'; k.phaseT = 0;
      game.barrelCount++;
      k.blue = (game.barrelCount - 1) % BLUE_EVERY === 0;
      k.wild = game.barrelCount === 1 || rand() < 0.02 + game.difficulty * 0.015;
    }
  } else if (k.phase === 'grab') {
    k.pose = 'k_grab';
    if (k.phaseT >= 16) { k.phase = 'hold'; k.phaseT = 0; }
  } else if (k.phase === 'hold') {
    k.pose = k.blue ? 'k_holdBlue' : 'k_hold';
    if (k.phaseT >= 16) {
      if (k.wild) { dropWildBarrel(); k.phase = 'idle'; k.phaseT = 0; k.nextThrow = throwInterval(); }
      else { k.phase = 'throw'; k.phaseT = 0; throwBarrel(); }
    }
  } else if (k.phase === 'throw') {
    k.pose = 'k_throw';
    if (k.phaseT >= 14) { k.phase = 'idle'; k.phaseT = 0; k.nextThrow = throwInterval(); }
  }
}
function throwBarrel() {
  const k = game.kong;
  const gi = 5, x = 64;
  game.barrels.push({ x, y: floorY(gi, x + 6), g: gi, dir: 1, state: 'roll', blue: k.blue, wild: false, anim: 0, vy: 0, subX: 0, passG: -1 });
  Sound.throwBarrel();
}
function dropWildBarrel() {
  const k = game.kong;
  game.barrels.push({ x: 36, y: 84, g: -1, dir: -1, state: 'fall', blue: k.blue, wild: true, anim: 0, vy: 0, subX: 0, passG: -1, drift: game.barrelCount === 1 ? -0.25 : (rand() < 0.5 ? -0.6 : 0.6) });
  Sound.throwBarrel();
}

/* Don Hodges' decompilation of the arcade's ladder decision (see README) */
function barrelTakesLadder(b) {
  const m = game.mario;
  if (!game.oilLit) return true;
  if (m.y + 1 < b.y) return false;                   // barrel already level with or below Jumpman
  const md = Math.floor(game.difficulty / 2) + 1;
  const r = randInt(256);
  if ((r & 3) >= md) return false;
  const bx = b.x + 6, mx = m.x + 8;
  if (Math.abs(bx - mx) < 2) return true;
  if (bx < mx && game.input.left) return true;
  if (bx > mx && game.input.right) return true;
  return (r & 0x18) === 0;
}

function updateBarrel(b) {
  const spd = BARREL_SPEED * enemySpeed();
  b.anim++;
  if (b.state === 'roll') {
    const gd = game.stage.girders[b.g];
    b.subX += spd;
    while (b.subX >= 1) {
      b.subX -= 1;
      const px = b.x;
      b.x += b.dir;
      // ladder check at the moment the barrel's centre crosses a ladder centre
      for (const l of game.stage.ladders) {
        if (l.hi !== b.g || l.exit) continue;
        const lc = l.x + 4;
        if ((px + 6 - lc) * (b.x + 6 - lc) <= 0 && barrelTakesLadder(b)) {
          b.state = 'ladder'; b.x = l.x - 2; b.ladder = l; b.subX = 0;
          b.target = l.broken ? ladderTop(l) + l.up : ladderBottom(l);
          return;
        }
      }
    }
    const cx = b.x + 6;
    if (cx < gd.x0 || cx > gd.x1 || inHole(b.g, cx)) { b.state = 'fall'; b.vy = 0; return; }
    b.y = gd.fn(cx);
    // the oil drum swallows barrels at the bottom-left
    if (b.g === 0 && b.x + 12 <= 32) {
      b.state = 'dead';
      if (b.blue) { igniteOil(); }
    }
    return;
  }
  if (b.state === 'ladder') {
    b.y += spd;
    if (b.y >= b.target) {
      b.y = b.target;
      if (b.ladder.broken) { b.state = 'fall'; b.vy = 0; }
      else { b.g = b.ladder.lo; b.state = 'roll'; b.dir = downhill(game.stage.girders[b.g], b.x + 6) || (b.dir); if (b.g === 0) b.dir = -1; }
    }
    return;
  }
  if (b.state === 'fall') {
    b.vy = Math.min(3, b.vy + 0.2);
    const prev = b.y;
    b.y += b.vy;
    if (b.wild) {
      b.x += b.drift;
      if (b.x < 0) { b.x = 0; b.drift = Math.abs(b.drift); }
      if (b.x > SW - 12) { b.x = SW - 12; b.drift = -Math.abs(b.drift); }
    } else b.x += b.dir * 0.3;
    if (b.passG >= 0 && b.y > floorY(b.passG, b.x + 6) + 6) b.passG = -1;
    let gi = floorBetween(b.x + 6, prev, b.y);
    if (gi === b.passG) gi = -1;
    if (gi >= 0) {
      b.y = floorY(gi, b.x + 6);
      if (b.wild && gi > 0) { b.vy = -1.6; b.passG = gi; Sound.bounce(); return; }   // wild barrels bounce down through the girders
      b.g = gi; b.state = 'roll'; b.subX = 0;
      b.dir = downhill(game.stage.girders[gi], b.x + 6) || b.dir;
      if (gi === 0) b.dir = -1;
      if (b.wild) { b.wild = false; }
    }
    if (b.y > SH + 12) b.state = 'dead';
    return;
  }
}

function igniteOil() {
  const first = !game.oilLit;
  game.oilLit = true;
  game.oilFlash = 30;
  Sound.fire();
  if (game.fireballs.length < maxFireballs()) spawnFireball(16, 248, 0, 1);
}
function maxFireballs() { return game.stage.kind === 'rivets' ? Math.min(5, game.level + 1) : Math.min(5, game.level + 1); }
function spawnFireball(x, y, gi, dir) {
  game.fireballs.push({ x, y, g: gi, dir, state: 'walk', anim: 0, turnT: 60 + randInt(90), subX: 0, ladder: null });
}

/* ------------------------------------------------------------------ *
 * Fireballs: wander, reverse at girder ends, take ladders, chase more
 * as the internal difficulty rises.
 * ------------------------------------------------------------------ */
function fireSpeed() { return (0.5 + 0.1 * (game.difficulty - 1)) * enemySpeed(); }
function updateFireball(f) {
  const m = game.mario, spd = fireSpeed();
  f.anim++;
  if (f.state === 'walk') {
    const gd = game.stage.girders[f.g];
    f.subX += spd;
    while (f.subX >= 1) {
      f.subX -= 1;
      const px = f.x;
      f.x += f.dir;
      for (const l of game.stage.ladders) {
        if (l.broken || l.exit) continue;
        const lc = l.x + 4;
        if ((px + 8 - lc) * (f.x + 8 - lc) > 0) continue;
        let want = 0;
        const chase = game.difficulty >= 3 ? 0.6 : 0.3;
        if (l.lo === f.g && m.y < f.y - 8 && rand() < chase) want = -1;
        else if (l.hi === f.g && m.y > f.y + 8 && rand() < chase) want = 1;
        else if (rand() < 0.15) want = l.lo === f.g ? -1 : 1;
        if (want) {
          f.state = 'climb'; f.x = l.x - 4; f.ladder = l; f.cdir = want; f.subX = 0;
          f.target = want < 0 ? ladderTop(l) : ladderBottom(l);
          return;
        }
      }
    }
    if (f.x < gd.x0 - 4) { f.x = gd.x0 - 4; f.dir = 1; }
    if (f.x + 12 > gd.x1 + 4) { f.x = gd.x1 - 8; f.dir = -1; }
    f.y = gd.fn(Math.max(gd.x0, Math.min(gd.x1, f.x + 8)));
    if (--f.turnT <= 0) {
      f.turnT = 60 + randInt(120);
      const toward = m.x > f.x ? 1 : -1;
      const p = game.difficulty >= 4 ? 0.75 : 0.5;
      f.dir = rand() < p ? toward : -toward;
    }
    return;
  }
  if (f.state === 'climb') {
    f.y += f.cdir * spd;
    if ((f.cdir < 0 && f.y <= f.target) || (f.cdir > 0 && f.y >= f.target)) {
      f.y = f.target; f.g = f.cdir < 0 ? f.ladder.hi : f.ladder.lo; f.state = 'walk';
      f.dir = m.x > f.x ? 1 : -1;
    }
  }
}

/* ------------------------------------------------------------------ *
 * Hammer, items, rivets, collisions
 * ------------------------------------------------------------------ */
function hammerHeadBox(m) {
  const up = (Math.floor(m.hammerT / 8) & 1) === 1;
  if (up) return { x: m.x + 3, y: m.y - 26, w: 10, h: 8 };
  return m.dir < 0 ? { x: m.x - 14, y: m.y - 10, w: 14, h: 10 } : { x: m.x + 16, y: m.y - 10, w: 14, h: 10 };
}
function smashScore() { const r = randInt(4); return r === 0 ? 300 : r === 3 ? 800 : 500; }
function smash(x, y) {
  const pts = smashScore();
  addScore(pts);
  game.effects.push({ x: x - 2, y: y - 14, t: 0 });
  popup('s' + pts, x, y - 24);
  Sound.smash();
}

function checkCollisions() {
  const m = game.mario;
  if (m.state === 'dead') return;
  const mb = marioBox(m);
  // hammers
  for (const h of game.hammers) {
    if (h.taken || m.hammer > 0) continue;
    if (hit(mb, { x: h.x, y: h.y, w: 9, h: 10 }) && m.state !== 'climb') {
      h.taken = true; m.hammer = HAMMER_FRAMES; m.hammerT = 0;
      if (m.state === 'jump') { m.state = 'fall'; m.fallY0 = m.jumpY0; m.vy = 0; }
      Sound.item();
    }
  }
  // items
  for (const it of game.items) {
    if (it.taken) continue;
    const box = it.kind === 'parasol' ? { x: it.x, y: it.y, w: 16, h: 15 } : it.kind === 'hat' ? { x: it.x, y: it.y, w: 15, h: 8 } : { x: it.x, y: it.y, w: 9, h: 9 };
    if (hit(mb, box)) {
      it.taken = true; game.itemsTaken.push(it.i);
      const pts = game.level === 1 ? 300 : game.level === 2 ? 500 : 800;
      addScore(pts); popup('s' + pts, it.x, it.y - 10); Sound.item();
    }
  }
  // rivets: pulled when Jumpman's centre crosses one on its girder (walking or jumping over)
  for (const r of game.rivets) {
    if (r.taken) continue;
    const cx = m.x + 8;
    const over = cx >= r.x - 2 && cx < r.x + 10;
    if (over && ((m.g === r.g && (m.state === 'stand' || m.state === 'walk')) || (m.state === 'jump' && Math.abs(m.jumpY0 - r.y) <= 2))) {
      r.taken = true; game.rivetsDone.push(r.i); game.holes.push({ g: r.g, x: r.x });
      addScore(100); popup('s100', r.x - 4, r.y - 20); Sound.rivet();
      if (game.rivets.every(q => q.taken)) { winStage(); return; }
    }
  }
  // hammer smashes
  if (m.hammer > 0) {
    const hb = hammerHeadBox(m);
    for (const b of game.barrels) if (b.state !== 'dead' && hit(hb, barrelBox(b))) { b.state = 'dead'; smash(b.x, b.y); }
    for (const f of game.fireballs) if (f.state !== 'dead' && hit(hb, fireBox(f))) { f.state = 'dead'; smash(f.x, f.y); }
  }
  // deadly things
  if (m.flash > 0) return;
  for (const b of game.barrels) {
    if (b.state === 'dead' || !hit(mb, barrelBox(b))) continue;
    if (!killMario('barrel')) {
      // invulnerable: the barrel bonks off Jumpman
      b.dir = -b.dir; b.state = 'fall'; b.vy = -1.5; b.wild = false; b.g = -1;
    }
    return;
  }
  for (const f of game.fireballs) {
    if (f.state === 'dead' || !hit(mb, fireBox(f))) continue;
    if (!killMario('fire')) { f.dir = -f.dir; f.x += f.dir * 8; }
    return;
  }
  const k = game.stage.kong;
  if (game.stage.kind === 'barrels' && hit(mb, { x: k.x + 6, y: k.y + 2, w: 36, h: 30 })) {
    if (!killMario('kong')) { m.x = k.x + 46; }
  }
}

/* ------------------------------------------------------------------ *
 * Stage end sequences
 * ------------------------------------------------------------------ */
function winStage() {
  if (game.state !== 'play') return;
  game.state = 'win';
  game.seqT = 0;
  game.mario.hammer = 0;
  game.mario.state = 'stand';
  Sound.clear();
}
function finishStageAndAdvance() {
  addScore(game.bonus);
  game.bonus = 0;
  const order = stageOrder(game.level);
  game.stageIndex++;
  let firstOfLevel = false;
  if (game.stageIndex >= order.length) { game.stageIndex = 0; game.level++; firstOfLevel = true; }
  beginStage(firstOfLevel);
}
function loseLife() {
  game.lives--;
  if (game.lives < 0) {
    game.state = 'gameover';
    game.seqT = 0;
    savePersisted();
    showOverlay('over');
    return;
  }
  resetActors();
  startPlay();
}

/* ------------------------------------------------------------------ *
 * Main update (one 60 Hz frame)
 * ------------------------------------------------------------------ */
function updatePlay() {
  const m = game.mario;
  game.t++;
  // internal difficulty ramps every ~33 s, capped at 5
  if (++game.diffTimer >= DIFF_STEP && game.difficulty < 5) { game.diffTimer = 0; game.difficulty++; }
  // bonus timer
  if (settings.timer > 0) {
    if (++game.bonusTimer >= TIMER_TICK * settings.timer / 100) {
      game.bonusTimer = 0;
      game.bonus = Math.max(0, game.bonus - 100);
      if (game.bonus <= 1000 && game.bonus > 0) Sound.tick();
      if (game.bonus === 0) { killMario('timer'); if (game.state !== 'play') return; }
    }
  }
  // background bass
  if (game.stage.kind === 'barrels' && game.t % 15 === 0) Sound.bass(game.bassT++);
  if (game.oilFlash > 0) game.oilFlash--;

  updateMario();
  if (game.state !== 'play') return;
  updateKong();
  for (const b of game.barrels) if (b.state !== 'dead') updateBarrel(b);
  game.barrels = game.barrels.filter(b => b.state !== 'dead' && b.x > -16);
  for (const f of game.fireballs) if (f.state !== 'dead') updateFireball(f);
  game.fireballs = game.fireballs.filter(f => f.state !== 'dead');
  if (game.stage.kind === 'rivets' && game.fireballs.length < maxFireballs()) {
    if (--game.fireSpawnTimer <= 0) {
      game.fireSpawnTimer = 300;
      const left = game.fireballs.length % 2 === 0;
      spawnFireball(left ? 0 : SW - 16, 248, 0, left ? 1 : -1);
    }
  }
  checkCollisions();
  for (const e of game.effects) e.t++;
  game.effects = game.effects.filter(e => e.t < 24);
  for (const p of game.popups) p.t--;
  game.popups = game.popups.filter(p => p.t > 0);
  game.pauline.t++;
}

function update() {
  if (game.paused) return;
  game.frame++;
  if (game.flash > 0) game.flash--;
  const s = game.state;
  if (s === 'menu') { game.pauline.t++; game.kong.t++; game.kong.pose = (Math.floor(game.kong.t / 20) & 1) ? 'k_beatR' : 'k_beatL'; return; }
  if (s === 'howhigh') {
    if (++game.seqT >= 150) {
      if (game.introPending) { game.state = 'intro'; game.seqT = 0; game.introPending = false; }
      else startPlay();
    }
    return;
  }
  if (s === 'intro') {
    // Kong climbs the two long ladders to his perch, then stomps.
    game.seqT++;
    if (game.seqT % 24 === 0 && game.seqT < 300) Sound.intro(game.seqT / 24);
    if (game.seqT === 320) Sound.stomp();
    if (game.seqT >= 400 || game.input.jumpEdge) startPlay();
    game.pauline.t++;
    return;
  }
  if (s === 'ready') {
    if (++game.seqT >= 120) { game.state = 'play'; game.seqT = 0; }
    game.pauline.t++;
    return;
  }
  if (s === 'play') { updatePlay(); return; }
  if (s === 'dying') {
    game.mario.deadT++;
    if (game.mario.deadT >= 150) loseLife();
    return;
  }
  if (s === 'win') {
    game.seqT++;
    game.pauline.t++;
    if (game.stage.kind === 'rivets') {
      const k = game.kong;
      if (game.seqT === 60) Sound.kongFall();
      if (game.seqT > 60 && k.y < 216) k.y = Math.min(216, k.y + 3);
      k.pose = game.seqT < 60 ? ((Math.floor(game.seqT / 10) & 1) ? 'k_beatR' : 'k_beatL') : k.y < 216 ? 'k_fall' : ((Math.floor(game.seqT / 20) & 1) ? 'k_dead2' : 'k_dead1');
    } else {
      const k = game.kong;
      if (game.seqT > 90) { k.pose = (Math.floor(game.seqT / 12) & 1) ? 'k_climb2' : 'k_climb1'; k.x = 52; k.y -= 0.5; }
    }
    if (game.seqT >= 240) finishStageAndAdvance();
    return;
  }
}

/* ------------------------------------------------------------------ *
 * Rendering
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
canvas.width = SW; canvas.height = SH;

function resize() {
  const k = Math.max(1, Math.floor(Math.min(window.innerWidth / SW, window.innerHeight / SH)));
  canvas.style.width = SW * k + 'px';
  canvas.style.height = SH * k + 'px';
}

const RECOLOUR_100 = { C: 'Y', G: 'Y' };

function drawStage() {
  const st = game.stage;
  const tile = st.tile;
  // girders, tile by tile (the slope is a 1 px step every 16 px, as on the arcade)
  st.girders.forEach((gd, gi) => {
    for (let x = gd.x0; x <= gd.x1 - 7; x += 8) {
      if (inHole(gi, x)) continue;
      draw(tile, x, gd.fn(x));
    }
  });
  // ladders
  const lc = PAL[st.ladderColour];
  ctx.fillStyle = lc;
  for (const l of st.ladders) {
    const top = l.top !== undefined ? l.top : ladderTop(l) + 8;
    const bot = ladderBottom(l);
    if (!l.broken) drawLadder(l.x, top, bot, lc);
    else {
      const hiBottom = ladderTop(l) + 8;
      drawLadder(l.x, hiBottom, hiBottom + l.up, lc);
      drawLadder(l.x, bot - l.down, bot, lc);
    }
  }
  if (st.supports) {
    for (const sx of st.supports) ctx.fillRect(sx, 56, 2, 32);
  }
}
function drawLadder(x, y0, y1, colour) {
  if (y1 <= y0) return;
  ctx.fillStyle = colour;
  ctx.fillRect(x, y0, 1, y1 - y0);
  ctx.fillRect(x + 7, y0, 1, y1 - y0);
  for (let y = y0 + 1; y < y1; y += 4) ctx.fillRect(x, y, 8, 1);
}

function drawMario() {
  const m = game.mario;
  if (!m) return;
  const flip = m.dir > 0;      // native frames face left
  if (m.state === 'dead') {
    const t = m.deadT;
    if (t < 90) draw(['m_dead', 'm_dead1', 'm_dead2', 'm_dead3'][Math.floor(t / 8) & 3], m.x, m.y - 16, false);
    else { draw('m_dead2', m.x, m.y - 16, false); draw('halo', m.x + 4, m.y - 24); }
    return;
  }
  if (m.flash > 0 && (m.flash & 2)) return;    // harmless-bonk flash
  if (m.hammer > 0) {
    const up = (Math.floor(m.hammerT / 8) & 1) === 1;
    const name = up ? 'm_hammer1' : 'm_hammer0';
    const warn = m.hammer < 120 && (Math.floor(m.hammer / 6) & 1);
    const map = warn ? { D: 'Y' } : null;
    if (flip) draw(name, m.x, m.y - 26, true, map); else draw(name, m.x - 14, m.y - 26, false, map);
    return;
  }
  let name = 'm_stand';
  if (m.state === 'walk') name = ['m_stand', 'm_walk1', 'm_stand', 'm_walk2'][Math.floor(m.walkT / 4) & 3];
  else if (m.state === 'jump' || m.state === 'fall') name = 'm_jump';
  else if (m.state === 'climb') {
    const top = ladderTop(m.ladder);
    if (m.y - top < 8 && m.y - top > 0) { draw('m_top', m.x, m.y - 16 + Math.floor((m.y - top) / 2)); return; }
    draw('m_climb', m.x, m.y - 16, (Math.floor(m.climbT / 4) & 1) === 1);
    return;
  }
  draw(name, m.x, m.y - 16, flip);
}

function drawKong() {
  const k = game.kong;
  const def = SPR[k.pose];
  draw(k.pose, k.x, k.y + 32 - def[1]);
}
function drawPauline() {
  const p = game.pauline, st = game.stage;
  const frame = (Math.floor(p.t / 30) & 1) ? 'p_1' : 'p_0';
  draw(frame, p.x, p.y);
  if (Math.floor(p.t / 60) & 1) draw('help', st.help.x, st.help.y);
}
function drawBarrel(b) {
  if (b.state === 'ladder') draw(b.blue ? 'bb_side' + ((b.anim >> 3) & 1) : 'b_side' + ((b.anim >> 3) & 1), b.x - 2, b.y - 10);
  else {
    const fr = b.dir > 0 ? (b.anim >> 2) & 3 : 3 - ((b.anim >> 2) & 3);
    draw((b.blue ? 'bb_roll' : 'b_roll') + fr, b.x, b.y - 10);
  }
}
function drawHUD(noBonus) {
  const st = game.stage;
  if (game.frame % 32 < 16 || game.state !== 'play') text('1UP', 24, 0, PAL.R);
  text(pad(game.score, 6), 8, 8, PAL.W);
  text('HIGH SCORE', 72, 0, PAL.R);
  text(pad(Math.max(currentHigh(), game.score), 6), 88, 8, PAL.W);
  for (let i = 0; i < Math.min(6, game.lives); i++) draw('m_life', 8 + i * 8, 24);
  text('L=' + pad(game.level, 2), 168, 24, PAL.B);
  if (!noBonus) {
    const map = st.kind === 'rivets' ? RECOLOUR_100 : null;
    draw('bonusbox', 171, 40, false, map);
    text(pad(game.bonus, 4), 176, 48, st.kind === 'rivets' ? PAL.Y : PAL.C);
  }
  if (settings.invuln) text('INVULNERABLE', 64, 24, PAL.Y);
}

function drawHowHigh() {
  draw('k_head', 40, 40);
  text('HOW HIGH CAN', 96, 48, PAL.C);
  text('YOU GET ?', 96, 60, PAL.C);
  const order = stageOrder(game.level);
  const y0 = 232;
  order.forEach((st, i) => {
    const y = y0 - i * 40;
    for (let x = 48; x <= 160; x += 8) draw('girder25', x, y);
    text((st === STAGE_25 ? String(25 * (i + 1)) : '100') + ' m', 104, y - 10, PAL.C);
    if (i === game.stageIndex) draw('m_stand', 64, y - 16, true);
  });
}

function drawIntro() {
  // Kong carries Pauline up the long ladders, then jumps onto his girder.
  drawStage();
  const t = game.seqT;
  const climbEnd = 300;
  if (t < climbEnd) {
    const y = 240 - (240 - 48) * (t / climbEnd);
    const pose = (Math.floor(t / 12) & 1) ? 'k_climb2' : 'k_climb1';
    draw(pose, 56, y - 36);
  } else {
    draw(t < 320 ? 'k_hold' : ((Math.floor(t / 20) & 1) ? 'k_beatR' : 'k_beatL'), game.stage.kong.x, game.stage.kong.y);
    draw('p_0', game.pauline.x, game.pauline.y);
  }
  draw('b_stack', game.stage.stack.x, game.stage.stack.y);
  draw('oil', game.stage.oil.x, game.stage.oil.y);
}

function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, SW, SH);
  const s = game.state;
  if (s === 'menu') { drawTitle(); return; }
  if (s === 'howhigh') { drawHUD(true); drawHowHigh(); return; }
  if (s === 'intro') { drawHUD(); drawIntro(); return; }
  const st = game.stage;
  drawStage();
  for (const r of game.rivets) if (!r.taken) draw('rivet', r.x, r.y - 1);
  for (const it of game.items) if (!it.taken) draw(it.kind, it.x, it.y);
  if (st.oil) {
    draw('oil', st.oil.x, st.oil.y);
    if (game.oilLit) draw('flame' + ((game.frame >> 3) & 3), st.oil.x, st.oil.y - 16, false, game.oilFlash > 0 && (game.frame & 2) ? { R: 'L', Y: 'C' } : null);
  }
  if (st.stack) draw('b_stack', st.stack.x, st.stack.y);
  if (!(s === 'win' && st.kind === 'barrels' && game.seqT > 220)) drawKong();
  if (!(s === 'win' && game.seqT > 90 && st.kind === 'barrels')) drawPauline();
  for (const h of game.hammers) if (!h.taken) draw('hammer', h.x, h.y);
  for (const b of game.barrels) drawBarrel(b);
  for (const f of game.fireballs) draw('f_' + ((f.anim >> 3) & 1), f.x, f.y - 16, f.dir > 0);
  drawMario();
  for (const e of game.effects) draw('x_' + Math.min(3, Math.floor(e.t / 6)), e.x, e.y);
  for (const p of game.popups) draw(p.kind, p.x, p.y);
  if (s === 'win' && game.seqT < 90) {
    const m = game.mario, p = game.pauline;
    draw(game.seqT < 60 ? 'heart' : 'heart', (m.x + p.x) / 2, Math.min(m.y, p.y + 22) - 36);
  }
  if (s === 'win' && st.kind === 'rivets' && game.seqT > 120) {
    draw('heart', 104, 60);
  }
  if (s === 'ready' && game.seqT < 120) text('PLAYER (1)', 72, 128, PAL.C);
  if (game.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, 0, SW, SH); }
  drawHUD();
}

function drawTitle() {
  draw('logo', 12, 64);
  text('1UP', 24, 0, PAL.R);
  text(pad(0, 6), 8, 8, PAL.W);
  text('HIGH SCORE', 72, 0, PAL.R);
  text(pad(currentHigh(), 6), 88, 8, PAL.W);
  text('L=00', 168, 24, PAL.B);
  const k = game.kong;
  draw(k.pose, 88, 176);
  text('(C) NINTENDO 1981', 40, 224, PAL.Y);
}

/* ------------------------------------------------------------------ *
 * Menu / overlay
 * ------------------------------------------------------------------ */
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const subEl = document.getElementById('sub');
const presetsEl = document.getElementById('presets');
const knobsEl = document.getElementById('knobs');
const scoresEl = document.getElementById('scores');
const playBtn = document.getElementById('play');
let overlayMode = 'menu';
let menuSel = KNOBS.length;    // focused row: 0..KNOBS.length-1 knobs, KNOBS.length = play

const presetBtns = {};
for (const p of PRESET_ORDER) {
  const b = document.createElement('button');
  b.textContent = p.toUpperCase();
  b.addEventListener('click', () => { Sound.unlock(); applyPreset(p); refreshMenu(); });
  presetsEl.appendChild(b);
  presetBtns[p] = b;
}
const knobRows = KNOBS.map((k, i) => {
  const row = document.createElement('div');
  row.className = 'knob';
  const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = k.label;
  const minus = document.createElement('button'); minus.textContent = '-';
  const val = document.createElement('span'); val.className = 'val';
  const plus = document.createElement('button'); plus.textContent = '+';
  minus.addEventListener('click', () => { Sound.unlock(); menuSel = i; bumpKnob(k, -1); });
  plus.addEventListener('click', () => { Sound.unlock(); menuSel = i; bumpKnob(k, 1); });
  row.appendChild(lbl); row.appendChild(minus); row.appendChild(val); row.appendChild(plus);
  knobsEl.appendChild(row);
  return { row, val };
});
function bumpKnob(k, d) {
  const i = k.values.indexOf(settings[k.key]);
  const n = Math.max(0, Math.min(k.values.length - 1, (i < 0 ? 0 : i) + d));
  setKnob(k.key, k.values[n]);
  refreshMenu();
}
function refreshMenu() {
  for (const p of PRESET_ORDER) presetBtns[p].classList.toggle('sel', settings.preset === p);
  KNOBS.forEach((k, i) => {
    knobRows[i].val.textContent = k.fmt(settings[k.key]);
    knobRows[i].val.classList.toggle('on', k.key === 'invuln' && settings.invuln);
    knobRows[i].row.classList.toggle('focus', overlayMode !== 'pause' && menuSel === i);
  });
  playBtn.classList.toggle('focus', menuSel === KNOBS.length);
  const names = { kid: 'KID', easy: 'EASY', normal: 'NORMAL', original: 'ORIGINAL', custom: 'CUSTOM', invuln: 'INVULNERABLE*' };
  scoresEl.innerHTML = 'HIGH SCORES &nbsp; ' + ['kid', 'easy', 'normal', 'original', 'custom', 'invuln']
    .filter(k => high[k] > 0 || k === settings.preset)
    .map(k => names[k] + ' ' + high[k]).join(' &nbsp;&middot;&nbsp; ') +
    (settings.invuln ? '<br>* invulnerable runs are scored separately' : '');
  updateSub();
}
function updateSub() {
  if (overlayMode === 'over') {
    subEl.innerHTML = 'SCORE ' + game.score + (game.score >= currentHigh() && game.score > 0 ? ' &mdash; NEW BEST!' : ' &mdash; BEST ' + currentHigh()) + '<br>LEVEL ' + game.level + ' &nbsp; ' + game.stage.name;
  } else if (overlayMode === 'pause') {
    subEl.innerHTML = 'LEVEL ' + game.level + ' &nbsp; ' + game.stage.name + ' &mdash; SCORE ' + game.score;
  } else {
    const blurb = { kid: 'SLOW BARRELS, NO FALL DAMAGE, LONG TIMER', easy: 'A GENTLER ARCADE', normal: 'THE ARCADE WITH A SOFTER TIMER', original: 'EXACTLY THE 1981 MACHINE (DIP DEFAULTS)', custom: 'YOUR OWN MIX' };
    subEl.innerHTML = (settings.preset === 'custom' ? 'CUSTOM' : settings.preset.toUpperCase()) + ' &mdash; ' + blurb[settings.preset] + (settings.invuln ? '<br>INVULNERABLE: BARRELS JUST BONK' : '');
  }
}
function showOverlay(mode) {
  overlayMode = mode;
  overlay.classList.remove('hidden');
  const showKnobs = mode !== 'pause';
  presetsEl.style.display = showKnobs ? '' : 'none';
  knobsEl.style.display = showKnobs ? '' : 'none';
  if (mode === 'pause') { titleEl.textContent = 'PAUSED'; titleEl.style.color = '#ffb600'; playBtn.textContent = 'RESUME'; }
  else if (mode === 'over') { titleEl.textContent = 'GAME OVER'; titleEl.style.color = '#ff5555'; playBtn.textContent = 'PLAY AGAIN'; }
  else { titleEl.textContent = 'DONKEY KONG'; titleEl.style.color = '#ff6800'; playBtn.textContent = 'PLAY'; }
  menuSel = KNOBS.length;
  refreshMenu();
}
function hideOverlay() { overlay.classList.add('hidden'); }

function startPlaying() {
  Sound.unlock();
  hideOverlay();
  game.paused = false;
  newGame();
}
playBtn.addEventListener('click', () => {
  if (overlayMode === 'pause') { game.paused = false; hideOverlay(); }
  else startPlaying();
});
function togglePause() {
  if (game.state === 'menu' || game.state === 'gameover') return;
  game.paused = !game.paused;
  if (game.paused) showOverlay('pause'); else hideOverlay();
}
function toMenu() {
  savePersisted();
  game.paused = false;
  game.state = 'menu';
  game.stage = STAGE_25;
  resetActors();
  showOverlay('menu');
}

/* ------------------------------------------------------------------ *
 * Input
 * ------------------------------------------------------------------ */
function keyDir(k) {
  if (k === 'ArrowUp' || k === 'w' || k === 'W') return 'up';
  if (k === 'ArrowDown' || k === 's' || k === 'S') return 'down';
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') return 'left';
  if (k === 'ArrowRight' || k === 'd' || k === 'D') return 'right';
  return null;
}
function menuKey(k) {
  const d = keyDir(k);
  if (d === 'up') { menuSel = (menuSel + KNOBS.length) % (KNOBS.length + 1); refreshMenu(); return true; }
  if (d === 'down') { menuSel = (menuSel + 1) % (KNOBS.length + 1); refreshMenu(); return true; }
  if (d === 'left' || d === 'right') {
    if (menuSel < KNOBS.length) bumpKnob(KNOBS[menuSel], d === 'left' ? -1 : 1);
    else {
      const i = PRESET_ORDER.indexOf(settings.preset);
      const n = i < 0 ? (d === 'left' ? PRESET_ORDER.length - 1 : 0) : (i + (d === 'left' ? -1 : 1) + PRESET_ORDER.length) % PRESET_ORDER.length;
      applyPreset(PRESET_ORDER[n]); refreshMenu();
    }
    return true;
  }
  return false;
}
window.addEventListener('keydown', (e) => {
  const k = e.key;
  const inMenu = !overlay.classList.contains('hidden');
  if (inMenu && overlayMode !== 'pause') {
    if (menuKey(k)) { e.preventDefault(); Sound.unlock(); return; }
  }
  if (k === ' ' || k === 'Enter') {
    e.preventDefault();
    if (inMenu) { playBtn.click(); return; }
    if (!game.input.jump) { game.input.jump = true; game.input.jumpEdge = true; }
    Sound.unlock();
    return;
  }
  const d = keyDir(k);
  if (d) { e.preventDefault(); if (!inMenu) { game.input[d] = true; Sound.unlock(); } return; }
  if (k === 'p' || k === 'P') { togglePause(); return; }
  if (k === 'm' || k === 'M') { Sound.unlock(); Sound.toggle(); return; }
  if (k === 'Escape') { if (game.state === 'menu') return; toMenu(); return; }
});
window.addEventListener('keyup', (e) => {
  const k = e.key;
  if (k === ' ' || k === 'Enter') { game.input.jump = false; return; }
  const d = keyDir(k);
  if (d) game.input[d] = false;
});
window.addEventListener('blur', () => { for (const k in game.input) game.input[k] = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && game.state === 'play' && !game.paused) togglePause();
});

/* ------------------------------------------------------------------ *
 * Main loop: fixed 60 Hz step with an accumulator
 * ------------------------------------------------------------------ */
const STEP = 1 / FPS;
let last = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 10) { update(); game.input.jumpEdge = false; acc -= STEP; }
  render();
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */
loadPersisted();
game.stage = STAGE_25;
resetActors();
game.state = 'menu';
showOverlay('menu');
resize();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);
/* peek + frame stepper for browser automation and debugging (not used by the game) */
window.DK_DEBUG = { game, settings, high, step(n) { for (let i = 0; i < (n || 1); i++) { update(); game.input.jumpEdge = false; } render(); } };

})();
</script>
</body>
