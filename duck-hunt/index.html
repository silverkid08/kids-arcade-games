<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>DUCK HUNT</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Courier New", Courier, monospace; font-weight: bold;
    color: #fff; -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #stage { position: relative; }
  canvas#screen { display: block; background: #000; image-rendering: pixelated; cursor: none; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; gap: 8px;
    background: rgba(0,0,0,.84); text-align: center; padding: 10px 10px 12px; overflow-y: auto;
  }
  #overlay.hidden { display: none; }
  #logo { image-rendering: pixelated; margin-top: 4px; }
  #sub { margin: 0; font-size: 12px; line-height: 1.7; color: #e8e8e8; letter-spacing: 1px; min-height: 1.7em; }
  #sub b { color: #fcbcb0; }
  #presets { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #presets .lbl, .knob .lbl { font-size: 10px; color: #fc9838; letter-spacing: 1px; }
  #presets button, .btnrow button {
    min-width: 64px; height: 28px; font: inherit; font-size: 11px; letter-spacing: 1px; color: #fff; padding: 0 8px;
    background: #082040; border: 2px solid #3cbcfc; border-radius: 5px; cursor: pointer;
  }
  #presets button:hover, .btnrow button:hover { border-color: #fff; }
  #presets button.sel { background: #3cbcfc; border-color: #fff; color: #000; }
  #presets.row-sel .lbl { color: #ffff60; }
  #presets .custom { font-size: 11px; color: #fcbcb0; letter-spacing: 1px; }
  #knobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 2px 10px; width: 100%; max-width: 700px; }
  .knob { display: grid; grid-template-columns: 1fr 26px 118px 26px; align-items: center; gap: 4px;
          padding: 1px 6px; border-radius: 4px; border: 1px solid transparent; }
  .knob.sel { border-color: #ffff60; background: rgba(255,255,96,.08); }
  .knob.dim { opacity: .45; }
  .knob .lbl { text-align: left; }
  .knob .val { font-size: 11px; color: #fff; letter-spacing: 1px; }
  .knob button {
    width: 26px; height: 22px; font: inherit; font-size: 13px; color: #fff; padding: 0;
    background: #082040; border: 2px solid #3cbcfc; border-radius: 4px; cursor: pointer; line-height: 1;
  }
  .knob button:hover { border-color: #fff; }
  .knob.on .val { color: #ffff60; }
  #highs, #pstats { font-size: 10px; color: #bdbdbd; letter-spacing: 1px; line-height: 1.7; }
  #highs b, #pstats b { color: #fff; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #play {
    font: inherit; font-size: 15px; letter-spacing: 3px; padding: 9px 22px; min-width: 120px; height: auto;
    color: #000; background: #80d010; border: 2px solid #80d010; border-radius: 5px; cursor: pointer;
  }
  #play:hover, #play.sel { background: #fff; border-color: #ffff60; }
  .hint { margin: 0; font-size: 10px; color: #8b8b8b; line-height: 1.8; letter-spacing: 1px; }
  #history { width: 100%; max-width: 700px; font-size: 11px; letter-spacing: 1px; }
  #history.hidden, #mainmenu.hidden { display: none; }
  #history table { width: 100%; border-collapse: collapse; margin: 6px 0; }
  #history th { color: #fc9838; font-size: 10px; text-align: right; padding: 3px 4px; border-bottom: 1px solid #333; }
  #history td { text-align: right; padding: 3px 4px; color: #ddd; border-bottom: 1px solid #1a1a1a; }
  #history th:first-child, #history td:first-child { text-align: left; }
  #history .trend { color: #80d010; }
  #mainmenu { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" width="256" height="240"></canvas>
  <div id="overlay">
    <canvas id="logo" width="192" height="96"></canvas>
    <p id="sub"></p>
    <div id="mainmenu">
      <div id="presets"><span class="lbl">PRESET</span></div>
      <div id="knobs"></div>
      <div id="highs"></div>
      <div id="pstats"></div>
      <div class="btnrow">
        <button id="play">PLAY</button>
        <button id="resume">RESUME</button>
        <button id="showhist">PROGRESS</button>
      </div>
      <p class="hint">MOUSE aims &nbsp;&middot;&nbsp; LEFT CLICK (or tap) fires &nbsp;&middot;&nbsp; P pause &nbsp;&middot;&nbsp; M sound &nbsp;&middot;&nbsp; ESC menu<br>
        menu: &uarr;&darr; pick a row, &larr;&rarr; change it, 1-4 presets, ENTER play</p>
    </div>
    <div id="history" class="hidden">
      <div id="histbody"></div>
      <div class="btnrow"><button id="hideh">BACK</button><button id="clearh">CLEAR HISTORY</button></div>
    </div>
  </div>
</div>

   with the mouse instead of the Zapper.

   Everything that decides how the game plays was transcribed from the

   in reference/disasm/): the 16-direction movement patterns, the
   step-per-frame speed table, the per-round speed / score / fly-away /
   hit-box tables, the edge bounce rule, the Game B flight scripts, the
   dog's animation scripts, the hit-quota table, the round-end shuffle and
   the PERFECT bonus.  Labels like CA19 / CB77 in comments are the ROM
   routines they mirror.  The art is the genuine NES graphics (rips +
   a real screenshot, see README), the music and effects are decoded from
   the ROM's own sound data and played with WebAudio.

   Coordinates are NES pixels: 256x240, x right, y down.  A duck's (x, y)
   is its centre, as in the ROM.  Kid-mode additions: presets / knobs,
   aim helpers, hover-to-fire, no-fail mode and mouse-skill statistics.
   ===================================================================== */

    const hz = 1789773 / NOISE_PERIOD[p & 15];

      ps.sessions++; ps.shots += sum.shots; ps.hits += sum.hits; ps.best = Math.max(ps.best, sum.best);
      ps.bestAcc = Math.max(ps.bestAcc, sum.acc);
      if (sum.react && (!ps.bestReact || sum.react < ps.bestReact)) ps.bestReact = sum.react;
      ps.last = { acc: sum.acc, react: sum.react, best: sum.best };
      lsSet('stats.' + game.preset, JSON.stringify(ps));
    }
    game.lastSummary = sum;
  }
  if (toMenu) toMenu_('gameover');
}

/* ------------------------------------------------------------------ *
 * Main update (one NES frame)
 * ------------------------------------------------------------------ */
function globalTimers() {              // HandleGlobalTimers_C348
  if (game.timer2B) game.timer2B--;
  if (--game.timing < 0) { game.timing = 10; if (game.timer2D) game.timer2D--; }
}
function msgSeqTick() {                // C7FB
  if (game.timer2B || !game.msgSeq) return;
  const v = MSG_SEQ[game.msgSeq];
  if (v === 0xAA) { game.msgSeq = 0; return; }
  game.msg = v; game.timer2B = MSG_SEQ[game.msgSeq + 1]; game.msgSeq += 2;
}
function duckGameTick() {              // ExecuteDuckGame_C86E
  aimPoint();
  if (input.fire) fire(input.ax, input.ay);
  hoverTick();
  dogTick();
  const [d0, d1] = game.ducks;
  if (d0.active) duckTick(d0);
  if (d1.active) duckTick(d1);
  if (game.zapper) {                   // C8B4
    let y = game.q9f; if (y === 0) y = game.shots ? 0x41 : 0x15; game.q9f = y - 1;
    if (game.pending) { if (game.a6) game.a6--; }
    else if (!d0.state && !d1.state && !game.timer2B && game.mode === 'duck') {
      const got = game.shotDucks > 0;
      game.dog.state = got ? 0x0C : 0x0A;
      game.pink = false;
      game.timer2B = 0x40; game.zapper = false; game.msg = 0;
    }
  }
  game.iconTimer++;
  if (game.zapper && game.shots === 0) game.shotBlink++; else game.shotBlink = 0;
  for (const p of game.pops) p.t--;
  game.pops = game.pops.filter(p => p.t > 0);
  msgSeqTick();
}
function update() {
  input.over = false;
  if (game.mode === 'menu') { game.frame++; input.fire = false; return; }
  if (game.paused) {
    if (game.unpause > 0 && --game.unpause === 0) { game.paused = false; game.msg = game.savedMsg || 0; }
    input.fire = false; return;
  }
  game.frame++;
  globalTimers();
  if (game.flash.length) game.flash.shift();
  switch (game.mode) {
    case 'duck': duckGameTick(); break;
    case 'roundend': aimPoint(); roundEndTick(); break;
    case 'wait': aimPoint(); waitTick(); break;
    case 'gameover': aimPoint(); gameOverTick(); break;
  }
  input.fire = false;
}

/* ------------------------------------------------------------------ *
 * Rendering into a 256x240 software framebuffer
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
canvas.width = SW; canvas.height = SH;
const img = ctx.createImageData(SW, SH);
const fb = new Uint32Array(img.data.buffer);

function put(x, y, c) { if (x >= 0 && x < SW && y >= 0 && y < SH) fb[y * SW + x] = c; }
function fillRect(x, y, w, h, c) {
  const x0 = Math.max(0, x), y0 = Math.max(0, y), x1 = Math.min(SW, x + w), y1 = Math.min(SH, y + h);
  for (let j = y0; j < y1; j++) fb.fill(c, j * SW + x0, j * SW + x1);
}
function drawSprite(s, ex, ey, flip, scale) {
  const sc = scale || 1;
  const L = flip ? ex - (s.x + s.w) * sc : ex + s.x * sc, R = flip ? ex - s.x * sc : ex + (s.x + s.w) * sc;
  const T = ey + s.y * sc, B = ey + (s.y + s.h) * sc;
  const x0 = Math.max(0, Math.floor(L)), x1 = Math.min(SW, Math.ceil(R)), y0 = Math.max(0, Math.floor(T)), y1 = Math.min(SH, Math.ceil(B));
  for (let y = y0; y < y1; y++) {
    const r = Math.floor((y + 0.5 - ey) / sc) - s.y; if (r < 0 || r >= s.h) continue;
    for (let x = x0; x < x1; x++) {
      let rel = (x + 0.5 - ex) / sc; if (flip) rel = -rel;
      const c = Math.floor(rel) - s.x; if (c < 0 || c >= s.w) continue;
      const v = s.px[r * s.w + c]; if (v >= 0) fb[y * SW + x] = PAL32[v];
    }
  }
}
function drawTile(t, x, y) {            // HUD pixels in the backdrop colour follow the backdrop (pink on FLY AWAY)
  const back = game.pink ? C.pink : C.sky;
  for (let j = 0; j < t.h; j++) for (let i = 0; i < t.w; i++) { const v = t.px[j * t.w + i]; if (v >= 0) put(x + i, y + j, v === 2 ? back : PAL32[v]); }
}
function drawBits(rows, x, y, c, bg) {
  for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++) {
    if (rows[j] & (0x80 >> i)) put(x + i, y + j, c); else if (bg !== undefined) put(x + i, y + j, bg);
  }
}
function drawText(s, x, y, c, bg) {
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]];
    if (g) drawBits(g, x + i * 8, y, c, bg); else if (bg !== undefined) fillRect(x + i * 8, y, 8, 8, bg);
  }
}
/* message box in the style of the HUD frames: black, thin rounded white border */
function drawBox(tx, ty, tw, th) {
  const x0 = tx * 8 + 3, y0 = ty * 8 + 3, x1 = (tx + tw) * 8 - 4, y1 = (ty + th) * 8 - 4;
  fillRect(x0 + 1, y0 + 1, x1 - x0 - 1, y1 - y0 - 1, C.black);
  for (let x = x0 + 2; x <= x1 - 2; x++) { put(x, y0, C.white); put(x, y1, C.white); }
  for (let y = y0 + 2; y <= y1 - 2; y++) { put(x0, y, C.white); put(x1, y, C.white); }
  put(x0 + 1, y0 + 1, C.white); put(x1 - 1, y0 + 1, C.white); put(x0 + 1, y1 - 1, C.white); put(x1 - 1, y1 - 1, C.white);
}
// MessageTilemapPointers_EC3A: box position/size in tiles and text rows
function drawMessage(id) {
  const T = (s, col, row, tx, ty) => drawText(s, (tx + col) * 8, (ty + row) * 8, C.white);
  switch (id) {
    case 1: {                          // ROUND n   ($20CD, 7x5)
      drawBox(13, 6, 7, 5); T('ROUND', 1, 1, 13, 6);
      const r = game.round; if (r >= 10) T(String(Math.floor(r / 10) % 10), 2, 3, 13, 6);
      T(String(r % 10), 3, 3, 13, 6); break;
    }
    case 4: drawBox(13, 6, 7, 5); T('GOOD¡', 1, 2, 13, 6); break;                     // $20CD
    case 5: {                          // PERFECT!! + bonus ($20CC, 10x5)
      drawBox(12, 6, 10, 5); T('PERFECT¡', 1, 1, 12, 6);
      const b = String(game.msgArg).padStart(5, ' '); T(b, 2, 3, 12, 6); break;
    }
    case 6: drawBox(12, 7, 10, 3); T('FLY AWAY', 1, 1, 12, 7); break;                     // $20EC
    case 7: drawBox(13, 6, 7, 5); T('PAUSE', 1, 2, 13, 6); break;                          // $20CC (+1 col)
    case 8: drawBox(11, 5, 11, 5); T('GAME OVER', 1, 2, 11, 5); break;                     // $20AB
    case 9: drawBox(11, 5, 11, 5); T('TRY AGAIN', 1, 2, 11, 5); break;                     // no-fail (not in the ROM)
  }
}
function drawHUD() {
  // round number (UpdateRoundNumber_C7B3): R=n, tens at $2305 when needed
  const r = game.round;
  if (r >= 10) { fillRect(48, 192, 8, 8, C.black); drawText(String(Math.floor(r / 10) % 10), 40, 192, C.green); drawText(String(r % 10), 48, 192, C.green); }
  else drawText(String(r % 10), 40, 192, C.green);
  // bullets ($2343)
  const show = game.mode === 'menu' ? 3 : (unlimited() ? 3 : Math.min(3, game.shots));
  for (let i = 0; i < show; i++) drawTile(HUD.bullet, 24 + i * 8, 208);
  // SHOT word blinks when out of shots (D428)
  if (game.shotBlink && (game.shotBlink & 8)) fillRect(24, 216, 24, 8, C.black);
  // hit table ($234C) with the blinking current targets (D3D2)
  const n = Math.min(10, game.hitTable.length || perRound());
  for (let i = 0; i < n; i++) {
    let t = game.hitTable[i] ? HUD.duckHit : HUD.duckLive;
    if (game.blinkAll) t = HUD.duckLive;
    let blank = false;
    if (game.mode === 'duck') for (const d of game.ducks) if (d.active && d.state === 3 && d.hitIndex === i + 1 && !(game.iconTimer & 0x10)) blank = true;
    if (!blank) drawTile(t, 96 + i * 8, 208);
  }
  // quota bar ($236C)
  for (let i = 0; i < Math.min(10, game.quota); i++) drawTile(HUD.quota, 96 + i * 8, 216);
  // score ($2358)
  drawText(String(game.score).padStart(6, '0'), 192, 208, C.white);
}
function drawDuck(d) {
  if (!d.active || d.state < 3 || d.state > 7) return;
  const s = DUCK_SPR[d.colour][d.image]; if (!s) return;
  drawSprite(s, d.x, d.y, !!d.horz, settings.size);
}
function drawDog() {
  const g = game.dog; if (!g.active || !g.visible || g.state === 0) return;
  const s = DOG_SPR[g.image]; if (!s) return;
  drawSprite(s, g.x, g.y, !!g.horz, 1);
}
function drawCrosshair() {
  const x = Math.round(input.ax), y = Math.round(input.ay);
  const R = [4, 6, 9, 13][settings.xsize], col = XCOLORS[settings.xcolor][1];
  const edge = settings.xcolor === 5 ? C.white : C.black;
  const plot = (px, py, c) => put(px, py, c);
  const ring = (rad, c) => { for (let a = 0; a < 360; a += 2) { const t = a * Math.PI / 180; plot(Math.round(x + Math.cos(t) * rad), Math.round(y + Math.sin(t) * rad), c); } };
  ring(R + 1, edge); ring(R - 1, edge); ring(R, col);
  for (let i = R - 3; i <= R + 3; i++) {
    for (const [dx, dy] of [[i, 0], [-i, 0], [0, i], [0, -i]]) { plot(x + dx, y + dy, col); }
  }
  for (let i = R - 3; i <= R + 3; i++) for (const [dx, dy] of [[i, 1], [-i, 1], [1, i], [1, -i], [i, -1], [-i, -1], [-1, i], [-1, -i]]) {
    const px = x + dx, py = y + dy; if (px >= 0 && px < SW && py >= 0 && py < SH && fb[py * SW + px] !== col) plot(px, py, edge);
  }
  plot(x, y, col);
  if (settings.fire === 'hover' && input.dwell > 0) {     // dwell progress arc
    const f = Math.min(1, input.dwell / settings.dwell);
    for (let a = 0; a < 360 * f; a += 3) { const t = (a - 90) * Math.PI / 180; plot(Math.round(x + Math.cos(t) * (R + 4)), Math.round(y + Math.sin(t) * (R + 4)), C.tgreen); }
  }
}
function drawStatsBox() {              // mouse-skill tally on the round-end / game-over screens
  const s = summarise(game.stats);
  drawBox(2, 11, 28, 4);
  drawText(('HIT ' + game.hits + '/' + perRound()).padEnd(12) + ('ACC ' + s.acc + '%'), 3 * 8, 96, C.white);
  drawText(('TIME ' + (s.react ? s.react.toFixed(2) + 'S' : '-')).padEnd(12) + ('BEST STREAK ' + s.best), 3 * 8, 106, C.white);
}
function drawTitle() {                 // Layout_TitleScreen_E404
  fillRect(0, 0, SW, SH, C.black);
  for (let j = 0; j < LOGO.h; j++) for (let i = 0; i < LOGO.w; i++) { const v = LOGO.px[j * LOGO.w + i]; if (v >= 0) put(32 + i, 24 + j, PAL32[v]); }
  drawText('GAME A   1 DUCK', 64, 136, C.white);
  drawText('GAME B   2 DUCKS', 64, 152, C.white);
  drawText('>', 48, isGameB() ? 152 : 136, C.white);
  drawText('TOP SCORE = ' + String(getHigh(highKey()) || 12000), 56, 192, C.tgreen);   // DefaultTopScores_E5DF
  drawText('©1984 NINTENDO CO`LTD.', 40, 208, C.white);
}
function render() {
  if (game.mode === 'menu') { drawTitle(); ctx.putImageData(img, 0, 0); return; }
  fb.fill(game.pink ? C.pink : C.sky);
  // sprites with background priority (behind the tree, bushes and grass)
  for (const d of game.ducks) drawDuck(d);
  if (game.dog.behind) drawDog();
  for (let i = 0; i < BG32.length; i++) { const c = BG32[i]; if (c) fb[i] = c; }
  drawHUD();
  if (game.msg) drawMessage(game.msg);
  if (game.paused) drawMessage(7);
  if (!game.dog.behind) drawDog();
  for (const p of game.pops) { drawBits(POP[p.tile], p.x, p.y, C.white); drawBits(POP['00'], p.x + 8, p.y, C.white); }
  if (game.mode === 'roundend' || (game.mode === 'wait' && game.waitNext === 'gameoverInit') || game.mode === 'gameover') drawStatsBox();
  if (game.noFail) drawText('NO-FAIL', 2, 2, C.orange, C.black);
  if (game.flash.length) {             // the Zapper's detection frames
    fillRect(0, 0, SW, SH, C.black);
    const slot = game.flash[0], d = game.ducks[slot];
    if (d && d.active) {
      const sh = SHAPES[d.shape], s = settings.size;
      for (const oy of sh.ys) for (const ox of sh.xs) if (d.y + oy * s < 0xA8) fillRect(Math.round(d.x + ox * s), Math.round(d.y + oy * s), Math.ceil(8 * s), Math.ceil(8 * s), C.white);
    }
  }
  if (game.mode !== 'menu') drawCrosshair();
  ctx.putImageData(img, 0, 0);
}

(function buildMenu() {
  for (const p of PRESET_ORDER) {

function refreshMenu() {

    (ps.bestReact ? ps.bestReact.toFixed(2) + 's' : '-') + '</b> &middot; BEST STREAK <b>' + ps.best + '</b>') : 'MOUSE SKILLS: no games played with this preset yet';

function togglePause() {
  if (game.mode !== 'duck' && game.mode !== 'roundend') return;
  if (!game.paused) { game.paused = true; game.unpause = 0; game.savedMsg = game.msg; Sound.stopMusic(); Sound.tune('pause'); }

function historyHTML() {
  const hist = loadJSON('history', []);
  if (!hist.length) return '<p>No games recorded yet. Play a game and the last 10 will appear here.</p>';
  let h = '<p>LAST ' + hist.length + ' GAMES (newest at the bottom)</p><table><tr><th>DATE</th><th>PRESET</th><th>GAME</th><th>ROUND</th><th>SCORE</th><th>SHOTS</th><th>ACCURACY</th><th>AVG TIME</th><th>STREAK</th></tr>';
  for (const s of hist) {
    h += '<tr><td>' + s.date + '</td><td>' + String(s.preset).toUpperCase() + (s.noFail ? '*' : '') + '</td><td>' + s.game + '</td><td>' + s.round +
      '</td><td>' + s.score + '</td><td>' + s.shots + '</td><td>' + s.acc + '%</td><td>' + (s.react ? s.react.toFixed(2) + 's' : '-') + '</td><td>' + s.best + '</td></tr>';
  }
  h += '</table>';
  if (hist.length >= 2) {
    const half = Math.floor(hist.length / 2), a = hist.slice(0, half), b = hist.slice(half);
    const avg = (arr, f) => arr.reduce((t, s) => t + f(s), 0) / arr.length;
    const accA = avg(a, s => s.acc), accB = avg(b, s => s.acc);
    const rA = avg(a.filter(s => s.react), s => s.react) || 0, rB = avg(b.filter(s => s.react), s => s.react) || 0;
    h += '<p class="trend">Older half vs newer half: accuracy ' + accA.toFixed(0) + '% &rarr; ' + accB.toFixed(0) + '%' +
      (rA && rB ? ', average time ' + rA.toFixed(2) + 's &rarr; ' + rB.toFixed(2) + 's' : '') + '</p>';

}

/* client (CSS pixel) coordinates -> game pixel, through the integer CSS scale */
function toGame(clientX, clientY) {
  const r = canvas.getBoundingClientRect();

  const gx = Math.floor((clientX - r.left) * SW / w), gy = Math.floor((clientY - r.top) * SH / h);
  return { x: Math.max(0, Math.min(SW - 1, gx)), y: Math.max(0, Math.min(SH - 1, gy)) };
}

canvas.addEventListener('touchstart', e => {
  if (e.preventDefault) e.preventDefault();
  Sound.init();
  const t = e.changedTouches && e.changedTouches[0]; if (!t) return;
  aimAt(t.clientX, t.clientY); input.fire = true;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (e.preventDefault) e.preventDefault();
  const t = e.changedTouches && e.changedTouches[0]; if (t) aimAt(t.clientX, t.clientY);
}, { passive: false });

window.addEventListener('keydown', e => {
  const k = e.key;
  Sound.init();
  if (k === 'm' || k === 'M') { Sound.setMuted(!Sound.isMuted()); return; }
  if (overlayOpen()) {
    if (!histEl.classList.contains('hidden')) { if (k === 'Escape') { histEl.classList.add('hidden'); mainEl.classList.remove('hidden'); } return; }
    const row = menu.rows[menu.row];
    if (k === 'ArrowDown') { menu.row = (menu.row + 1) % menu.rows.length; refreshMenu(); }
    else if (k === 'ArrowUp') { menu.row = (menu.row + menu.rows.length - 1) % menu.rows.length; refreshMenu(); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') {
      const d = k === 'ArrowLeft' ? -1 : 1;
      if (row === 'presets') { let i = PRESET_ORDER.indexOf(presetName()); i = i < 0 ? 0 : Math.max(0, Math.min(3, i + d)); applyPreset(PRESET_ORDER[i]); }
      else if (KNOB[row]) stepKnob(row, d);
      refreshMenu();
    } else if (k >= '1' && k <= '4') { applyPreset(PRESET_ORDER[+k - 1]); refreshMenu(); }
    else if (k === 'Enter') { if (row === 'play' || row === 'presets' || KNOB[row]) startPlaying(); }
    else if (k === 'Escape' && game.sessionOpen && game.mode !== 'menu') resume();
    else return;
    if (e.preventDefault) e.preventDefault();
    return;
  }
  if (k === 'p' || k === 'P') togglePause();
  else if (k === 'Escape') openMenu();
  else if (k === 'q' || k === 'Q') { if (game.paused) quitToMenu(); }
  else return;
  if (e.preventDefault) e.preventDefault();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && !game.paused && (game.mode === 'duck' || game.mode === 'roundend')) togglePause(); });

/* ------------------------------------------------------------------ *
 * Layout and main loop (fixed 60 Hz timestep)
 * ------------------------------------------------------------------ */
function layout() {
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / SW, window.innerHeight / SH)));
  canvas.style.width = SW * s + 'px'; canvas.style.height = SH * s + 'px';
  const st = document.getElementById('stage'); st.style.width = SW * s + 'px'; st.style.height = SH * s + 'px';
  const logo = document.getElementById('logo'); const ls = s >= 3 ? 2 : 1;
  logo.style.width = LOGO.w * ls + 'px'; logo.style.height = LOGO.h * ls + 'px';
}
window.addEventListener('resize', layout);

let last = 0, acc = 0;
const STEP = 1000 / 60;
function frame(ts) {
  if (!last) last = ts;
  acc += Math.min(250, ts - last); last = ts;
  let n = 0;
  while (acc >= STEP && n < 8) { update(); acc -= STEP; n++; }
  if (n) render();
  requestAnimationFrame(frame);
}

loadSettings();
layout();
toMenu_('menu');
render();
requestAnimationFrame(frame);
window.addEventListener('pointerdown', function first() { Sound.init(); if (game.mode === 'menu') Sound.tune('title'); window.removeEventListener('pointerdown', first); });
})();
</script>
