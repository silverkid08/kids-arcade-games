<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>GALAGA</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Courier New", Courier, monospace; font-weight: bold;
    color: #fff; -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #stage { position: relative; }
  canvas { display: block; background: #000; image-rendering: pixelated; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: rgba(0,0,0,.86); text-align: center; padding: 10px; overflow: hidden;
  }
  #overlay.hidden { display: none; }
  #title { margin: 0; font-size: 30px; letter-spacing: 7px; color: #ff2020;
           text-shadow: 0 0 14px rgba(255,64,64,.5); }
  #sub { margin: 0; font-size: 11px; line-height: 1.7; color: #e8e8e8; letter-spacing: 1px; min-height: 18px; }
  #presets { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #presets button, #knobs button {
    font: inherit; font-size: 11px; color: #fff; background: #0b0b18;
    border: 2px solid #2121de; border-radius: 4px; cursor: pointer; padding: 4px 8px; letter-spacing: 1px;
  }
  #presets button:hover, #knobs button:hover { border-color: #8ea0ff; }
  #presets button.sel { background: #2121de; border-color: #ffd000; color: #ffd000; }
  #knobs { display: grid; grid-template-columns: auto auto auto auto; gap: 3px 6px; align-items: center; font-size: 11px; }
  #knobs .lbl { text-align: right; color: #00ffde; letter-spacing: 1px; padding-right: 4px; }
  #knobs .row-sel .lbl { color: #ffd000; }
  #knobs .val { min-width: 54px; color: #fff; }
  #knobs .row-sel .val { color: #ffd000; }
  #knobs button { padding: 1px 7px; }
  #knobs .inv .lbl { color: #ff80ff; }
  #hs { font-size: 10px; line-height: 1.6; color: #b0b0b0; letter-spacing: 1px; }
  #hs b { color: #fff; }
  #play {
    font: inherit; font-size: 15px; letter-spacing: 3px; padding: 10px 22px;
    color: #000; background: #ffd000; border: 0; border-radius: 5px; cursor: pointer;
  }
  #play:hover { background: #fff; }
  .hint { margin: 0; font-size: 9px; color: #8b8b8b; line-height: 1.8; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" width="224" height="288"></canvas>
  <div id="overlay">
    <h1 id="title">GALAGA</h1>
    <p id="sub"></p>
    <div id="presets"></div>
    <div id="knobs"></div>
    <div id="hs"></div>
    <button id="play">PLAY</button>
    <p class="hint">ARROWS / A D move &nbsp;&middot;&nbsp; SPACE fire &nbsp;&middot;&nbsp; P pause &nbsp;&middot;&nbsp; M sound &nbsp;&middot;&nbsp; ESC menu<br>
      MENU: UP/DOWN pick a setting, LEFT/RIGHT change it, 1-4 presets, I invulnerable, ENTER play</p>
  </div>
</div>

   One file: markup, CSS, this IIFE, and the sprite data (ripped from the
   arcade sheet in reference/, see tools/sprites.js).
   "Original" preset = the arcade's default DIP settings (3 fighters,
   extra fighters at 20,000 and 70,000 then every 70,000).  The other
   presets and the knobs only scale the numbers defined in RANK / CFG.
   ===================================================================== */

 * Geometry and timing
 * ------------------------------------------------------------------ */
const SW = 224, SH = 288;      // the arcade's portrait raster
const FPS = 60;                // Galaga runs at 60.6 Hz; 60 is close enough
const STEP = 1 / FPS;
const FIGHTER_Y = 248;         // fighter centre line
const HUD_BOTTOM = 272;        // reserve fighters + stage badges live below this
const FORM_X = 112;            // formation centre
const FORM_Y0 = 40;            // boss row centre line
const FORM_COLS = 10, FORM_ROWS = 5;

/* Arcade numbers for the "Original" preset. Sources: StrategyWiki
   (Galaga/Gameplay, Galaga/Walkthrough), computerarcheology.com's
   disassembly notes (8 enemy shot slots, 2 player shots), MAME DIP
   defaults. Speeds are measured by eye against the arcade and noted as
   such in the README. */
const CFG = {
  fighterSpeed: 2,             // px per frame
  playerShotSpeed: 7,          // px per frame, max 2 shots per fighter
  playerShotsMax: 2,
  enemyShotsMax: 8,            // the hardware's 8 bullet slots
  entrySpeed: 2.6,             // px per frame along the entry path
  beamFrames: 210,             // tractor beam lasts ~3.5 s
  beamHoverY: 164,             // the boss stops "two inches above the bottom"
  extraLife: 20000, extraLife2: 70000, extraEvery: 70000,
  lives: 3
};

/* Rank (difficulty) rises every normal stage. */
function rankParams(rank) {
  return {
    attackInterval: Math.max(28, 84 - rank * 6),   // frames between dive launches
    maxDivers: Math.min(2 + Math.floor(rank / 2), 6),
    shotChance: 0.010 + rank * 0.0018,             // per diving enemy per frame
    shotSpeed: Math.min(3 + rank * 0.25, 5.5),
    diveSpeed: Math.min(2.4 + rank * 0.14, 4.2),
    beamChance: Math.min(0.35 + rank * 0.03, 0.6),
    swoopChance: Math.min(0.25 + rank * 0.05, 0.6)
  };
}

/* ------------------------------------------------------------------ *
 * Sprite decoding into canvases
 * ------------------------------------------------------------------ */
const PALRGB = PAL.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);

function decodeRLE(str, count) {
  const out = new Uint8Array(count);
  let i = 0, p = 0;
  while (i < str.length && p < count) {
    const ch = str[i++];
    let n = '';
    while (i < str.length && /[0-9a-z]/.test(str[i])) n += str[i++];
    const run = n ? parseInt(n, 36) : 1;
    const v = ch === '.' ? 0 : ch.charCodeAt(0) - 64;
    for (let k = 0; k < run && p < count; k++) out[p++] = v;
  }
  return out;
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* Build a canvas from a frame string; flips are baked in (the arcade's
   sprite hardware flips in X and Y, that is how 7 drawn rotation frames
   cover every direction). tint: optional {from:[idx..], to:'#rrggbb'}. */
function frameCanvas(str, w, h, flipX, flipY, recolour) {
  const px = decodeRLE(str, w * h);
  const c = makeCanvas(w, h), ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const sx = flipX ? w - 1 - x : x, sy = flipY ? h - 1 - y : y;
    const v = px[sy * w + sx];
    if (!v) continue;
    const i = (y * w + x) * 4;
    let rgb = PALRGB[v];
    if (recolour) rgb = recolour;
    img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

  const rotFamilies = ['fighter', 'captured', 'boss', 'bossBlue', 'butterfly', 'bee', 'scorpion',
    'tonbo', 'enterprise', 'momiji', 'galaxian', 'midori'];
  for (const name of rotFamilies) {
    const d = SPR[name];
    const rot = [];
    for (let k = 0; k < 7; k++) {
      rot.push([
        frameCanvas(d.f[k], d.w, d.h, false, false), frameCanvas(d.f[k], d.w, d.h, true, false),
        frameCanvas(d.f[k], d.w, d.h, false, true), frameCanvas(d.f[k], d.w, d.h, true, true)
      ]);
    }
    const flapB = d.f[7] || d.f[6];
    Sprites[name] = { rot, anim: [rot[6][0], frameCanvas(flapB, d.w, d.h, false, false)], w: d.w, h: d.h };
  }
  for (const name of ['pmissile', 'pmissileD', 'emissile', 'emissileD', 'fighterExpl', 'enemyExpl', 'beam', 'smallDigits']) {
    const d = SPR[name];
    Sprites[name] = { frames: d.f.map(f => frameCanvas(f, d.w, d.h, false, false)), w: d.w, h: d.h };
    if (name === 'pmissileD' || name === 'emissileD') {
      Sprites[name].mirror = d.f.map(f => frameCanvas(f, d.w, d.h, true, false));
    }
  }
  Sprites.badges = {};
  for (const k of Object.keys(SPR.badges)) {
    const d = SPR.badges[k];
    Sprites.badges[k] = { c: frameCanvas(d.f[0], d.w, d.h, false, false), w: d.w };
  }
})();

/* 8x8 arcade font, recoloured on demand. */
const fontCache = {};
function glyph(ch, colour) {
  const key = colour;
  if (!fontCache[key]) fontCache[key] = {};
  const cache = fontCache[key];
  if (!(ch in cache)) {
    const s = FONT[ch];
    cache[ch] = s ? frameCanvas(s, 8, 8, false, false,
      [parseInt(colour.slice(1, 3), 16), parseInt(colour.slice(3, 5), 16), parseInt(colour.slice(5, 7), 16)]) : null;
  }
  return cache[ch];
}
function drawText(ctx, text, x, y, colour) {
  text = String(text).toUpperCase();
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === ' ') continue;
    const g = glyph(ch, colour || '#ffffff');
    if (g) ctx.drawImage(g, x + i * 8, y);
  }
}
function drawTextCentred(ctx, text, y, colour) {
  drawText(ctx, text, Math.round(SW / 2 - text.length * 4), y, colour);
}
function drawTextRight(ctx, text, xRight, y, colour) {
  drawText(ctx, text, xRight - String(text).length * 8, y, colour);
}

/* Heading -> (frame, flip) for the 7 rotation frames. phi is degrees,
   0 = facing down, 90 = facing left, 180 = up, 270 = right. The fighter
   family is drawn facing up at frame 6 and right at frame 0, so it is
   passed through with a half turn (see spriteFor). */
function rotFrame(phi) {
  phi = ((phi % 360) + 360) % 360;
  let flip = 0, p = phi;
  if (phi > 90 && phi <= 180) { p = 180 - phi; flip = 2; }
  else if (phi > 180 && phi < 270) { p = phi - 180; flip = 3; }
  else if (phi >= 270) { p = 360 - phi; flip = 1; }
  const k = Math.max(0, Math.min(6, Math.round((90 - p) / 15)));
  return [k, flip];
}
function headingOf(dx, dy) { return Math.atan2(-dx, dy) * 180 / Math.PI; }

/* ------------------------------------------------------------------ *
 * Sound. Everything is synthesised so the game stays one file.
 * The tunes are renditions of the arcade's, not samples.
 * ------------------------------------------------------------------ */
const Sound = (function () {
  let ac = null, master = null, muted = false, noiseBuf = null;
  try { muted = localStorage.getItem('galaga.muted') === 'true'; } catch (e) {}
  let diveAt = 0, beamAt = 0, challengeEnd = 0;

  function ensure() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.2;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return true;
  }
  function now() { return ac.currentTime; }

  function tone(o) {
    if (muted || !ensure()) return;
    const t0 = now() + (o.delay || 0), dur = o.dur;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f0, t0);
    if (o.f1 !== undefined) osc.frequency.linearRampToValueAtTime(o.f1, t0 + dur);
    const vol = o.vol === undefined ? 0.4 : o.vol;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + (o.attack || 0.008));
    g.gain.setValueAtTime(vol, t0 + dur - 0.02);
    g.gain.linearRampToValueAtTime(0, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function noise(o) {
    if (muted || !ensure()) return;
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = now() + (o.delay || 0);
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(o.fc || 1200, t0);
    if (o.fc1) f.frequency.linearRampToValueAtTime(o.fc1, t0 + o.dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(o.vol || 0.5, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + o.dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + o.dur);
  }

  const NOTES = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
  function freq(name) {
    const m = /^([A-G]#?)(\d)$/.exec(name);
    return 440 * Math.pow(2, (NOTES[m[1]] + (parseInt(m[2], 10) - 4) * 12 - 9) / 12);
  }
  /* notes: array of [name|null, lengthInSteps] */
  function seq(notes, stepSec, type, vol, delay) {
    let t = delay || 0;
    for (const [n, len] of notes) {
      if (n) tone({ f0: freq(n), dur: stepSec * len * 0.9, type, vol, delay: t });
      t += stepSec * len;
    }
    return t;
  }

  return {
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem('galaga.muted', String(muted)); } catch (e) {} return muted; },
    unlock() { ensure(); },
    shot() { tone({ f0: 1400, f1: 300, dur: 0.07, type: 'square', vol: 0.25 }); },
    enemyHit() {
      noise({ dur: 0.18, fc: 2500, fc1: 300, vol: 0.5 });
      tone({ f0: 900, f1: 120, dur: 0.14, type: 'square', vol: 0.3 });
    },
    bossHit() { tone({ f0: 300, f1: 90, dur: 0.16, type: 'sawtooth', vol: 0.3 }); },
    fighterDeath() {
      noise({ dur: 0.9, fc: 1800, fc1: 100, vol: 0.7 });
      for (let i = 0; i < 6; i++) tone({ f0: 220 - i * 25, f1: 80, dur: 0.14, type: 'sawtooth', vol: 0.25, delay: i * 0.13 });
    },
    flash() { tone({ f0: 880, f1: 1760, dur: 0.08, type: 'triangle', vol: 0.3 }); },
    /* the dive whine: a falling sweep, retriggered while anything dives */
    diveTick(t) {
      if (t < diveAt) return;
      diveAt = t + 0.42;
      tone({ f0: 1100, f1: 350, dur: 0.38, type: 'sawtooth', vol: 0.07 });
    },
    beamTick(t) {
      if (t < beamAt) return;
      beamAt = t + 0.11;
      tone({ f0: 180, f1: 560, dur: 0.1, type: 'sine', vol: 0.3 });
      tone({ f0: 1100, f1: 700, dur: 0.1, type: 'triangle', vol: 0.08 });
    },
    captured() {
      seq([['E4', 2], ['D#4', 2], ['D4', 2], ['C#4', 2], ['C4', 4], [null, 1], ['G3', 2], ['C4', 6]], 0.11, 'square', 0.3);
    },
    rescued() {
      seq([['C5', 1], ['E5', 1], ['G5', 1], ['C6', 2], ['G5', 1], ['C6', 3]], 0.09, 'square', 0.3);
    },
    start() {
      /* rendition of the Galaga opening jingle */
      const lead = [['E5', 1], ['F#5', 1], ['G#5', 1], ['A5', 1], ['B5', 1], ['A5', 1], ['G#5', 1], ['F#5', 1],
        ['E5', 1], ['G#5', 1], ['B5', 1], ['E6', 2], ['D#6', 1], ['B5', 1], ['G#5', 1],
        ['A5', 1], ['B5', 1], ['C#6', 1], ['D6', 1], ['E6', 1], ['D6', 1], ['C#6', 1], ['B5', 1],
        ['A5', 1], ['C#6', 1], ['E6', 1], ['A6', 2], ['G#6', 1], ['E6', 1], ['C#6', 1],
        ['B5', 2], ['G#5', 2], ['E5', 2], ['B5', 2], ['E6', 4], [null, 2]];
      const bass = [['E3', 2], ['E3', 2], ['B2', 2], ['B2', 2], ['E3', 2], ['E3', 2], ['G#3', 2], ['B3', 2],
        ['A2', 2], ['A2', 2], ['E3', 2], ['E3', 2], ['A2', 2], ['A2', 2], ['C#3', 2], ['E3', 2],
        ['E3', 2], ['E3', 2], ['B2', 2], ['B2', 2], ['E3', 4]];
      seq(lead, 0.1, 'square', 0.22);
      seq(bass, 0.1, 'triangle', 0.3);
    },
    stageClear() {
      seq([['C5', 1], ['E5', 1], ['G5', 1], ['C6', 2]], 0.07, 'square', 0.25);
    },
    stageFlag() { tone({ f0: 1200, f1: 1800, dur: 0.06, type: 'square', vol: 0.2 }); },
    extraLife() {
      seq([['G5', 1], ['C6', 1], ['E6', 1], ['G6', 1], ['E6', 1], ['G6', 3]], 0.08, 'square', 0.3);
    },
    challenge(t) {
      /* bouncy loop for the challenging stage, restarted while it runs */
      if (t < challengeEnd) return;
      const mel = [['E5', 1], ['G5', 1], ['A5', 1], ['G5', 1], ['E5', 1], ['D5', 1], ['E5', 2],
        ['C5', 1], ['E5', 1], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['C5', 2],
        ['D5', 1], ['F5', 1], ['A5', 1], ['F5', 1], ['D5', 1], ['C5', 1], ['D5', 2],
        ['B4', 1], ['D5', 1], ['G5', 1], ['D5', 1], ['B4', 1], ['A4', 1], ['B4', 2]];
      const bass = [['C3', 2], ['G3', 2], ['C3', 2], ['G3', 2], ['A2', 2], ['E3', 2], ['A2', 2], ['E3', 2],
        ['F2', 2], ['C3', 2], ['F2', 2], ['C3', 2], ['G2', 2], ['D3', 2], ['G2', 2], ['D3', 2]];
      const len = seq(mel, 0.13, 'square', 0.2);
      seq(bass, 0.13, 'triangle', 0.3);
      challengeEnd = t + len - 0.05;
    },
    stopChallenge() { challengeEnd = 0; },
    perfect() {
      seq([['C5', 1], ['E5', 1], ['G5', 1], ['C6', 1], ['E6', 1], ['G6', 2], ['E6', 1], ['G6', 4]], 0.09, 'square', 0.3);
    },
    bonusTally() { tone({ f0: 700, f1: 900, dur: 0.05, type: 'square', vol: 0.2 }); },
    gameOver() {
      seq([['E4', 2], ['C4', 2], ['A3', 2], ['F3', 2], ['E3', 6]], 0.14, 'sawtooth', 0.22);
    },
    time() { return ac ? ac.currentTime : 0; }
  };
})();

  original: { diveFreq: 100, shotRate: 100, enemySpeed: 100, fighterSpeed: 100, tractor: true,  autoFire: false, lives: 3, startStage: 1, extraLife: 20000, invuln: false }
};
const PRESET_ORDER = ['kid', 'easy', 'normal', 'original'];

function presetMatching(s) {
  for (const name of PRESET_ORDER) {
    const p = PRESETS[name];
    let same = true;
    for (const k of Object.keys(p)) if (k !== 'invuln' && p[k] !== s[k]) { same = false; break; }
    if (same) return name;
  }
  return 'custom';
}

const settings = Object.assign({}, PRESETS.normal);
function loadSettings() {
  try {
    const raw = localStorage.getItem('galaga.settings');
    if (raw) {
      const s = JSON.parse(raw);
      for (const k of KNOBS) if (k.key in s) settings[k.key] = s[k.key];
    }
  } catch (e) {}
  /* sanity-clamp whatever came back */
  for (const k of KNOBS) {
    if (k.bool) settings[k.key] = !!settings[k.key];
    else if (k.options) { if (!k.options.includes(settings[k.key])) settings[k.key] = k.options[0]; }
    else settings[k.key] = Math.max(k.min, Math.min(k.max, Math.round(Number(settings[k.key]) || k.min)));
  }
}
function saveSettings() {
  try { localStorage.setItem('galaga.settings', JSON.stringify(settings)); } catch (e) {}
}
function applyPreset(name) {
  Object.assign(settings, PRESETS[name]);
  saveSettings();
}

/* ------------------------------------------------------------------ *
 * Paths. Every flight is a list of points about 1px apart, built from
 * Catmull-Rom splines through waypoints (arcs are just dense waypoints).
 * ------------------------------------------------------------------ */
function arcPts(cx, cy, r, a0, a1, n) {
  const pts = [];
  n = n || Math.max(4, Math.round(Math.abs(a1 - a0) / 20));
  for (let i = 0; i <= n; i++) {
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
    pts.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
  }
  return pts;
}
function P(x, y) { return { x, y }; }

/* Catmull-Rom through the waypoints, resampled at ~1px spacing. */
function spline(way) {
  if (way.length < 2) return way.slice();
  const pts = [];
  const get = i => way[Math.max(0, Math.min(way.length - 1, i))];
  for (let i = 0; i < way.length - 1; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    const segLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const n = Math.max(2, Math.ceil(segLen));
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      pts.push({
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
      });
    }
  }
  pts.push(way[way.length - 1]);
  /* resample by arc length so speed is constant */
  const out = [pts[0]];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    if (d === 0) continue;
    let pos = acc;
    while (pos + 1 <= d) {
      pos += 1;
      out.push({ x: a.x + (b.x - a.x) * pos / d, y: a.y + (b.y - a.y) * pos / d });
    }
    acc = pos - d;
  }
  return out;
}
function mirrorWay(way) { return way.map(p => P(SW - p.x, p.y)); }
function shiftWay(way, dx, dy) { return way.map(p => P(p.x + dx, p.y + dy)); }

/* Entry paths. Stage 1 uses the arcade's first entrance pattern: the first
   group streams in from the top centre and splits, the next two come in
   from the bottom corners, the last two from the top corners. Patterns 2
   and 3 reuse the same shapes as pairs and as one long file. */
const ENTRY = {};
ENTRY.topCentreL = [P(104, -24), P(98, 24), P(86, 72), P(72, 118)].concat(arcPts(46, 118, 26, 0, 270));
ENTRY.topCentreR = mirrorWay(ENTRY.topCentreL);
ENTRY.bottomL = [P(-24, 212), P(30, 198), P(80, 182), P(120, 166)].concat(arcPts(128, 134, 32, 90, -90));
ENTRY.bottomR = mirrorWay(ENTRY.bottomL);
ENTRY.topL = [P(16, -24), P(28, 20), P(48, 70), P(64, 112)].concat(arcPts(92, 112, 28, 180, -90));
ENTRY.topR = mirrorWay(ENTRY.topL);
const ENTRY_PATHS = {};
for (const k of Object.keys(ENTRY)) ENTRY_PATHS[k] = spline(ENTRY[k]);
ENTRY_PATHS.topL2 = spline(shiftWay(ENTRY.topL, 16, 0));
ENTRY_PATHS.topR2 = spline(shiftWay(ENTRY.topR, -16, 0));
ENTRY_PATHS.bottomL2 = spline(shiftWay(ENTRY.bottomL, 0, -16));
ENTRY_PATHS.bottomR2 = spline(shiftWay(ENTRY.bottomR, 0, -16));
ENTRY_PATHS.topCentreL2 = spline(shiftWay(ENTRY.topCentreL, -16, 0));
ENTRY_PATHS.topCentreR2 = spline(shiftWay(ENTRY.topCentreR, 16, 0));

];
const CHALLENGE_GROUP_GAP = 180, CHALLENGE_FILE_GAP = 10;

/* ------------------------------------------------------------------ *
 * Scores
 * ------------------------------------------------------------------ */
const SCORE = {
  bee: [50, 100], butterfly: [80, 160], boss: [150, 400],
  tonbo: [100, 100], momiji: [100, 100], enterprise: [100, 100],
  scorpion: [160, 160], midori: [160, 160], galaxian: [160, 160],
  captured: [1000, 1000]
};
function challengeGroupBonus(nth) { return nth <= 2 ? 1000 : nth <= 4 ? 1500 : nth <= 6 ? 2000 : 3000; }
const PERFECT_BONUS = 10000;

/* ------------------------------------------------------------------ *
 * Game state
 * ------------------------------------------------------------------ */
const game = {
  state: 'menu', paused: false, frame: 0, timer: 0,
  score: 0, lives: 3, stage: 1, rank: 0, rp: rankParams(0),
  nextExtra: 0, extraIndex: 0,
  fighter: { x: 112, y: FIGHTER_Y, dual: false, alive: false, phi: 180, flash: 0 },
  enemies: [], pshots: [], eshots: [], effects: [],
  formation: { ox: 0, swayDir: 1, sx: 16, sy: 16, breath: 0, breathDir: 1, allIn: false, phase: 'sway' },
  entry: { pattern: 0, wave: 0, frame: 0, queue: [], launched: 0, total: 0 },
  attackTimer: 0,
  beam: null,
  cap: null,
  challenge: null,
  shotsFired: 0, hits: 0,
  stars: [], starsScroll: true,
  msgs: [],
  fireHeld: false, fireLatch: false, fireCooldown: 0,
  input: { left: false, right: false },
  diving: 0
};

function isChallenge(stage) { return stage % 4 === 3; }
function rankFor(stage) { return Math.max(0, stage - 1 - Math.floor((stage + 1) / 4)); }
function entryPattern(stage) { /* 1,2 | 4,5,6 | 8,9,10 ... */
  if (stage < 3) return stage - 1;
  return (stage - 4) % 4;
}
function challengeIndex(stage) { return Math.floor((stage + 1) / 4); } // 3 -> 1, 7 -> 2

/* knobs */
function kEnemySpeed() { return settings.enemySpeed / 100; }
function kFighterSpeed() { return settings.fighterSpeed / 100; }

/* ------------------------------------------------------------------ *
 * Stars: two layers scrolling at different speeds, twinkling
 * ------------------------------------------------------------------ */
const STAR_COLOURS = ['#ffffff', '#ff4040', '#4040ff', '#ffff40', '#40ff40', '#ff40ff', '#40ffff', '#ff8040'];
function makeStars() {
  const stars = [];
  let seed = 12345;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < 64; i++) {
    stars.push({ x: Math.floor(rnd() * SW), y: Math.floor(rnd() * SH), c: STAR_COLOURS[Math.floor(rnd() * 8)],
      layer: i % 2, phase: Math.floor(rnd() * 32), bright: rnd() < 0.5 });
  }
  return stars;
}
function updateStars() {
  if (!game.starsScroll) return;
  for (const s of game.stars) {
    s.y += s.layer ? 1.2 : 0.55;
    if (s.y >= SH) { s.y -= SH; s.x = (s.x * 7 + 13) % SW; }
  }
}

/* ------------------------------------------------------------------ *
 * Formation geometry
 * ------------------------------------------------------------------ */
function slotPos(row, col) {
  const f = game.formation;
  return { x: FORM_X + f.ox + (col - 4.5) * f.sx, y: FORM_Y0 + row * f.sy };
}
function updateFormation() {
  const f = game.formation;
  if (f.phase === 'sway') {
    f.ox += f.swayDir * 0.5;
    if (f.ox >= 24) { f.ox = 24; f.swayDir = -1; }
    if (f.ox <= -24) { f.ox = -24; f.swayDir = 1; }
  } else {
    /* breathing: return to centre, then expand/contract every 128 frames */
    if (f.ox > 0) f.ox = Math.max(0, f.ox - 0.5);
    if (f.ox < 0) f.ox = Math.min(0, f.ox + 0.5);
    f.breath += f.breathDir;
    if (f.breath >= 128) { f.breath = 128; f.breathDir = -1; }
    if (f.breath <= 0) { f.breath = 0; f.breathDir = 1; }
    f.sx = 16 + 4 * f.breath / 128;
    f.sy = 16 + 1.5 * f.breath / 128;
  }
}

/* ------------------------------------------------------------------ *
 * Enemies
 * ------------------------------------------------------------------ */
let enemySeq = 0;
function makeEnemy(type, row, col) {
  return {
    id: enemySeq++, type, row, col, hp: type === 'boss' ? 2 : 1,
    state: 'queued', x: 0, y: 0, phi: 0, path: null, pi: 0, speed: 0,
    escorts: [], leader: null, cap: null, beamTimer: 0, beamFrame: 0, hit: false,
    group: -1, launchFrame: 0, swoop: false, diveKind: null, fired: 0
  };
}
function alive(e) { return e.state !== 'dead'; }
function enemiesInFormation() { return game.enemies.filter(e => e.state === 'formation'); }

function followPath(e, speed) {
  e.pi += speed;
  const n = e.path.length;
  if (e.pi >= n - 1) {
    const last = e.path[n - 1], prev = e.path[n - 2] || last;
    e.x = last.x; e.y = last.y;
    e.phi = headingOf(last.x - prev.x, last.y - prev.y);
    return true;
  }
  const i = Math.floor(e.pi), a = e.path[i], b = e.path[i + 1];
  const t = e.pi - i;
  e.x = a.x + (b.x - a.x) * t; e.y = a.y + (b.y - a.y) * t;
  const j = Math.min(n - 1, i + 3);
  e.phi = headingOf(e.path[j].x - a.x, e.path[j].y - a.y);
  return false;
}

/* straight-line return to the (moving) formation slot */
function homeToSlot(e, speed) {
  const s = slotPos(e.row, e.col);
  const dx = s.x - e.x, dy = s.y - e.y, d = Math.hypot(dx, dy);
  if (d <= speed) { e.x = s.x; e.y = s.y; e.state = 'formation'; e.phi = 0; return true; }
  e.x += dx / d * speed; e.y += dy / d * speed;
  /* face down when the slot is near, the dive sprites look wrong at 1px steps */
  e.phi = d < 24 ? 0 : headingOf(dx, dy);
  return false;
}

function startEntry(stage) {
  const en = game.entry;
  en.pattern = entryPattern(stage);
  en.wave = 0; en.frame = 0; en.queue = []; en.launched = 0;
  game.enemies = [];
  const pat = PATTERNS[en.pattern];
  for (let w = 0; w < WAVES.length; w++) {
    const spec = WAVES[w], conf = pat[w];
    const a = spec.a.slots.map(([r, c]) => makeEnemy(spec.a.type, r, c));
    const b = spec.b.slots.map(([r, c]) => makeEnemy(spec.b.type, r, c));
    const t0 = w * WAVE_GAP;
    if (conf.mode === 'split') {
      a.forEach((e, i) => { e.path = ENTRY_PATHS[conf.paths[0]]; e.launchFrame = t0 + i * FILE_GAP; });
      b.forEach((e, i) => { e.path = ENTRY_PATHS[conf.paths[1]]; e.launchFrame = t0 + i * FILE_GAP; });
    } else if (conf.mode === 'pair') {
      /* a and b alternate down two parallel paths, two abreast */
      a.forEach((e, i) => { e.path = ENTRY_PATHS[conf.paths[0]]; e.launchFrame = t0 + i * FILE_GAP; });
      b.forEach((e, i) => { e.path = ENTRY_PATHS[conf.paths[1]]; e.launchFrame = t0 + i * FILE_GAP; });
    } else {
      const file = [];
      for (let i = 0; i < 4; i++) { file.push(a[i]); file.push(b[i]); }
      file.forEach((e, i) => { e.path = ENTRY_PATHS[conf.paths[0]]; e.launchFrame = t0 + i * FILE_GAP; });
    }
    for (const e of a.concat(b)) { game.enemies.push(e); en.queue.push(e); }
  }
  en.total = en.queue.length;
  /* a stored captured fighter rides in under the last Boss Galaga to enter */
  if (game.storedCap) {
    const bosses = en.queue.filter(e => e.type === 'boss');
    const last = bosses[bosses.length - 1] || en.queue[en.queue.length - 1];
    const cap = makeEnemy('captured', -1, last.col);
    cap.state = 'attached'; cap.host = last; last.cap = cap;
    game.cap = cap; game.enemies.push(cap);
    game.storedCap = false;
  }
  game.formation.phase = 'sway'; game.formation.allIn = false;
  game.formation.sx = 16; game.formation.sy = 16; game.formation.breath = 0; game.formation.breathDir = 1;
}

function updateEntry() {
  const en = game.entry;
  if (en.launched >= en.total) return;
  en.frame++;
  for (const e of en.queue) {
    if (e.state === 'queued' && en.frame >= e.launchFrame) {
      e.state = 'entering'; e.pi = 0; e.x = e.path[0].x; e.y = e.path[0].y;
      en.launched++;
    }
  }
}

/* ---- challenging stage ---- */
function startChallenge(stage) {
  const idx = challengeIndex(stage);
  const set = CHALLENGE_SETS[Math.min(CHALLENGE_SETS.length - 1, idx - 1)];
  game.enemies = [];
  const ch = { idx, hits: 0, groups: [0, 0, 0, 0, 0], frame: 0, total: 40, launched: 0, queue: [], bonus: 0, groupBonuses: 0 };
  for (let g = 0; g < 5; g++) {
    for (let i = 0; i < 8; i++) {
      const e = makeEnemy(set[g], -1, -1);
      e.hp = 1; e.group = g; e.path = CHALLENGE_PATHS[g];
      e.launchFrame = 60 + g * CHALLENGE_GROUP_GAP + i * CHALLENGE_FILE_GAP;
      ch.queue.push(e); game.enemies.push(e);
    }
  }
  game.challenge = ch;
  game.formation.phase = 'breathe';
}
function updateChallenge() {
  const ch = game.challenge;
  ch.frame++;
  for (const e of ch.queue) {
    if (e.state === 'queued' && ch.frame >= e.launchFrame) {
      e.state = 'entering'; e.pi = 0; e.x = e.path[0].x; e.y = e.path[0].y; ch.launched++;
    }
  }
}

/* ---- dives ---- */
function loopWay(x, y, d) {
  /* a small loop starting at (x,y), rising first and curling outward (d = -1 left, +1 right) */
  return d < 0 ? arcPts(x, y - 14, 14, 90, -200) : arcPts(x, y - 14, 14, 90, 380);
}
function divePathFor(e, kind, px) {
  const d = e.x < FORM_X ? -1 : 1;
  const way = loopWay(e.x, e.y, d);
  if (kind === 'bee') {
    way.push(P(e.x + d * 20, e.y + 50), P(px - d * 40, 160), P(px + d * 10, 230));
    if (e.swoop) way.push(P(px, 244), P(px + d * 50, 200), P(px + d * 64, 120), P(px + d * 30, 40), P(px, -30));
    else way.push(P(px + d * 20, 330));
  } else if (kind === 'butterfly') {
    way.push(P(e.x + d * 30, e.y + 40), P(px - d * 50, 130), P(px + d * 50, 180), P(px - d * 30, 230), P(px, 330));
  } else if (kind === 'boss') {
    way.push(P(e.x + d * 30, e.y + 60), P(px, 160), P(px - d * 60, 240), P(px - d * 80, 330));
  } else if (kind === 'hostile') {
    way.push(P(e.x - d * 30, e.y + 50), P(px + d * 40, 150), P(px - d * 20, 220), P(px, 330));
  }
  return spline(way);
}
function beamPathFor(e) {
  const bx = Math.max(40, Math.min(SW - 40, e.x));
  return spline([P(e.x, e.y), P(e.x, e.y + 40), P(bx, CFG.beamHoverY - 30), P(bx, CFG.beamHoverY)]);
}

function launchDive(e, kind) {
  const px = game.fighter.x;
  e.diveKind = kind;
  e.swoop = kind === 'bee' && Math.random() < game.rp.swoopChance;
  e.path = divePathFor(e, kind, px);
  e.pi = 0; e.state = 'diving'; e.fired = 0;
  e.speed = game.rp.diveSpeed;
}

function pickAttacker() {
  const inForm = enemiesInFormation().filter(e => e.type !== 'captured');
  if (!inForm.length) return null;
  /* the arcade favours enemies at the edges of the formation */
  const byType = t => inForm.filter(e => e.type === t);
  const r = Math.random();
  let pool = r < 0.2 ? byType('boss') : r < 0.55 ? byType('butterfly') : byType('bee');
  if (!pool.length) pool = inForm;
  pool.sort((a, b) => Math.abs(b.col - 4.5) - Math.abs(a.col - 4.5));
  const n = Math.max(1, Math.min(pool.length, 4));
  return pool[Math.floor(Math.random() * n)];
}

function scheduleAttacks() {
  if (settings.diveFreq <= 0) return;
  game.attackTimer--;
  if (game.attackTimer > 0) return;
  game.attackTimer = Math.round(game.rp.attackInterval * 100 / settings.diveFreq);
  const divers = game.enemies.filter(e => e.state === 'diving' || e.state === 'beam' || e.state === 'beamDrop').length;
  if (divers >= game.rp.maxDivers) return;
  const e = pickAttacker();
  if (!e) return;
  if (e.type === 'boss') {
    const canBeam = settings.tractor && !game.beam && !game.cap && !game.fighter.dual && !e.cap &&
      game.fighter.alive && Math.random() < game.rp.beamChance;
    if (canBeam) {
      e.path = beamPathFor(e); e.pi = 0; e.state = 'beamRun'; e.speed = game.rp.diveSpeed; e.diveKind = 'beam';
      return;
    }
    launchDive(e, 'boss');
    /* up to two escorts from the butterfly row beside it */
    const cand = enemiesInFormation().filter(x => x.type === 'butterfly' && x.row === 1 && Math.abs(x.col - e.col) <= 1);
    for (const esc of cand.slice(0, 2)) {
      esc.path = e.path.map(p => P(p.x + (esc.x - e.x), p.y + (esc.y - e.y)));
      esc.pi = 0; esc.state = 'diving'; esc.speed = e.speed; esc.leader = e; esc.diveKind = 'escort';
      e.escorts.push(esc);
    }
  } else {
    launchDive(e, e.type);
  }
}

function enemyFire(e) {
  if (settings.shotRate <= 0 || game.eshots.length >= CFG.enemyShotsMax) return;
  if (!game.fighter.alive || game.state !== 'play') return;
  if (e.y > FIGHTER_Y - 48 || e.y < 8) return;
  if (Math.random() > game.rp.shotChance * settings.shotRate / 100) return;
  const f = game.fighter;
  let dx = f.x - e.x, dy = f.y - e.y;
  dx += (Math.random() - 0.5) * 30;
  const d = Math.hypot(dx, dy) || 1;
  const sp = game.rp.shotSpeed * kEnemySpeed();
  let vx = dx / d * sp, vy = dy / d * sp;
  if (Math.abs(vx) > vy * 0.7) { vx = Math.sign(vx) * vy * 0.7; }
  game.eshots.push({ x: e.x, y: e.y + 6, vx, vy });
  e.fired++;
}

function updateEnemy(e) {
  const sp = kEnemySpeed();
  switch (e.state) {
    case 'entering': {
      const done = followPath(e, CFG.entrySpeed * sp);
      if (game.challenge) {
        if (done) e.state = 'dead';   // flew off; not a kill
      } else {
        if (e.y > 24 && e.y < 150 && Math.random() < 0.12) enemyFire(e);
        if (done) e.state = 'homing';
      }
      break;
    }
    case 'homing':
      homeToSlot(e, CFG.entrySpeed * sp);
      break;
    case 'formation': {
      if (e.type === 'captured' && e.host) { e.x = e.host.x; e.y = e.host.y - 16; break; }
      const s = slotPos(e.row, e.col); e.x = s.x; e.y = s.y; e.phi = 0;
      break;
    }
    case 'diving': {
      const done = followPath(e, e.speed * sp);
      if (e.diveKind !== 'escort' || Math.random() < 0.5) enemyFire(e);
      if (done) {
        if (e.diveKind === 'hostile') { e.state = 'dead'; if (game.cap === e) game.cap = null; break; }
        /* off the bottom: come back in from the top; off the top: already there */
        if (e.y > SH) e.y = -20;
        e.x = Math.max(16, Math.min(SW - 16, e.x));
        e.state = 'homing';
        if (e.leader) { const i = e.leader.escorts.indexOf(e); if (i >= 0) e.leader.escorts.splice(i, 1); e.leader = null; }
        e.escorts = [];
      }
      break;
    }
    case 'beamRun': {
      const done = followPath(e, e.speed * sp);
      if (done) {
        e.state = 'beam'; e.beamTimer = CFG.beamFrames; e.beamFrame = 0; e.phi = 0;
        game.beam = e;
      }
      break;
    }
    case 'beam': {
      e.beamTimer--;
      e.beamFrame++;
      if (e.beamTimer <= 0) {
        game.beam = null;
        e.path = spline([P(e.x, e.y), P(e.x, e.y + 60), P(e.x, SH + 24)]);
        e.pi = 0; e.state = 'beamDrop';
      }
      break;
    }
    case 'beamDrop': {
      if (followPath(e, e.speed * sp)) { e.y = -20; e.state = 'homing'; }
      break;
    }
    case 'attached':
      if (e.host) { e.x = e.host.x; e.y = e.host.y - 16; e.phi = e.host.state === 'formation' ? 180 : e.host.phi; }
      break;
    case 'freed': {
      e.phi = (e.phi + 20) % 360;
      e.beamTimer--;
      if (e.beamTimer <= 0) {
        /* fly to the player's side and dock */
        const f = game.fighter, tx = f.x + 16, ty = f.y;
        const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
        if (d < 3 || !f.alive) {
          if (f.alive) f.dual = true;
          e.state = 'dead'; game.cap = null;
        } else { e.x += dx / d * 3; e.y += dy / d * 3; }
      }
      break;
    }
    case 'capturing': break;   // animated by the capture sequence
  }
}

/* ------------------------------------------------------------------ *
 * Effects, messages, score
 * ------------------------------------------------------------------ */
function explode(x, y, kind) {
  game.effects.push({ kind, x, y, t: 0 });
}
function popup(x, y, value) {
  game.effects.push({ kind: 'score', x, y, t: 0, value });
}
function say(text, colour, frames, y) {
  game.msgs.push({ text, colour: colour || '#ffffff', t: frames || 90, y: y === undefined ? 136 : y });
}
function addScore(n) {
  game.score += n;
  if (game.nextExtra && game.score >= game.nextExtra) {
    game.lives++;
    Sound.extraLife();
    game.extraIndex++;
    game.nextExtra = extraThreshold(game.extraIndex);
  }
  const k = highKey();
  if (game.score > high[k]) high[k] = game.score;
}
function extraThreshold(i) {
  const first = settings.extraLife;
  if (!first) return 0;
  if (i === 0) return first;
  if (i === 1) return Math.max(first + 1, CFG.extraLife2);
  return CFG.extraLife2 + (i - 1) * CFG.extraEvery;
}

/* ------------------------------------------------------------------ *
 * Player
 * ------------------------------------------------------------------ */
function fighterHalfWidth() { return game.fighter.dual ? 14 : 6; }
function fireShot() {
  const f = game.fighter;
  if (!f.alive || game.state !== 'play') return;
  const max = CFG.playerShotsMax * (f.dual ? 2 : 1);
  if (game.pshots.length >= max) return;
  if (f.dual) {
    game.pshots.push({ x: f.x - 8, y: f.y - 8 }, { x: f.x + 8, y: f.y - 8 });
    game.shotsFired += 2;
  } else {
    game.pshots.push({ x: f.x, y: f.y - 8 });
    game.shotsFired++;
  }
  Sound.shot();
}

function updatePlayer() {
  const f = game.fighter;
  if (!f.alive) return;
  const sp = CFG.fighterSpeed * kFighterSpeed();
  if (game.input.left) f.x -= sp;
  if (game.input.right) f.x += sp;
  const half = f.dual ? 16 : 8;
  f.x = Math.max(half, Math.min(SW - half, f.x));
  if (f.flash > 0) f.flash--;
  /* fire: one shot per press, or held fire with the auto-fire knob */
  if (game.fireHeld) {
    if (!game.fireLatch) { fireShot(); game.fireLatch = true; game.fireCooldown = 10; }
    else if (settings.autoFire && --game.fireCooldown <= 0) { fireShot(); game.fireCooldown = 10; }
  } else game.fireLatch = false;
}

function updateShots() {
  const sp = CFG.playerShotSpeed;
  for (const s of game.pshots) s.y -= sp;
  game.pshots = game.pshots.filter(s => s.y > -8);
  for (const s of game.eshots) { s.x += s.vx; s.y += s.vy; }
  game.eshots = game.eshots.filter(s => s.y < SH + 8 && s.x > -8 && s.x < SW + 8);
}

/* ------------------------------------------------------------------ *
 * Collisions and kills
 * ------------------------------------------------------------------ */
function hitBox(e) { return 6; }

function enemyValue(e) {
  const diving = e.state !== 'formation' && e.state !== 'attached';
  if (game.challenge) return 0; /* challenge hits are paid at the end: 100 each, or the 10000 special bonus */
  if (e.type === 'boss' && diving) {
    const n = e.escorts.filter(x => x.state === 'diving').length;
    return n >= 2 ? 1600 : n === 1 ? 800 : 400;
  }
  const t = SCORE[e.type] || [100, 100];
  return diving ? t[1] : t[0];
}

function killEnemy(e, byPlayer) {
  if (e.state === 'dead') return;
  const value = byPlayer ? enemyValue(e) : 0;
  const wasDiving = e.state === 'diving' || e.state === 'beamDrop' || e.state === 'homing';
  e.state = 'dead';
  explode(e.x, e.y, 'enemy');
  Sound.enemyHit();
  if (byPlayer) {
    addScore(value);
    if (value >= 800 || e.type === 'captured') popup(e.x, e.y, value);
  }
  if (e === game.beam) game.beam = null;
  if (e.leader) { const i = e.leader.escorts.indexOf(e); if (i >= 0) e.leader.escorts.splice(i, 1); }
  for (const esc of e.escorts) esc.leader = null;
  e.escorts = [];
  /* the boss carrying a captured fighter */
  if (e.cap && e.cap.state === 'attached') {
    const cap = e.cap;
    cap.host = null; e.cap = null;
    if (wasDiving) {
      /* rescue: the fighter spins free then joins the player; attackers go home */
      cap.state = 'freed'; cap.beamTimer = 90;
      Sound.rescued();
      say('FIGHTER RESCUED', '#00ffff', 120, 150);
      for (const x of game.enemies) if (x.state === 'diving') {
        x.state = 'homing'; x.escorts = []; x.leader = null;
      }
    } else {
      /* shot in formation: the captured fighter turns on the player */
      cap.state = 'diving'; cap.diveKind = 'hostile';
      cap.path = divePathFor(cap, 'hostile', game.fighter.x); cap.pi = 0; cap.speed = 2.6;
    }
  }
  if (e.type === 'captured') game.cap = null;
  if (game.challenge && byPlayer) {
    const ch = game.challenge;
    ch.hits++;
    if (e.group >= 0) {
      ch.groups[e.group]++;
      if (ch.groups[e.group] === 8) {
        const b = challengeGroupBonus(ch.idx);
        addScore(b); ch.groupBonuses += b;
        popup(e.x, e.y, b);
      }
    }
  }
}

function playerHitBy(what, x, y) {
  const f = game.fighter;
  if (!f.alive) return;
  if (settings.invuln) {
    f.flash = 20;
    Sound.flash();
    return;
  }
  if (f.dual) {
    /* one half of the dual fighter is lost, play continues */
    f.dual = false;
    explode(f.x + 8, f.y, 'fighter');
    Sound.fighterDeath();
    f.x -= 8;
    return;
  }
  killFighter();
}

function killFighter() {
  const f = game.fighter;
  f.alive = false;
  explode(f.x, f.y, 'fighter');
  Sound.fighterDeath();
  game.state = 'dying'; game.timer = 120;
  game.starsScroll = false;
  abortAttacks();
}
function abortAttacks() {
  for (const e of game.enemies) {
    if (e.state === 'diving' && e.diveKind !== 'hostile') { e.state = 'homing'; e.escorts = []; e.leader = null; }
    if (e.state === 'beamRun' || e.state === 'beam') { game.beam = null; e.state = 'homing'; }
  }
  game.eshots = [];
}

function checkCollisions() {
  const f = game.fighter;
  /* player shots vs enemies */
  for (const s of game.pshots) {
    if (s.dead) continue;
    for (const e of game.enemies) {
      if (!alive(e) || e.state === 'queued' || e.state === 'freed' || e.state === 'capturing') continue;
      const hb = hitBox(e);
      if (Math.abs(s.x - e.x) <= hb && Math.abs(s.y - 2 - e.y) <= hb + 2) {
        s.dead = true;
        game.hits++;
        if (e.type === 'boss' && e.hp > 1 && !game.challenge) {
          e.hp = 1; Sound.bossHit();
        } else {
          killEnemy(e, true);
        }
        break;
      }
    }
  }
  game.pshots = game.pshots.filter(s => !s.dead);

  if (!f.alive || game.state !== 'play') return;
  const hw = fighterHalfWidth();
  /* enemy shots vs fighter */
  for (const s of game.eshots) {
    if (Math.abs(s.x - f.x) <= hw && Math.abs(s.y - f.y) <= 7) {
      s.dead = true; playerHitBy('shot', s.x, s.y);
      break;
    }
  }
  game.eshots = game.eshots.filter(s => !s.dead);
  if (!f.alive) return;
  /* enemies vs fighter */
  for (const e of game.enemies) {
    if (!alive(e) || e.state === 'queued' || e.state === 'formation' || e.state === 'freed' || e.state === 'attached') continue;
    if (Math.abs(e.x - f.x) <= hw + 5 && Math.abs(e.y - f.y) <= 11) {
      if (!settings.invuln) killEnemy(e, false);
      playerHitBy('enemy', e.x, e.y);
      break;
    }
  }
  /* tractor beam */
  const b = game.beam;
  if (b && b.state === 'beam' && b.beamTimer < CFG.beamFrames - 30 && f.alive && !f.dual) {
    if (Math.abs(f.x - b.x) <= 20) {
      if (settings.invuln) { if (f.flash <= 0) { f.flash = 20; Sound.flash(); } }
      else beginCapture(b);
    }
  }
}

/* ---- the capture sequence ---- */
function beginCapture(boss) {
  const f = game.fighter;
  const cap = makeEnemy('captured', -1, boss.col);
  cap.state = 'capturing'; cap.x = f.x; cap.y = f.y; cap.phi = 180; cap.host = boss;
  boss.cap = cap;
  game.cap = cap;
  game.enemies.push(cap);
  f.alive = false;
  game.beam = null;
  game.state = 'captured'; game.timer = 0;
  game.starsScroll = false;
  Sound.captured();
  abortAttacks();
  boss.state = 'capturingHold';
}
function updateCapture() {
  const cap = game.cap, boss = cap && cap.host;
  game.timer++;
  if (!cap || !boss) { game.state = 'play'; return; }
  if (game.timer <= 100) {
    /* spin up into the boss */
    const t = game.timer / 100;
    cap.phi = (cap.phi + 24) % 360;
    cap.x += (boss.x - cap.x) * 0.06;
    cap.y = FIGHTER_Y + (boss.y - 16 - FIGHTER_Y) * t;
    boss.beamFrame++;
  } else if (game.timer === 101) {
    cap.state = 'attached'; cap.phi = 180; cap.x = boss.x; cap.y = boss.y - 16;
    say('FIGHTER CAPTURED', '#ff2020', 150, 150);
  } else if (game.timer === 150) {
    boss.state = 'homing';
  } else if (game.timer >= 250) {
    loseLife();
  }
}
function loseLife() {
  game.lives--;
  if (game.lives <= 0) {
    game.state = 'gameover'; game.timer = 180;
    Sound.gameOver();
    saveHigh();
  } else {
    game.state = 'ready'; game.timer = 120;
  }
}

/* ------------------------------------------------------------------ *
 * Stage flow
 * ------------------------------------------------------------------ */
function newGame() {
  game.score = 0;
  game.lives = settings.lives;
  game.stage = settings.startStage;
  game.extraIndex = 0; game.nextExtra = extraThreshold(0);
  game.shotsFired = 0; game.hits = 0;
  game.fighter.dual = false; game.fighter.alive = false; game.fighter.x = 112; game.fighter.flash = 0;
  game.enemies = []; game.pshots = []; game.eshots = []; game.effects = []; game.msgs = [];
  game.beam = null; game.cap = null; game.challenge = null; game.storedCap = false;
  game.starsScroll = true;
  game.state = 'intro'; game.timer = 230;
  say('PLAYER 1', '#4bb3ff', 230, 120);
  Sound.start();
}

function beginStage() {
  game.pshots = []; game.eshots = []; game.effects = [];
  game.rank = rankFor(game.stage); game.rp = rankParams(game.rank);
  game.attackTimer = 120;
  game.challenge = null; game.beam = null;
  if (game.cap && game.cap.state === 'attached') { game.storedCap = true; }
  game.cap = null;
  if (isChallenge(game.stage)) {
    startChallenge(game.stage);
    say('CHALLENGING STAGE', '#00ffff', 150, 136);
    Sound.stopChallenge();
  } else {
    startEntry(game.stage);
  }
  game.fighter.alive = true; game.fighter.x = game.fighter.dual ? 112 : 112;
  game.state = 'play';
  game.starsScroll = true;
}

function stageIntro() {
  game.state = 'stage'; game.timer = 110;
  say('STAGE ' + game.stage, '#4bb3ff', 110, 136);
  Sound.stageFlag();
}

function stageCleared() {
  if (game.challenge) {
    const ch = game.challenge;
    game.state = 'challengeEnd'; game.timer = 300;
    Sound.stopChallenge();
    if (ch.hits >= 40) {
      say('PERFECT !', '#ff2020', 300, 104);
      say('NUMBER OF HITS  40', '#ffff00', 300, 128);
      say('SPECIAL BONUS 10000 PTS', '#ffff00', 300, 152);
      addScore(PERFECT_BONUS);
      Sound.perfect();
    } else {
      const bonus = ch.hits * 100;
      say('NUMBER OF HITS  ' + ch.hits, '#ffff00', 300, 120);
      say('BONUS  ' + bonus, '#ffff00', 300, 144);
      addScore(bonus);
      Sound.stageClear();
    }
  } else {
    game.state = 'clear'; game.timer = 90;
    Sound.stageClear();
  }
}

/* ------------------------------------------------------------------ *
 * Main update (one 60 Hz frame)
 * ------------------------------------------------------------------ */
function update() {
  if (game.paused || game.state === 'menu') { if (game.state === 'menu') { updateStars(); game.frame++; } return; }
  game.frame++;
  updateStars();
  for (const m of game.msgs) m.t--;
  game.msgs = game.msgs.filter(m => m.t > 0);
  for (const fx of game.effects) fx.t++;
  game.effects = game.effects.filter(fx => fx.t < (fx.kind === 'score' ? 60 : fx.kind === 'fighter' ? 48 : 30));

  switch (game.state) {
    case 'intro':
      if (--game.timer <= 0) stageIntro();
      return;
    case 'stage':
      if (--game.timer <= 0) beginStage();
      return;
    case 'play': case 'dying': case 'ready': case 'captured': case 'clear': case 'challengeEnd': case 'gameover': case 'results':
      break;
  }

  /* world simulation runs in every in-game state */
  const playing = game.state === 'play';
  if (game.challenge) {
    updateChallenge();
    if (playing) Sound.challenge(Sound.time());
  } else {
    updateEntry();
    updateFormation();
    if (!game.formation.allIn && game.entry.launched >= game.entry.total &&
        game.enemies.every(e => e.state === 'formation' || e.state === 'dead' || e.state === 'attached')) {
      game.formation.allIn = true; game.formation.phase = 'breathe';
    }
    if (playing && (game.formation.allIn || game.stage > 1 && game.entry.launched >= 16)) scheduleAttacks();
  }
  for (const e of game.enemies) if (e.state !== 'dead') updateEnemy(e);
  game.enemies = game.enemies.filter(e => e.state !== 'dead');

  let diving = 0;
  for (const e of game.enemies) if (e.state === 'diving' || e.state === 'beamRun') diving++;
  game.diving = diving;
  if (diving && playing) Sound.diveTick(Sound.time());
  if (game.beam && game.beam.state === 'beam' && playing) Sound.beamTick(Sound.time());

  if (playing) updatePlayer();
  updateShots();
  checkCollisions();

  switch (game.state) {
    case 'play': {
      const remaining = game.enemies.filter(e => e.type !== 'captured' || e.state === 'attached');
      const launchedAll = game.challenge ? game.challenge.launched >= 40 : game.entry.launched >= game.entry.total;
      const left = game.challenge ? game.enemies.length : remaining.filter(e => e.type !== 'captured').length;
      const freeing = game.cap && (game.cap.state === 'freed' || game.cap.state === 'diving');
      if (launchedAll && left === 0 && game.pshots.length === 0 && !freeing) stageCleared();
      break;
    }
    case 'captured':
      updateCapture();
      break;
    case 'dying':
      if (--game.timer <= 0) loseLife();
      break;
    case 'ready':
      if (game.timer === 120) say('READY', '#4bb3ff', 120, 136);
      if (--game.timer <= 0) {
        game.fighter.alive = true; game.fighter.x = 112; game.fighter.dual = false;
        game.state = 'play'; game.starsScroll = true;
        game.attackTimer = 90;
      }
      break;
    case 'clear':
      if (--game.timer <= 0) { game.stage++; stageIntro(); }
      break;
    case 'challengeEnd':
      if (--game.timer <= 0) { game.stage++; game.challenge = null; stageIntro(); }
      break;
    case 'gameover':
      if (game.timer === 180) say('GAME OVER', '#ff2020', 180, 136);
      if (--game.timer <= 0) {
        game.state = 'results'; game.timer = 300;
        const ratio = game.shotsFired ? (game.hits / game.shotsFired * 100) : 0;
        say('- RESULTS -', '#ff2020', 300, 96);
        say('SHOTS FIRED      ' + game.shotsFired, '#ffff00', 300, 120);
        say('NUMBER OF HITS   ' + game.hits, '#ffff00', 300, 136);
        say('HIT-MISS RATIO   ' + ratio.toFixed(1) + ' %', '#ffffff', 300, 152);
      }
      break;
    case 'results':
      if (--game.timer <= 0) { game.state = 'menu'; showOverlay('over'); }
      break;
  }
}

/* ------------------------------------------------------------------ *
 * Rendering
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('screen');
canvas.width = SW; canvas.height = SH;
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function drawRot(fam, phi, x, y) {
  const [k, fl] = rotFrame(phi);
  ctx.drawImage(Sprites[fam].rot[k][fl], Math.round(x - 8), Math.round(y - 8));
}
function enemyFamily(e) {
  if (e.type === 'boss') return e.hp > 1 ? 'boss' : 'bossBlue';
  return e.type;
}
function drawEnemy(e) {
  const fam = enemyFamily(e);
  if (e.type === 'captured') {
    /* the fighter family faces up at frame 6, so turn the heading half round */
    drawRot('captured', e.phi + 180, e.x, e.y);
    return;
  }
  const inFormation = e.state === 'formation' || (e.state === 'homing' && Math.abs(e.phi) < 1);
  if (inFormation) {
    const frames = Sprites[fam].anim;
    ctx.drawImage(frames[(game.frame >> 4) & 1], Math.round(e.x - 8), Math.round(e.y - 8));
  } else if (e.state === 'beam' || e.state === 'capturingHold') {
    ctx.drawImage(Sprites[fam].anim[(game.frame >> 3) & 1], Math.round(e.x - 8), Math.round(e.y - 8));
  } else {
    drawRot(fam, e.phi, e.x, e.y);
  }
}
function drawBeam(e) {
  const f = Sprites.beam.frames[(e.beamFrame >> 2) % 3];
  ctx.drawImage(f, Math.round(e.x - 24), Math.round(e.y + 8));
}
function drawSmallNumber(value, x, y) {
  const s = String(value);
  let px = Math.round(x - s.length * 2);
  for (const ch of s) { ctx.drawImage(Sprites.smallDigits.frames[+ch], px, Math.round(y - 4)); px += 4; }
}
function drawBadges() {
  let x = SW - 4, n = game.stage;
  for (const v of [50, 30, 20, 10, 5, 1]) {
    while (n >= v) {
      const b = Sprites.badges[v];
      x -= b.w + 1;
      ctx.drawImage(b.c, x, HUD_BOTTOM);
      n -= v;
    }
  }
}

function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, SW, SH);

  /* stars */
  for (const s of game.stars) {
    if (((game.frame + s.phase * 3) & 31) < 6) continue;
    ctx.fillStyle = s.c;
    ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
  }
  if (game.state === 'menu') { drawHud(); return; }

  /* tractor beams */
  for (const e of game.enemies) {
    if (e.state === 'beam' || (e.state === 'capturingHold' && game.timer <= 100)) drawBeam(e);
  }
  /* enemies: formation first so divers draw on top */
  for (const e of game.enemies) if (e.state === 'formation' || e.state === 'attached') drawEnemy(e);
  for (const e of game.enemies) if (e.state !== 'formation' && e.state !== 'attached' && e.state !== 'queued' && e.state !== 'dead') drawEnemy(e);

  /* fighter */
  const f = game.fighter;
  if (f.alive) {
    const img = Sprites.fighter.rot[6][0];
    if (f.dual) { ctx.drawImage(img, Math.round(f.x - 16), f.y - 8); ctx.drawImage(img, Math.round(f.x), f.y - 8); }
    else ctx.drawImage(img, Math.round(f.x - 8), f.y - 8);
    if (f.flash > 0 && (f.flash & 2)) {
      ctx.fillStyle = '#ffffff';
      const hw = f.dual ? 17 : 9;
      ctx.fillRect(Math.round(f.x - hw), f.y - 9, hw * 2, 1);
      ctx.fillRect(Math.round(f.x - hw), f.y + 8, hw * 2, 1);
      ctx.fillRect(Math.round(f.x - hw), f.y - 9, 1, 18);
      ctx.fillRect(Math.round(f.x + hw - 1), f.y - 9, 1, 18);
    }
  }
  /* shots */
  for (const s of game.pshots) ctx.drawImage(Sprites.pmissile.frames[0], Math.round(s.x - 8), Math.round(s.y - 8));
  for (const s of game.eshots) ctx.drawImage(Sprites.emissile.frames[0], Math.round(s.x - 8), Math.round(s.y - 8));
  /* effects */
  for (const fx of game.effects) {
    if (fx.kind === 'enemy') {
      ctx.drawImage(Sprites.enemyExpl.frames[Math.min(4, Math.floor(fx.t / 6))], Math.round(fx.x - 16), Math.round(fx.y - 16));
    } else if (fx.kind === 'fighter') {
      ctx.drawImage(Sprites.fighterExpl.frames[Math.min(3, Math.floor(fx.t / 12))], Math.round(fx.x - 16), Math.round(fx.y - 16));
    } else if (fx.kind === 'score') {
      drawSmallNumber(fx.value, fx.x, fx.y);
    }
  }
  /* messages */
  for (const m of game.msgs) drawTextCentred(ctx, m.text, m.y, m.colour);

  drawHud();
}

function drawHud() {
  /* top: 1UP / score / HIGH SCORE, like the arcade */
  if (game.state === 'menu' || (game.frame & 32)) drawText(ctx, '1UP', 24, 0, '#ff0000');
  drawTextRight(ctx, game.score ? String(game.score) : '00', 64, 8, '#ffffff');
  drawText(ctx, 'HIGH SCORE', 72, 0, '#ff0000');
  const hk = highKey();
  drawTextRight(ctx, high[hk] ? String(high[hk]) : '20000', 144, 8, '#ffffff');
  if (settings.invuln) drawText(ctx, 'INV', 192, 0, '#ff80ff');
  if (Sound.muted) drawText(ctx, 'M', 208, 8, '#808080');
  if (game.state === 'menu') return;
  /* bottom: reserve fighters on the left, stage badges on the right */
  const img = Sprites.fighter.rot[6][0];
  for (let i = 0; i < Math.min(8, game.lives - 1); i++) ctx.drawImage(img, 4 + i * 16, HUD_BOTTOM);
  drawBadges();
}

/* ------------------------------------------------------------------ *
 * Menu / overlay
 * ------------------------------------------------------------------ */
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const subEl = document.getElementById('sub');
const presetsEl = document.getElementById('presets');
const knobsEl = document.getElementById('knobs');
const hsEl = document.getElementById('hs');
const playBtn = document.getElementById('play');
let overlayMode = 'menu';
let selRow = -1;                 // -1 = preset row, otherwise index into KNOBS
const presetBtns = {}, knobRows = [];

function knobValueText(k) {
  const v = settings[k.key];
  if (k.bool) return v ? 'ON' : 'OFF';
  if (k.options) return v ? String(v) : 'NONE';
  return v + (k.unit || '');
}
function adjustKnob(i, dir) {
  const k = KNOBS[i];
  if (k.bool) settings[k.key] = !settings[k.key];
  else if (k.options) {
    const idx = k.options.indexOf(settings[k.key]);
    settings[k.key] = k.options[(idx + dir + k.options.length) % k.options.length];
  } else settings[k.key] = Math.max(k.min, Math.min(k.max, settings[k.key] + dir * k.step));
  saveSettings();
  refreshMenu();
}
function buildMenu() {
  for (const name of PRESET_ORDER) {
    const b = document.createElement('button');
    b.textContent = name.toUpperCase();
    b.addEventListener('click', () => { Sound.unlock(); applyPreset(name); selRow = -1; refreshMenu(); });
    presetsEl.appendChild(b);
    presetBtns[name] = b;
  }
  KNOBS.forEach((k, i) => {
    const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = k.label;
    const minus = document.createElement('button'); minus.textContent = '<';
    const val = document.createElement('div'); val.className = 'val';
    const plus = document.createElement('button'); plus.textContent = '>';
    minus.addEventListener('click', () => { Sound.unlock(); selRow = i; adjustKnob(i, -1); });
    plus.addEventListener('click', () => { Sound.unlock(); selRow = i; adjustKnob(i, 1); });
    for (const el of [lbl, minus, val, plus]) { if (k.cls) el.classList.add(k.cls); knobsEl.appendChild(el); }
    knobRows.push({ lbl, minus, val, plus });
  });
}
function refreshMenu() {
  const p = presetMatching(settings);
  for (const name of PRESET_ORDER) presetBtns[name].classList.toggle('sel', name === p);
  KNOBS.forEach((k, i) => {
    const r = knobRows[i];
    r.val.textContent = knobValueText(k);
    for (const el of [r.lbl, r.minus, r.val, r.plus]) el.classList.toggle('row-sel', i === selRow);
  });
  const hsParts = [];
  for (const name of PRESET_ORDER.concat(['custom'])) hsParts.push(name.toUpperCase() + ' <b>' + high[name] + '</b>');
  hsParts.push('INVULNERABLE* <b>' + high.invuln + '</b>');
  hsEl.innerHTML = 'HIGH SCORES &nbsp; ' + hsParts.join(' &nbsp;&middot;&nbsp; ');
  updateSub(p);
}
function updateSub(p) {
  p = p || presetMatching(settings);
  if (overlayMode === 'over') {
    const k = highKey();
    subEl.innerHTML = 'SCORE ' + game.score + (game.score >= high[k] && game.score > 0 ? ' &mdash; NEW BEST!' : ' &mdash; BEST ' + high[k]) +
      ' &mdash; STAGE ' + game.stage + (settings.invuln ? ' (INVULNERABLE)' : '');
  } else if (overlayMode === 'pause') {
    subEl.innerHTML = 'STAGE ' + game.stage + ' &mdash; SCORE ' + game.score + ' &mdash; PRESET ' + p.toUpperCase();
  } else {
    subEl.innerHTML = 'PRESET: <b>' + p.toUpperCase() + '</b>' + (settings.invuln ? ' &nbsp; INVULNERABLE ON' : '');
  }
}
function showOverlay(mode) {
  overlayMode = mode;
  overlay.classList.remove('hidden');
  if (mode === 'pause') {
    titleEl.textContent = 'PAUSED'; titleEl.style.color = '#ffd000'; playBtn.textContent = 'RESUME';
  } else if (mode === 'over') {
    titleEl.textContent = 'GAME OVER'; titleEl.style.color = '#ff5555'; playBtn.textContent = 'PLAY AGAIN';
  } else {
    titleEl.textContent = 'GALAGA'; titleEl.style.color = '#ff2020'; playBtn.textContent = 'PLAY';
  }
  refreshMenu();
}
function hideOverlay() { overlay.classList.add('hidden'); }

function startPlaying() {
  Sound.unlock();
  hideOverlay();
  game.paused = false;
  newGame();
}
playBtn.addEventListener('click', () => {
  if (overlayMode === 'pause') { game.paused = false; hideOverlay(); }
  else startPlaying();
});
function togglePause() {
  if (game.state === 'menu') return;
  game.paused = !game.paused;
  if (game.paused) showOverlay('pause'); else hideOverlay();
}
function toMenu() {
  saveHigh();
  game.paused = false;
  game.state = 'menu';
  game.enemies = []; game.pshots = []; game.eshots = []; game.effects = []; game.msgs = [];
  game.beam = null; game.cap = null; game.challenge = null;
  game.starsScroll = true;
  showOverlay('menu');
}

/* ------------------------------------------------------------------ *
 * Input
 * ------------------------------------------------------------------ */
const FIRE_KEYS = [' ', 'Enter', 'z', 'Z', 'Control', 'x', 'X'];
function menuKey(e) {
  const k = e.key;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { selRow = Math.max(-1, selRow - 1); refreshMenu(); return true; }
  if (k === 'ArrowDown' || k === 's' || k === 'S') { selRow = Math.min(KNOBS.length - 1, selRow + 1); refreshMenu(); return true; }
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'a' || k === 'd' || k === 'A' || k === 'D') {
    const dir = (k === 'ArrowLeft' || k === 'a' || k === 'A') ? -1 : 1;
    if (selRow < 0) {
      const i = PRESET_ORDER.indexOf(presetMatching(settings));
      applyPreset(PRESET_ORDER[((i < 0 ? 0 : i) + dir + 4) % 4]);
      refreshMenu();
    } else adjustKnob(selRow, dir);
    return true;
  }
  if (k >= '1' && k <= '4') { applyPreset(PRESET_ORDER[+k - 1]); refreshMenu(); return true; }
  if (k === 'i' || k === 'I') { settings.invuln = !settings.invuln; saveSettings(); refreshMenu(); return true; }
  if (k === ' ' || k === 'Enter') { playBtn.click(); return true; }
  return false;
}

document.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === 'm' || k === 'M') { Sound.unlock(); Sound.toggle(); return; }
  if (!overlay.classList.contains('hidden')) {
    if (k === 'Escape' && overlayMode === 'pause') { toMenu(); e.preventDefault(); return; }
    if ((k === 'p' || k === 'P') && overlayMode === 'pause') { togglePause(); return; }
    if (menuKey(e)) { Sound.unlock(); e.preventDefault(); }
