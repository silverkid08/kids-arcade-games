<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>GNAT ATTACK</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Courier New", Courier, monospace; font-weight: bold;
    color: #fff; -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #stage { position: relative; }
  canvas#screen { display: block; background: #000; image-rendering: pixelated; cursor: none; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; gap: 7px;
    background: rgba(0,0,0,.84); text-align: center; padding: 10px 10px 12px; overflow-y: auto;
  }
  #overlay.hidden { display: none; }
  #titlebar { display: flex; align-items: center; gap: 12px; margin-top: 2px; }
  #logo { image-rendering: pixelated; }
  #title { font-size: 30px; letter-spacing: 4px; color: #f8f8f8; text-shadow: 3px 3px 0 #5838f8, -1px -1px 0 #000; margin: 0; }
  #title small { display: block; font-size: 11px; letter-spacing: 2px; color: #f8b000; text-shadow: none; }
  #sub { margin: 0; font-size: 12px; line-height: 1.7; color: #e8e8e8; letter-spacing: 1px; min-height: 1.7em; }
  #sub b { color: #f8f800; }
  #presets { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #presets .lbl, .knob .lbl { font-size: 10px; color: #f8b000; letter-spacing: 1px; }
  #presets button, .btnrow button {
    min-width: 64px; height: 28px; font: inherit; font-size: 11px; letter-spacing: 1px; color: #fff; padding: 0 8px;
    background: #20186a; border: 2px solid #8888f8; border-radius: 5px; cursor: pointer;
  }
  #presets button:hover, .btnrow button:hover { border-color: #fff; }
  #presets button.sel { background: #8888f8; border-color: #fff; color: #000; }
  #presets.row-sel .lbl { color: #ffff60; }
  #presets .custom { font-size: 11px; color: #f8a8f8; letter-spacing: 1px; }
  #knobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 2px 10px; width: 100%; max-width: 700px; }
  .knob { display: grid; grid-template-columns: 1fr 26px 128px 26px; align-items: center; gap: 4px;
          padding: 1px 6px; border-radius: 4px; border: 1px solid transparent; }
  .knob.sel { border-color: #ffff60; background: rgba(255,255,96,.08); }
  .knob.dim { opacity: .45; }
  .knob .lbl { text-align: left; }
  .knob .val { font-size: 11px; color: #fff; letter-spacing: 1px; }
  .knob button {
    width: 26px; height: 22px; font: inherit; font-size: 13px; color: #fff; padding: 0;
    background: #20186a; border: 2px solid #8888f8; border-radius: 4px; cursor: pointer; line-height: 1;
  }
  .knob button:hover { border-color: #fff; }
  .knob.on .val { color: #ffff60; }
  #highs, #pstats { font-size: 10px; color: #bdbdbd; letter-spacing: 1px; line-height: 1.7; }
  #highs b, #pstats b { color: #fff; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #play {
    font: inherit; font-size: 15px; letter-spacing: 3px; padding: 9px 22px; min-width: 120px; height: auto;
    color: #000; background: #f8d000; border: 2px solid #f8d000; border-radius: 5px; cursor: pointer;
  }
  #play:hover, #play.sel { background: #fff; border-color: #ffff60; }
  .hint { margin: 0; font-size: 10px; color: #8b8b8b; line-height: 1.8; letter-spacing: 1px; }
  #history { width: 100%; max-width: 700px; font-size: 11px; letter-spacing: 1px; }
  #history.hidden, #mainmenu.hidden { display: none; }
  #history table { width: 100%; border-collapse: collapse; margin: 6px 0; }
  #history th { color: #f8b000; font-size: 10px; text-align: right; padding: 3px 4px; border-bottom: 1px solid #333; }
  #history td { text-align: right; padding: 3px 4px; color: #ddd; border-bottom: 1px solid #1a1a1a; }
  #history th:first-child, #history td:first-child { text-align: left; }
  #history .trend { color: #80d010; }
  #mainmenu { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 100%; }
  #badge { position: absolute; left: 6px; bottom: 6px; font-size: 11px; letter-spacing: 1px; color: #000; background: #f8f800;
           border: 2px solid #000; border-radius: 4px; padding: 1px 6px; pointer-events: none; }
  #badge.hidden, #statsbox.hidden { display: none; }
  #statsbox { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); min-width: 60%; pointer-events: none;
              background: rgba(16,8,64,.88); border: 3px solid #f8f8f8; border-radius: 8px; padding: 8px 14px;
              font-size: 13px; letter-spacing: 1px; line-height: 1.7; text-align: center; color: #fff; }
  #statsbox b { color: #f8f800; }
  #statsbox .t { color: #f8b000; font-size: 15px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" width="256" height="224"></canvas>
  <div id="badge" class="hidden">INVULNERABLE</div>
  <div id="statsbox" class="hidden"></div>
  <div id="overlay">
    <div id="titlebar"><canvas id="logo" width="64" height="40"></canvas><h1 id="title">GNAT ATTACK<small>MARIO PAINT FLY SWATTER</small></h1></div>
    <p id="sub"></p>
    <div id="mainmenu">
      <div id="presets"><span class="lbl">PRESET</span></div>
      <div id="knobs"></div>
      <div id="highs"></div>
      <div id="pstats"></div>
      <div class="btnrow">
        <button id="play">PLAY</button>
        <button id="resume">RESUME</button>
        <button id="showhist">PROGRESS</button>
      </div>
      <p class="hint">MOUSE moves the swatter &nbsp;&middot;&nbsp; LEFT CLICK swats &nbsp;&middot;&nbsp; P pause &nbsp;&middot;&nbsp; M sound &nbsp;&middot;&nbsp; ESC menu<br>
        menu: &uarr;&darr; pick a row, &larr;&rarr; change it, 1-4 presets, ENTER play</p>
    </div>
    <div id="history" class="hidden">
      <div id="histbody"></div>
      <div class="btnrow"><button id="hideh">BACK</button><button id="clearh">CLEAR HISTORY</button></div>
    </div>
  </div>
</div>
<script>
/* =====================================================================
   GNAT ATTACK  -  the fly-swatting game from Nintendo's Mario Paint
   (SNES, 1992), rebuilt for kids to practise using a mouse.

   The SNES mouse moved a gloved hand holding a swatter; here the PC mouse
   does.  The screen is the SNES's 256x224, with the 224x192 play area of
   tiled paper (white, blue glass, pink) the real game uses.

   Rules (see README for sources): three levels of 100 bugs each, counted
   down at the top of the screen; then King Watinga, who takes 20 swats;
   lives are the glove icons top right; an extra-life glove floats down
   every 25 bugs; after level 3 the game loops back to level 1 and an
   award icon is added top left (15 of them).  Plain flies are harmless;
   Big Flies shoot four-way orbs, Fly Parents release homing Fly Children,
   Fly Bombs home in and explode.  The glove loses a life when a
   projectile, a Fly Child or an explosion touches the hand.

   Art: genuine Mario Paint sprites (rips + screenshots, README "Art").
   Music: the game's own N-SPC sequences and BRR instrument samples,
   decoded from SPC snapshots and played through WebAudio.
   Kid additions: presets and knobs, hover-to-swat, invulnerable mode,
   mouse-skill statistics.
   ===================================================================== */

const SW = 256, SH = 224;

}

const SPR = {};
for (const k of Object.keys(ART)) if (k !== 'pal') SPR[k] = Array.isArray(ART[k][0]) ? ART[k].map(spr) : spr(ART[k]);

/* backgrounds: black border + the level's 16x16 paper tile */
const BG = SPR.tile.map(t => {
  const b = new Uint32Array(SW * SH).fill(BLACK);
  for (let y = PF.y0; y < PF.y1; y++) for (let x = PF.x0; x < PF.x1; x++) {
    const v = t.px[((y - 16) & 15) * 16 + ((x - 16) & 15)];

  }

/* draw a sprite with its anchor at (ax, ay).  o: {s scale, fx flip x, fy flip y, white, clip(play area), solid colour} */
function draw(sp, ax, ay, o) {
  o = o || {};
  const s = o.s || 1;
  const cx0 = o.clip ? PF.x0 : 0, cy0 = o.clip ? PF.y0 : 0, cx1 = o.clip ? PF.x1 : SW, cy1 = o.clip ? PF.y1 : SH;
  const X0 = Math.round(ax + (o.fx ? -(sp.x + sp.w) : sp.x) * s), Y0 = Math.round(ay + (o.fy ? -(sp.y + sp.h) : sp.y) * s);
  const W = Math.round(sp.w * s), H = Math.round(sp.h * s);
  for (let dy = 0; dy < H; dy++) {
    const Y = Y0 + dy; if (Y < cy0 || Y >= cy1) continue;
    let sy = Math.floor(dy / s); if (o.fy) sy = sp.h - 1 - sy;
    for (let dx = 0; dx < W; dx++) {
      const X = X0 + dx; if (X < cx0 || X >= cx1) continue;
      let sx = Math.floor(dx / s); if (o.fx) sx = sp.w - 1 - sx;
      const v = sp.px[sy * sp.w + sx]; if (v < 0) continue;

/* ------------------------------------------------------------------ *
 * Game constants (see README "Rules and numbers")
 * ------------------------------------------------------------------ */
const LEVELS = [               // per level: most bugs on screen, spawn gap (frames), base fly speed (px/frame), bug mix
  { max: 3, gap: [40, 90], v: 0.9, mix: { gnat: 85, big: 15 } },
  { max: 4, gap: [30, 70], v: 1.15, mix: { gnat: 60, parent: 28, big: 12 } },
  { max: 6, gap: [20, 55], v: 1.4, mix: { gnat: 45, parent: 20, bomb: 25, big: 10 } }
];
const COUNTED = { gnat: 1, big: 1, parent: 1, bomb: 1 };    // swats that count down the bug counter
const POINTS = { gnat: 10, big: 20, parent: 30, bomb: 30, child: 5, bossHit: 50, boss: 500, lifeup: 100 };
const MESH = { hw: 8, hh: 7 };                 // half size of the swatter mesh (frame 0 is 16x14)
const HAND = { x0: -5, x1: 8, y0: 14, y1: 33 };// the glove's hand, relative to the mesh centre
const SWAT_UP = 3, SWAT_DOWN = 6;              // frames: raise, down (hits are checked every down frame), raise
const BUG_SPR = { gnat: () => SPR.fly, big: () => SPR.bigfly, parent: () => SPR.parent, bomb: () => SPR.bomb, child: () => SPR.child };

/* ------------------------------------------------------------------ *
 * State
 * ------------------------------------------------------------------ */
const input = { x: 128, y: 120, fire: false, dwell: 0, dwellOn: null };
const game = {
  mode: 'menu', frame: 0, t: 0, level: 1, loop: 0, remaining: 100, lives: 3, score: 0, swatCount: 0,
  bugs: [], shots: [], fx: [], boss: null, lifeup: null, spawnT: 60, ending: false,
  glove: null, paused: false, preset: 'original', invuln: 0, high: 0,
  stats: null, stage: null, sessionOpen: false, lastSummary: null, skip: false, clearLen: 0
};
let seedV = 1;
function seed(s) { seedV = (s >>> 0) || 1; }
function rnd() { seedV ^= seedV << 13; seedV >>>= 0; seedV ^= seedV >> 17; seedV ^= seedV << 5; seedV >>>= 0; return seedV / 4294967296; }
const rr = (a, b) => a + rnd() * (b - a);
function newGlove() { return { x: input.x, y: input.y, phase: 0, pt: 0, hit: false, state: 'ok', t: 0, inv: 0, flash: 0 }; }
function newStats() { return { shots: 0, hits: 0, reactSum: 0, reactN: 0, streak: 0, best: 0, stings: 0, swatted: 0 }; }
const spd = () => settings.speed / 100;
const atk = () => settings.attack / 100;
function lvl() { return LEVELS[game.level - 1]; }
function loopMul() { return 1 + 0.08 * Math.min(game.loop, 10); }

/* ------------------------------------------------------------------ *
 * Flow: start, levels, boss, clear, game over
 * ------------------------------------------------------------------ */
function startPlaying() {
  Sound.init();
  closeSession();
  seed((Date.now() & 0xFFFF) ^ 0x5A5A);
  game.level = settings.startLevel; game.loop = 0; game.lives = settings.lives; game.score = 0; game.swatCount = 0;
  game.stats = newStats(); game.sessionOpen = true; game.lastSummary = null;
  game.preset = presetName(); game.invuln = settings.invuln; game.high = getHigh(highKey(game.preset, game.invuln));
  game.paused = false; game.glove = newGlove();
  startLevel();
  hideOverlay();
}
function startLevel() {
  game.mode = 'intro'; game.t = 0;
  game.remaining = settings.gnats; game.ending = false;
  game.bugs = []; game.shots = []; game.fx = []; game.boss = null; game.lifeup = null;
  game.spawnT = 30; game.stage = newStats();
  Sound.music('level' + game.level);
  hideStats();
}
function startBoss() {
  game.mode = 'boss'; game.t = 0;
  game.bugs = game.bugs.filter(b => b.kind === 'child'); game.shots = [];
  game.boss = { x: 128, y: PF.y0 - 40, hp: settings.bossHits, state: 'enter', t: 0, dir: rnd() < 0.5 ? -1 : 1, atkT: 120, pattern: 0, hurt: 0, star: null };
  Sound.music('boss');
}
function startClear() {
  game.mode = 'clear'; game.t = 0; game.skip = false;
  game.bugs = []; game.shots = []; game.fx = []; game.lifeup = null;
  const final = game.level === 3;
  Sound.music(final ? 'clearFinal' : 'clear');
  game.clearLen = Math.round(((MUSIC.songs[final ? 'clearFinal' : 'clear'] || { len: 14 }).len) * 60);
  showStats('LEVEL ' + game.level + ' CLEAR!', game.stage);
}
function nextLevel() {
  if (game.level === 3) {
    game.loop++;
    game.level = 1;
    Sound.sfx('extralife');
  } else game.level++;

}
function gameOver() {
  game.mode = 'gameover'; game.t = 0; game.skip = false;
  if (game.glove) game.glove.state = 'gone';
  game.bugs = []; game.shots = []; game.fx = []; game.boss = null; game.lifeup = null;
  Sound.music('gameOver');
  showStats('GAME OVER', game.stats);
}

/* ------------------------------------------------------------------ *
 * Bugs
 * ------------------------------------------------------------------ */
function pickKind() {
  const mix = lvl().mix, a = atk();
  const w = Object.entries(mix).map(([k, v]) => [k, k === 'gnat' ? v : v * a]);
  const tot = w.reduce((s, e) => s + e[1], 0);

  return 'gnat';
}
function edgePoint() {                         // a point just outside the play area
  const side = Math.floor(rnd() * 4);
  if (side === 0) return { x: PF.x0 - 10, y: rr(PF.y0 + 24, PF.y1 - 24) };
  if (side === 1) return { x: PF.x1 + 10, y: rr(PF.y0 + 24, PF.y1 - 24) };
  if (side === 2) return { x: rr(PF.x0 + 24, PF.x1 - 24), y: PF.y0 - 10 };
  return { x: rr(PF.x0 + 24, PF.x1 - 24), y: PF.y1 + 10 };
}
function spawnBug(kind, at) {
  const p = at || edgePoint();
  const b = { kind, x: p.x, y: p.y, vx: 0, vy: 0, t: 0, born: game.frame, state: 'fly', tx: 0, ty: 0, turnT: 0, fire: 0, n: 0, entered: false };
  const v = lvl().v * loopMul() * spd();
  if (kind === 'gnat') {                       // flies across, wobbling
    const tx = PF.x0 + PF.x1 - p.x + rr(-60, 60), ty = PF.y0 + PF.y1 - p.y + rr(-60, 60);
    b.tx = tx; b.ty = ty; b.v = v;
  } else if (kind === 'child') {
    b.v = 1.3 * lvl().v * spd(); b.life = 300;
  } else {
    b.v = (kind === 'bomb' ? 0.45 : 0.75) * v;
    b.tx = rr(PF.x0 + 30, PF.x1 - 30); b.ty = rr(PF.y0 + 30, PF.y1 - 50);
    b.fire = Math.round((kind === 'big' ? 150 : kind === 'parent' ? 170 : 420) / Math.max(0.25, atk()) * rr(0.8, 1.2));
  }
  const a = Math.atan2((b.ty || 120) - b.y, (b.tx || 128) - b.x);
  b.vx = Math.cos(a) * b.v; b.vy = Math.sin(a) * b.v;

  return b;
}
function inPF(x, y, m) { return x >= PF.x0 - m && x < PF.x1 + m && y >= PF.y0 - m && y < PF.y1 + m; }
function handPos() { const g = game.glove, s = settings.glove; return { x: g.x + (HAND.x0 + HAND.x1) / 2 * s, y: g.y + (HAND.y0 + HAND.y1) / 2 * s }; }

  const na = a + Math.max(-rate, Math.min(rate, d));

}
function bugTick(b) {
  b.t++;
  if (inPF(b.x, b.y, -2)) b.entered = true;
  if (b.state === 'leave') {
    b.v = Math.max(b.v, 2); const ex = b.x < 128 ? PF.x0 - 40 : PF.x1 + 40; steer(b, ex, b.y - 30, 0.2);
  } else if (b.kind === 'gnat') {
    if (--b.turnT <= 0) { b.turnT = Math.round(rr(18, 48)); b.wob = rr(-0.9, 0.9); }
    steer(b, b.tx, b.ty, 0.05); const a = Math.atan2(b.vy, b.vx) + (b.wob || 0) * 0.08;
    b.vx = Math.cos(a) * b.v; b.vy = Math.sin(a) * b.v;
  } else if (b.kind === 'child') {
    if (--b.life > 0 && game.glove.state === 'ok') { const h = handPos(); steer(b, h.x, h.y, 0.045); }
  } else if (b.kind === 'bomb') {
    if (b.state === 'armed') { b.vx = b.vy = 0; if (--b.fuse <= 0) explode(b); }
    else {
      const h = handPos(); steer(b, h.x + Math.sin(b.t / 20) * 10, h.y, 0.04);
      if (game.glove.state === 'ok' && Math.hypot(h.x - b.x, h.y - b.y) < 26 * settings.size) { b.state = 'armed'; b.fuse = 45; Sound.sfx('off1'); }
      if (--b.fire <= 0) { b.state = 'armed'; b.fuse = 30; }
    }
  } else {                                     // big fly / parent: wander between waypoints, then attack
    if (Math.hypot(b.tx - b.x, b.ty - b.y) < 8 || --b.turnT <= -200) { b.tx = rr(PF.x0 + 24, PF.x1 - 24); b.ty = rr(PF.y0 + 24, PF.y1 - 50); b.turnT = 0; }

        for (let k = 0; k < 4; k++) { const a = Math.PI / 4 + k * Math.PI / 2; fireShot(b.x, b.y, Math.cos(a), Math.sin(a), 1.2 * lvl().v * spd()); }

        if (b.n >= 2) b.state = 'leave';
      }
      if (b.kind === 'parent') {
        if (b.state === 'fly' && --b.fire <= 0) { b.state = 'charge'; b.ct = 50; }
        if (b.state === 'charge') {

          if (--b.ct <= 0) { b.state = 'birth'; b.ct = 0; b.kids = 5; Sound.sfx('minibugs'); }
        }

function fireShot(x, y, dx, dy, v) { game.shots.push({ x, y, vx: dx * v, vy: dy * v, t: 0 }); }
function explode(b) {

/* ------------------------------------------------------------------ *
 * The glove: swatting, hit tests, hover-and-hold, getting stung
 * ------------------------------------------------------------------ */
function meshRect() {

}
function bugBox(b) {

  if (b.kind === 'lifeup') return { x0: b.x - 7, x1: b.x + 7, y0: b.y - 7, y1: b.y + 7 };

}

}
function addScore(n) { game.score += n; }
function swatHits() {                          // called on every "down" frame: anything under the mesh is hit

  for (const b of list) {
    if (b === game.boss) { bossHit(); any = true; continue; }
    if (b === game.lifeup) {
      game.lifeup = null; game.lives = Math.min(9, game.lives + 1); addScore(POINTS.lifeup); Sound.sfx('extralife'); any = true; continue;
    }

    game.fx.push({ kind: 'fall', spr: BUG_SPR[b.kind](), x: b.x, y: b.y, vy: -1.2, t: 0, frame: 0 });
    addScore(POINTS[b.kind] || 0);
    if (COUNTED[b.kind] && game.mode === 'play' && !game.ending) {
      game.remaining = Math.max(0, game.remaining - 1);
      game.swatCount++;

      }

function gloveTick() {
  const g = game.glove; if (!g || g.state === 'gone') return;
  g.x = Math.max(PF.x0, Math.min(PF.x1 - 1, input.x));
  g.y = Math.max(PF.y0, Math.min(PF.y1 - 1, input.y));
  if (g.flash) g.flash--;
  if (g.inv) g.inv--;
  if (g.state === 'ok') {
    if (input.fire && (game.mode === 'play' || game.mode === 'boss' || game.mode === 'intro')) { swat(); input.fire = false; }
    hoverTick();
    if (g.phase) {
      g.pt++;
      if (g.phase === 1 && g.pt >= SWAT_UP) { g.phase = 2; g.pt = 0; }
      if (g.phase === 2) { swatHits(); if (g.pt >= SWAT_DOWN) { g.phase = 3; g.pt = 0; } }

    }

    g.t++;

    else if (g.state === 'shrink' && g.t >= 30) {

  if (under !== input.dwellOn) { input.dwellOn = under; input.dwell = 0; }

}
function sting() {                             // a projectile / child / explosion touched the hand
  const g = game.glove;
  game.stats.stings++; game.stage.stings++;
  if (game.invuln) { g.flash = 16; Sound.sfx('off2'); return; }
  g.state = 'hurt'; g.t = 0; g.phase = 0;
  game.shots = [];
  game.bugs.forEach(b => { if (b.kind === 'child') b.dead = true; });
  Sound.sfx('die');
}
function handRect() {
  const g = game.glove, s = settings.glove;
  return { x0: g.x + HAND.x0 * s, x1: g.x + HAND.x1 * s, y0: g.y + HAND.y0 * s, y1: g.y + HAND.y1 * s };
}
function damageTick() {
  const g = game.glove;
  if (!g || g.state !== 'ok' || g.inv || g.flash) return;
  const h = handRect();
  for (const s of game.shots) if (!s.dead && overlap(h, { x0: s.x - 3, x1: s.x + 3, y0: s.y - 3, y1: s.y + 3 })) { s.dead = true; sting(); return; }
  for (const b of game.bugs) if (!b.dead && b.kind === 'child' && overlap(h, bugBox(b))) { b.dead = true; sting(); return; }
  for (const f of game.fx) if (f.kind === 'boom' && f.t < 8) {
    const c = { x: Math.max(h.x0, Math.min(h.x1, f.x)), y: Math.max(h.y0, Math.min(h.y1, f.y)) };
    if (Math.hypot(c.x - f.x, c.y - f.y) < 20) { f.t = 8; sting(); return; }
  }
}

/* ------------------------------------------------------------------ *
 * King Watinga
 * ------------------------------------------------------------------ */
function bossHit() {
  const B = game.boss; if (!B || B.hurt) return;
  B.hp--; B.hurt = 24; addScore(POINTS.bossHit);
  B.star = { x: game.glove.x, y: game.glove.y };
  for (const st of [game.stats, game.stage]) { st.swatted++; }
  Sound.sfx('bugdie2');
  if (B.hp <= 0) { B.state = 'die'; B.t = 0; addScore(POINTS.boss); game.shots = []; game.bugs = []; }
}
function bossTick() {
  const B = game.boss; if (!B) return;
  B.t++;
  if (B.hurt) B.hurt--;
  const bs = settings.bossSpeed / 100;
  if (B.state === 'enter') {
    B.y += 0.5 * bs;
    if (B.y >= 72) { B.y = 72; B.state = 'fight'; B.t = 0; }
  } else if (B.state === 'fight') {
    B.x += B.dir * 0.6 * bs * loopMul();
    if (B.x < PF.x0 + 40) { B.x = PF.x0 + 40; B.dir = 1; }
    if (B.x > PF.x1 - 40) { B.x = PF.x1 - 40; B.dir = -1; }
    B.y = 72 + Math.sin(B.t / 40) * 12;
    if (atk() > 0 && game.glove.state === 'ok' && --B.atkT <= 0) {
      const v = 1.2 * spd();
      if (B.pattern % 2 === 0) {                 // a ring of orbs from the chest
        for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + Math.PI / 8; fireShot(B.x, B.y + 8, Math.cos(a), Math.sin(a), v); }
        Sound.sfx('off2');
      } else {                                   // a fan of homing Fly Children below him
        const rows = [2, 3, 2, 3, 2];
        rows.forEach((n, r) => { for (let i = 0; i < n; i++) {
          const c = spawnBug('child', { x: B.x + (i - (n - 1) / 2) * 18, y: B.y + 34 + r * 9 });
          c.vx = 0; c.vy = c.v; c.life = 240 + r * 10; c.entered = true;
        } });
        Sound.sfx('minibugs');
      }
      B.pattern++;
      B.atkT = Math.round(150 / atk() / Math.max(0.5, bs));
    }
  } else if (B.state === 'die') {
    if (B.t % 10 === 0) game.fx.push({ kind: 'star', x: B.x + rr(-24, 24), y: B.y + rr(-24, 24), t: 0 });
    if (B.t % 20 === 0) Sound.sfx('bugdie2');
    if (B.t > 100) B.y += (B.t - 100) * 0.08;
    if (B.t > 190) { game.boss = null; startClear(); }
  }
}

/* ------------------------------------------------------------------ *
 * Mouse-skill statistics and history
 * ------------------------------------------------------------------ */
function summarise(st) {
  return {
    shots: st.shots, hits: st.hits,
    acc: st.shots ? Math.round(100 * st.hits / st.shots) : 0,
    react: st.reactN ? Math.round(100 * st.reactSum / st.reactN) / 100 : 0,
    best: st.best, swatted: st.swatted, stings: st.stings
  };
}
const statsEl = document.getElementById('statsbox');
function showStats(title, st) {
  const s = summarise(st);
  statsEl.innerHTML = '<span class="t">' + title + '</span><br>ACCURACY <b>' + s.acc + '%</b> (' + s.hits + ' of ' + s.shots + ' swats)' +
    ' &nbsp; AVERAGE TIME TO SWAT <b>' + (s.react ? s.react.toFixed(2) + 's' : '-') + '</b><br>BEST STREAK <b>' + s.best + '</b>' +
    ' &nbsp; BUGS SWATTED <b>' + s.swatted + '</b>' + (s.stings ? ' &nbsp; STINGS <b>' + s.stings + '</b>' : '');
  statsEl.classList.remove('hidden');
}
function hideStats() { statsEl.classList.add('hidden'); }
function closeSession() { if (game.sessionOpen) endSession(false); }
function endSession(toMenu) {
  if (game.sessionOpen) {
    game.sessionOpen = false;
    const sum = summarise(game.stats);
    sum.score = game.score; sum.level = game.level; sum.loop = game.loop; sum.preset = game.preset;
    sum.inv = game.invuln ? 1 : 0; sum.date = new Date().toISOString().slice(0, 16).replace('T', ' ');
    const hk = highKey(game.preset, game.invuln);
    sum.newHigh = game.score > getHigh(hk);
    if (sum.newHigh) lsSet(hk, String(game.score));
    if (game.stats.shots > 0) {
      const hist = loadJSON('history', []);
      hist.push(sum); while (hist.length > 10) hist.shift();
      lsSet('history', JSON.stringify(hist));
      const ps = loadJSON('stats.' + game.preset, { sessions: 0, shots: 0, hits: 0, best: 0, bestAcc: 0, bestReact: 0 });
      ps.sessions++; ps.shots += sum.shots; ps.hits += sum.hits; ps.best = Math.max(ps.best, sum.best);
      ps.bestAcc = Math.max(ps.bestAcc, sum.acc);
      if (sum.react && (!ps.bestReact || sum.react < ps.bestReact)) ps.bestReact = sum.react;
      ps.last = { acc: sum.acc, react: sum.react, best: sum.best };
      lsSet('stats.' + game.preset, JSON.stringify(ps));
    }
    game.lastSummary = sum;
  }
  if (toMenu) toMenu_('gameover');
}

/* ------------------------------------------------------------------ *
 * Main update (one 60 Hz frame)
 * ------------------------------------------------------------------ */
function update() {
  game.frame++;
  if (game.mode === 'menu' || game.paused) return;
  game.t++;
  gloveTick();
  if (game.mode === 'menu') return;
  switch (game.mode) {
    case 'intro':
      if (game.t >= 120) { game.mode = 'play'; game.t = 0; }
      break;
    case 'play':
      spawner();
      if (game.ending) {
        for (const b of game.bugs) if (b.state !== 'leave') b.state = 'leave';
        game.shots = [];
        if (!game.bugs.length || game.t > 150) { game.bugs = []; startBoss(); }
      }
      break;
    case 'boss':
      bossTick();
      break;
    case 'clear':
      if (input.fire && game.t > 90) game.skip = true;
      input.fire = false;
      if (game.t >= game.clearLen || game.skip) nextLevel();
      break;
    case 'gameover':
      if (game.t >= 330 || (game.skip && game.t > 90)) { hideStats(); endSession(true); return; }
      if (input.fire) game.skip = true;
      input.fire = false;
      break;
  }
  if (game.mode === 'play' || game.mode === 'boss') {
    for (const b of game.bugs) bugTick(b);
    for (const s of game.shots) { s.x += s.vx; s.y += s.vy; s.t++; if (!inPF(s.x, s.y, 8)) s.dead = true; }
    if (game.lifeup) {
      const L = game.lifeup; L.t++; L.y += 0.5 * Math.max(0.5, spd()); L.x += Math.sin(L.t / 30) * 0.4;
      if (L.y > PF.y1 + 10) game.lifeup = null;
    }
    damageTick();
  }
  for (const f of game.fx) {
    f.t++;
    if (f.kind === 'fall') { f.vy += 0.15; f.y += f.vy; if (f.y > PF.y1 + 20) f.dead = true; }
    else if (f.kind === 'boom' && f.t > 24) f.dead = true;
    else if (f.kind === 'star' && f.t > 16) f.dead = true;
  }
  game.bugs = game.bugs.filter(b => !b.dead);
  game.shots = game.shots.filter(s => !s.dead);
  game.fx = game.fx.filter(f => !f.dead);
}

/* ------------------------------------------------------------------ *
 * Rendering
 * ------------------------------------------------------------------ */
function drawNumber(n, rightX, y) {            // the HUD's big outlined digits, right-aligned
  const s = String(Math.max(0, n | 0));
  for (let i = 0; i < s.length; i++) draw(SPR.digit[+s[i]], rightX - (s.length - i) * 16, y);
}
function drawHUD() {
  if (game.mode === 'intro' || game.mode === 'play') drawNumber(game.remaining, 144, 15);
  const n = Math.min(4, game.lives);
  for (let i = 0; i < n; i++) draw(SPR.handIcon, 176 + 16 * i, 15);
  if (settings.hudScore) { drawNumber(game.score, PF.x0 + 16 * Math.max(1, String(game.score).length), PF.y1 - 17); }
  // award icons, one per completed loop, top left (4 per row so they never touch the counter)
  for (let i = 0; i < Math.min(15, game.loop); i++) draw(SPR.icon[i], PF.x0 + 16 * (i % 4), 16 + 16 * Math.floor(i / 4), { solid: BLACK });
}
function drawBug(b) {
  const list = BUG_SPR[b.kind](), s = settings.size;
  let sp = list[0];
  if (b.kind === 'gnat') sp = list[(b.t >> 2) & 1];
  else if (b.kind === 'child') sp = list[(b.t >> 2) % 3];
  else if (b.kind === 'parent') sp = b.state === 'charge' ? list[3 + ((b.t >> 2) & 1)] : b.state === 'birth' ? list[2] : list[(b.t >> 3) & 1];
  else if (b.kind === 'bomb' && b.state === 'armed') { if ((b.fuse >> 2) & 1) return draw(SPR.bombArmed, b.x, b.y, { s, clip: true, white: b.fuse < 12 }); sp = SPR.bombArmed; }
  const bob = (b.kind === 'big' || b.kind === 'bomb') && b.state !== 'armed' ? ((b.t >> 3) & 1) : 0;
  draw(sp, b.x, b.y + bob, { s, clip: true, fx: b.kind === 'gnat' && b.vx > 0 });
}
function drawGlove() {
  const g = game.glove; if (!g) return;
  const s = settings.glove;
  if (g.state === 'hurt') { draw(SPR.glove[5], g.x, g.y, { s, clip: true }); return; }
  if (g.state === 'shrink') { draw(SPR.glove[g.t < 15 ? 6 : 7], g.x, g.y, { s, clip: true }); return; }
  if (g.inv && (g.inv >> 2) & 1) return;
  let f = 0;
  if (g.phase === 1 || g.phase === 3) f = 1;
  else if (g.phase === 2) f = g.hit ? 3 + ((g.pt >> 1) & 1) : 2;
  draw(SPR.glove[f], g.x, g.y, { s, clip: true, white: g.flash > 0 && (g.flash >> 1) & 1 });
  if (settings.swat === 'hover' && input.dwell > 0) {     // hover progress ring
    const k = Math.min(1, input.dwell / settings.dwell), R = 12 * s + settings.pad;
    for (let i = 0; i < 24; i++) { if (i / 24 >= k) break; const a = -Math.PI / 2 + i * Math.PI / 12; dot(g.x + Math.cos(a) * R, g.y + Math.sin(a) * R, i & 1 ? BLACK : rgb32(0xF8F800)); }
  }
}
function drawParade() {                        // the walk across the screen after a boss
  const t = game.t, x = PF.x1 + 16 - t * ((PF.x1 - PF.x0 + 64) / Math.max(240, game.clearLen));
  const f = (t >> 3) & 1;                        // walk cycle (frames 2/3 are other poses)
  draw(SPR.mario[f], x, 118, { clip: true });
  draw(SPR.fly[(t >> 2) & 1], x + Math.sin(t / 9) * 6, 92 + Math.cos(t / 7) * 3, { clip: true });
  if (game.level >= 2) draw(SPR.koopa, x + 34, 144, { clip: true });
  if (game.level === 3) draw(SPR.txtCongrats, 62, 69);
}
function render() {
  fb.set(BG[(game.mode === 'menu' ? 0 : game.level - 1)]);
  if (game.mode === 'menu') {
    draw(SPR.boss[0], 128, 92, { clip: true });
    const t = game.frame;
    for (let i = 0; i < 3; i++) draw(SPR.fly[(t >> 2) & 1], 60 + i * 70 + Math.sin(t / 30 + i * 2) * 20, 170 + Math.cos(t / 23 + i) * 14, { clip: true });
    ctx.putImageData(img, 0, 0);
    return;
  }
  if (game.lifeup) draw(SPR.lifeup[(game.lifeup.t >> 3) & 1], game.lifeup.x, game.lifeup.y, { clip: true });
  const B = game.boss;
  if (B) {
    const hurtFrame = B.hurt > 0 || (B.state === 'die' && (B.t >> 2) & 1);
    draw(SPR.boss[hurtFrame ? 1 : 0], B.x, B.y, { clip: true });
    if (B.hurt > 0 && B.star) draw(SPR.star, B.star.x, B.star.y, { clip: true });
  }
  for (const b of game.bugs) drawBug(b);
  for (const s of game.shots) draw(SPR.orb, s.x, s.y, { clip: true });
  for (const f of game.fx) {
    if (f.kind === 'fall') draw(f.spr[0], f.x, f.y, { s: settings.size, clip: true, fy: true });
    else if (f.kind === 'boom') draw(SPR.star, f.x, f.y, { s: 1 + Math.min(1, f.t / 8), clip: true });
    else if (f.kind === 'star') draw(SPR.star, f.x, f.y, { clip: true });
  }
  if (game.mode === 'clear') drawParade();
  drawHUD();
  if (game.mode === 'intro') {
    const ox = 128 - 32;
    draw(SPR.txtLevel, ox, 96); draw(SPR.digit[game.level], ox + 48, 96);
  }
  if (game.mode === 'gameover') {
    draw(SPR.bossLaugh, 16 + 38, 15 + 48, { clip: true });
    draw(SPR.txtGameOver, 16 + 62, 15 + 62);
  }
  if (game.mode !== 'gameover' && game.mode !== 'clear') drawGlove();
  if (game.paused) { draw(SPR.pausePanel, 78, 45); draw(SPR.pointer, 186, 156); }
  ctx.putImageData(img, 0, 0);
}

function historyHTML() {

  let h = '<p>LAST ' + hist.length + ' GAMES (newest at the bottom)</p><table><tr><th>DATE</th><th>PRESET</th><th>LEVEL</th><th>SCORE</th><th>SWATS</th><th>ACCURACY</th><th>AVG TIME</th><th>STREAK</th></tr>';

      '</td><td>' + s.score + '</td><td>' + s.shots + '</td><td>' + s.acc + '%</td><td>' + (s.react ? s.react.toFixed(2) + 's' : '-') + '</td><td>' + s.best + '</td></tr>';

    const avg = (arr, f) => arr.reduce((t, s) => t + f(s), 0) / arr.length;
    const accA = avg(a, s => s.acc), accB = avg(b, s => s.acc);

    h += '<p class="trend">Older half vs newer half: accuracy ' + accA.toFixed(0) + '% &rarr; ' + accB.toFixed(0) + '%' +

resumeBtn.addEventListener('click', () => resume());
document.getElementById('showhist').addEventListener('click', () => {
  document.getElementById('histbody').innerHTML = historyHTML();
  mainEl.classList.add('hidden'); histEl.classList.remove('hidden');
});
document.getElementById('hideh').addEventListener('click', () => { histEl.classList.add('hidden'); mainEl.classList.remove('hidden'); });
document.getElementById('clearh').addEventListener('click', () => { lsDel('history'); document.getElementById('histbody').innerHTML = historyHTML(); });

/* ------------------------------------------------------------------ *
 * Input
 * ------------------------------------------------------------------ */
/* client (CSS pixel) coordinates -> SNES pixel, through the integer CSS scale */
function toGame(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const w = r.width || SW, h = r.height || SH;
  const gx = Math.floor((clientX - r.left) * SW / w), gy = Math.floor((clientY - r.top) * SH / h);
  return { x: Math.max(0, Math.min(SW - 1, gx)), y: Math.max(0, Math.min(SH - 1, gy)) };
}
function aimAt(cx, cy) { const p = toGame(cx, cy); input.x = p.x; input.y = p.y; }
canvas.addEventListener('mousemove', e => aimAt(e.clientX, e.clientY));
window.addEventListener('mousemove', e => { if (!overlayOpen()) aimAt(e.clientX, e.clientY); });
canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (e.preventDefault) e.preventDefault();
  Sound.init(); aimAt(e.clientX, e.clientY);
  if (game.paused && !game.menuPause) { togglePause(); return; }
  input.fire = true;
});
canvas.addEventListener('contextmenu', e => { if (e.preventDefault) e.preventDefault(); });
canvas.addEventListener('touchstart', e => {
  if (e.preventDefault) e.preventDefault();
  Sound.init();
  const t = e.changedTouches && e.changedTouches[0]; if (!t) return;
  aimAt(t.clientX, t.clientY); input.fire = true;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (e.preventDefault) e.preventDefault();
  const t = e.changedTouches && e.changedTouches[0]; if (t) aimAt(t.clientX, t.clientY);
}, { passive: false });

window.addEventListener('keydown', e => {
  const k = e.key;
  Sound.init();
  if (k === 'm' || k === 'M') { Sound.setMuted(!Sound.isMuted()); return; }
  if (overlayOpen()) {
    if (!histEl.classList.contains('hidden')) { if (k === 'Escape') { histEl.classList.add('hidden'); mainEl.classList.remove('hidden'); } return; }
    const row = menu.rows[menu.row];
    if (k === 'ArrowDown') { menu.row = (menu.row + 1) % menu.rows.length; refreshMenu(); }
    else if (k === 'ArrowUp') { menu.row = (menu.row + menu.rows.length - 1) % menu.rows.length; refreshMenu(); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') {
      const d = k === 'ArrowLeft' ? -1 : 1;
      if (row === 'presets') { let i = PRESET_ORDER.indexOf(presetName()); i = i < 0 ? 0 : Math.max(0, Math.min(3, i + d)); applyPreset(PRESET_ORDER[i]); }
      else if (KNOB[row]) stepKnob(row, d);
      refreshMenu();
    } else if (k >= '1' && k <= '4') { applyPreset(PRESET_ORDER[+k - 1]); refreshMenu(); }
    else if (k === 'Enter') { if (row === 'play' || row === 'presets' || KNOB[row]) startPlaying(); }
    else if (k === 'Escape' && game.sessionOpen && game.mode !== 'menu') resume();
    else return;
    if (e.preventDefault) e.preventDefault();
    return;
  }
  if (k === 'p' || k === 'P') togglePause();
  else if (k === 'Escape') openMenu();
  else if (k === ' ' || k === 'Enter') { input.fire = true; }
  else if (k === 'q' || k === 'Q') { if (game.paused) quitToMenu(); }
  else return;
  if (e.preventDefault) e.preventDefault();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !game.paused && (game.mode === 'play' || game.mode === 'boss' || game.mode === 'intro')) togglePause();
});

/* ------------------------------------------------------------------ *
 * Layout and main loop (fixed 60 Hz timestep)
 * ------------------------------------------------------------------ */
function layout() {
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / SW, window.innerHeight / SH)));
  canvas.style.width = SW * s + 'px'; canvas.style.height = SH * s + 'px';
  const st = document.getElementById('stage'); st.style.width = SW * s + 'px'; st.style.height = SH * s + 'px';
  const logo = document.getElementById('logo'); const ls = s >= 3 ? 2 : 1;
  logo.style.width = 64 * ls + 'px'; logo.style.height = 40 * ls + 'px';
}
window.addEventListener('resize', layout);

let last = 0, acc = 0;
const STEP = 1000 / 60;
function frame(ts) {
  if (!last) last = ts;
  acc += Math.min(250, ts - last); last = ts;
  let n = 0;
  while (acc >= STEP && n < 8) { update(); acc -= STEP; n++; }
  if (n) render();
  Sound.pump();
  requestAnimationFrame(frame);
}
setInterval(() => Sound.pump(), 100);          // keeps the music fed if frames are throttled

loadSettings();
layout();
toMenu_('menu');
render();
requestAnimationFrame(frame);
})();
</script>
