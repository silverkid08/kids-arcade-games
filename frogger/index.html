<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>FROGGER</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Courier New", Courier, monospace; font-weight: bold;
    color: #fff; -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #stage { position: relative; }
  canvas { display: block; background: #000; image-rendering: pixelated; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: rgba(0,0,0,.86); text-align: center; padding: 10px; overflow: auto;
  }
  #overlay.hidden { display: none; }
  #title { margin: 0; font-size: 30px; letter-spacing: 7px; color: #21de00;
           text-shadow: 0 0 14px rgba(33,222,0,.5); }
  #sub { margin: 0; font-size: 12px; line-height: 1.7; color: #e8e8e8; letter-spacing: 1px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .lbl { font-size: 10px; color: #00def7; letter-spacing: 2px; }
  .row button, .knob button {
    font: inherit; font-size: 11px; color: #fff; padding: 5px 8px;
    background: #0b140b; border: 2px solid #148a00; border-radius: 5px; cursor: pointer;
  }
  .row button:hover, .knob button:hover { border-color: #97ff00; }
  .row button.sel { background: #148a00; border-color: #ffff00; color: #ffff00; }
  #knobs { display: grid; grid-template-columns: auto auto auto auto; gap: 3px 6px; align-items: center;
           font-size: 10px; letter-spacing: 1px; }
  #knobs .k { text-align: right; color: #bdbdbd; }
  #knobs .v { min-width: 52px; color: #ffff00; }
  .knob button { padding: 1px 7px; font-size: 12px; }
  #knobs .on { color: #97ff00; }
  #invuln.sel { background: #0b5a7a; border-color: #00def7; color: #00def7; }
  #play {
    font: inherit; font-size: 15px; letter-spacing: 3px; padding: 10px 22px;
    color: #000; background: #21de00; border: 0; border-radius: 5px; cursor: pointer;
  }
  #play:hover { background: #fff; }
  #high { margin: 0; font-size: 10px; color: #ff47f7; letter-spacing: 1px; line-height: 1.6; }
  .hint { margin: 0; font-size: 9px; color: #8b8b8b; line-height: 1.8; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen"></canvas>
  <div id="overlay">
    <h1 id="title">FROGGER</h1>
    <p id="sub">GET THE FROGS HOME</p>
    <div class="row" id="presets"><span class="lbl">PRESET</span></div>
    <div id="knobs"></div>
    <div class="row" id="invrow"><button id="invuln">INVULNERABLE: OFF</button></div>
    <p id="high"></p>
    <button id="play">PLAY</button>

  </div>
</div>

const game = {
  state: 'menu', paused: false, frame: 0,
  level: 1, tier: 0, score: 0, high: 0, lives: 3, extraAwarded: false,
  homes: [false, false, false, false, false],
  lanes: [], frog: null, timer: { steps: 60, pace: TIMER_PACE },
  bay: { counter: 0, slot: -1, kind: null },
  creatures: [], lady: null, popups: [], ouch: null,

let rng = 12345;
function rand() { rng = (rng * 1103515245 + 12345) & 0x7fffffff; return rng / 0x7fffffff; }

function laneWidth(def, triple) { return triple[1] * 8; }

function buildLanes(tier) {
  const lanes = [];
  LANE_DEF.forEach((def, i) => {
    const triple = LANE_TIERS[tier][def.arm];
    const width = laneWidth(def, triple);
    const pitch = (triple[0] + triple[1]) * 8;
    const isRoad = def.y >= ROAD_TOP;
    let count = triple[2];
    if (isRoad) count = Math.max(1, Math.round(count * S.vehicles / 100));
    count = Math.min(count, Math.floor((RING - width) / pitch) + 1);   // the ring holds 32 cells
    const objs = [];
    for (let k = 0; k < count; k++) {
      const o = { pos: k * pitch, w: width, kind: def.kind, dive: null, croc: false };
      if (def.kind === 'turtle') {
        /* every other group dives (level 1 has diving groups in the arcade) */
        o.dive = (k % 2 === 1 && S.diving) ? { t: Math.floor(rand() * 200) } : null;
      }
      objs.push(o);
    }
    /* from level 2 the first medium log in the top lane is a crocodile */
    if (i === 0 && game.level >= 2 && objs.length) { objs[0].croc = true; objs[0].w = 48; }
    lanes.push({ def, i, arm: def.arm, y: def.y, dir: def.dir, kind: def.kind, isRoad, width, pitch,
                 objs, scroll: Math.floor(rand() * RING), cd: 0, acc: 0, dx: 0, frames: triple });
  });

function resetFrog() {
  game.frog = {
    x: FROG_START_X, y: START_Y, hop: null, face: 0, lock: SPAWN_LOCK,
    furthest: START_Y, lady: false, grace: 0, dying: null
  };
  game.timer.steps = timerSteps();
  game.timer.pace = TIMER_PACE;
  game.timer.warned = false;
}

function newGame() {
  game.level = S.level;
  game.tier = (game.level - 1) % 5;
  game.score = 0;
  game.lives = S.lives;
  game.extraAwarded = false;
  game.homes = [false, false, false, false, false];
  game.high = loadHigh();
  game.deaths = 0; game.homesThisGame = 0;
  game.frame = 0;
  startLevel(true);
  game.state = 'ready';
  game.stateT = 0;
  Sound.play('intro', () => { if (game.state === 'play' || game.state === 'ready') Sound.play('main'); });
}

function startLevel(first) {
  game.tier = (game.level - 1) % 5;
  game.lanes = buildLanes(game.tier);
  game.homes = [false, false, false, false, false];
  game.bay = { counter: 1, slot: -1, kind: null };
  game.creatures = [];
  game.lady = null;
  game.popups = [];
  game.ouch = null;
  resetFrog();
}

function addScore(n) {
  game.score += n;
  if (game.score > 999990) game.score = 999990;
  if (S.extra && !game.extraAwarded && game.score >= S.extra) {
    game.extraAwarded = true;
    game.lives++;
    Sound.play('extraLife', () => { if (game.state === 'play') Sound.play('main'); });
  }
  if (game.score > game.high) game.high = game.score;

/* ------------------------------------------------------------------ *
 * Lanes: the ROM's speed ring, movement, lookups
 * ------------------------------------------------------------------ */
function ringSlot() { return RING_SLOTS[Math.floor(game.frame / RING_PERIOD) % RING_SLOTS.length]; }

function laneControl(lane) { return SPEED_RING[ringSlot()][lane.arm]; }

/* one frame of lane movement: returns the pixel shift (signed) */
function stepLane(lane) {
  const c = laneControl(lane);
  let mv = 0;
  if (lane.cd > 0) {
    if (lane.cd === 1) { mv = 1; lane.cd = 0; } else lane.cd--;
  } else if (c & 0x10) {
    const n = c & 15;
    if (n <= 1) mv = 1; else lane.cd = n - 1;
  } else mv = c & 15;
  const pct = lane.isRoad ? S.traffic : S.river;
  lane.acc += mv * pct / 100;
  const whole = Math.floor(lane.acc + 1e-9);
  lane.acc -= whole;
  const dx = whole * lane.dir;
  lane.scroll = ((lane.scroll + dx) % RING + RING) % RING;
  lane.dx = dx;
  return dx;
}

/* screen x of an object (left edge); the ring is offset 16px so the
   visible window is ring 16..240 */
function objX(lane, o) {
  let x = (o.pos + lane.scroll) % RING - 16;
  return x;
}
/* every screen x where the object appears (it may wrap round the ring) */
function objXs(lane, o) {
  const x = objX(lane, o);
  const xs = [x];
  if (x + o.w > RING - 16) xs.push(x - RING);
  return xs;
}
function laneAtY(y) { return game.lanes.find(l => l.y === y) || null; }

function turtleSubmerged(o) {
  if (!o.dive) return false;
  const t = o.dive.t % 480;
  return t >= 330 && t < 450;          // see turtleFrame
}
/* dive cycle: up 300f (swim frames), sink (53) 30f, down (54) 60f,
   fully under 60f, rising 54 30f, 53 30f -- 480 frames total */
function turtleFrame(o) {
  if (!o.dive) return SP.TURTLE[Math.floor(game.frame / 11) % 3];
  const t = o.dive.t % 480;
  if (t < 300) return SP.TURTLE[Math.floor(game.frame / 11) % 3];
  if (t < 330) return SP.TURTLE_DIVE;
  if (t < 390) return SP.TURTLE_DOWN;
  if (t < 420) return -1;
  if (t < 450) return SP.TURTLE_DOWN;
  return SP.TURTLE_DIVE;
}
function crocMouthOpen() { return (game.frame % 128) < 48; }

/* the river object under screen-x cx in lane, or null */
function rideableAt(lane, cx) {
  for (const o of lane.objs) {
    for (const x of objXs(lane, o)) {
      if (o.kind === 'turtle') {
        if (cx >= x - 1 && cx < x + o.w + 1) return turtleSubmerged(o) ? null : o;
      } else if (o.croc) {
        if (cx >= x + 2 && cx < x + 32) return o;                 // back
        if (cx >= x + 32 && cx < x + 46) return crocMouthOpen() ? 'jaws' : o;
      } else if (cx >= x + 2 && cx < x + o.w - 2) return o;
    }
  }

}
function vehicleHit(lane, fx) {
  for (const o of lane.objs) for (const x of objXs(lane, o)) {
    if (fx + 15 > x + 1 && fx + 1 < x + o.w - 1) return true;
  }
  return false;

/* ------------------------------------------------------------------ *
 * Frog
 * ------------------------------------------------------------------ */
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const FACE = { up: 0, right: 1, down: 2, left: 3 };

function canHop(dir) {
  const f = game.frog;
  if (!f || f.hop || f.lock > 0 || f.dying) return false;
  if (game.state !== 'play') return false;
  if (dir === 'left' && f.x <= 8) return false;
  if (dir === 'right' && f.x >= 200) return false;
  if (dir === 'down' && f.y >= START_Y) return false;
  if (dir !== 'up' && f.y < RIVER_TOP) return false;   // no sideways hops from the home row
  return true;
}
function press(dir) {
  if (!canHop(dir)) return false;
  const f = game.frog;
  f.hop = { dir, step: 0 };
  f.face = FACE[dir];
  Sound.hop();
  return true;
}

function landFrog() {
  const f = game.frog;
  f.hop = null;
  if (f.y < f.furthest) {
    f.furthest = f.y;
    if (f.y !== MEDIAN_Y && f.y >= RIVER_TOP) addScore(SCORE_HOP);   // the median row pays nothing (ROM)
  }
  if (f.y === HOME_Y) arriveHome();
}

function arriveHome() {
  const f = game.frog;
  let bay = -1;
  for (let i = 0; i < 5; i++) if (Math.abs(f.x - BAY_X[i]) < 6) bay = i;
  if (bay < 0) { killFrog('squash', 'hedge'); return; }
  if (game.homes[bay]) { killFrog('squash', 'occupied'); return; }
  if (game.bay.slot === bay && game.bay.kind === 'gator' && game.bay.counter < 176) { killFrog('squash', 'gator'); return; }
  f.x = BAY_X[bay];
  game.homes[bay] = true;
  let pts = SCORE_HOME;
  if (game.bay.slot === bay && game.bay.kind === 'fly' && game.bay.counter < 112) {
    pts += SCORE_FLY; game.bay.slot = -1;
    game.popups.push({ sprite: SP.POP200, x: f.x, y: HOME_Y - 12, t: 60 });
  }
  if (f.lady) { pts += SCORE_LADY; game.popups.push({ sprite: SP.POP200, x: f.x, y: HOME_Y - 12, t: 60 }); }
  const bonusSteps = isFinite(game.timer.steps) ? game.timer.steps : 0;
  pts += SCORE_TIME * bonusSteps;
  addScore(pts);
  game.homesThisGame++;
  game.homeInfo = { bay, time: bonusSteps };
  game.state = 'home';
  game.stateT = 0;
  Sound.stopMusic();
  Sound.play('home');
}

function killFrog(cause, why) {
  const f = game.frog;
  if (f.dying) return;
  if (S.invulnerable) {
    /* the squash / splash still shows, but the frog just carries on */
    game.ouch = { x: f.x, y: f.y, cause, t: 24 };
    if (cause === 'squash') Sound.squash(); else Sound.splash();
    f.grace = 45;
    f.hop = null;
    f.lady = false;
    if (why === 'timeout') { game.timer.steps = timerSteps(); game.timer.warned = false; }
    else if (f.y < MEDIAN_Y) { f.y = MEDIAN_Y; f.x = Math.max(8, Math.min(200, Math.round((f.x - 8) / 16) * 16 + 8)); f.furthest = Math.min(f.furthest, MEDIAN_Y); }
    return;
  }
  f.dying = { cause, phase: 0, t: 0, why };
  f.hop = null;
  game.deaths++;
  Sound.stopMusic();
  if (cause === 'squash') Sound.squash(); else Sound.splash();
}

function updateFrog() {
  const f = game.frog;
  if (f.lock > 0) f.lock--;
  if (f.grace > 0) f.grace--;
  if (f.dying) {
    f.dying.t++;
    if (f.dying.t >= DEATH_DWELL) {
      f.dying.t = 0; f.dying.phase++;
      if (f.dying.phase >= 5) frogLost();
    }
    return;
  }
  /* hop animation */
  if (f.hop) {
    const d = DIRS[f.hop.dir];
    f.x += d[0] * HOP_STEP; f.y += d[1] * HOP_STEP;
    f.hop.step++;
    if (f.hop.step >= HOP_FRAMES) landFrog();
    if (f.dying || game.state !== 'play') return;
  }
  /* which lane row the frog counts as being in (ROM: only when no more
     than 8px below a row's top) */
  const sub = f.y & 15;
  const rowY = sub <= 8 ? f.y - sub : -1;
  const lane = rowY >= 0 ? laneAtY(rowY) : null;
  if (lane) {
    if (lane.isRoad) {
      if (f.grace === 0 && vehicleHit(lane, f.x)) { killFrog('squash', 'car'); return; }
    } else {
      const cx = f.x + 8;
      const ride = rideableAt(lane, cx);
      if (ride === 'jaws') { if (f.grace === 0) { killFrog('drown', 'croc'); return; } }
      else if (ride) {
        f.x += lane.dx;
        if (f.x < -4 || f.x > 212) { f.x = Math.max(-4, Math.min(212, f.x)); if (f.grace === 0) killFrog('drown', 'edge'); return; }
      } else if (!f.hop && f.grace === 0) { killFrog('drown', 'water'); return; }
    }
  }
  /* otters and snakes */
  if (f.grace === 0) for (const cr of game.creatures) {
    if (!cr.active) continue;
    if (cr.kind === 'snake' && rowY === MEDIAN_Y && f.x + 14 > cr.x + 2 && f.x + 2 < cr.x + 30) { killFrog('squash', 'snake'); return; }
    if (cr.kind === 'logsnake' && lane && cr.lane === lane && !f.hop && f.x + 14 > cr.x + 2 && f.x + 2 < cr.x + 30) { killFrog('squash', 'snake'); return; }
    if (cr.kind === 'otter' && lane && cr.lane === lane && !f.hop && f.x + 14 > cr.x + 2 && f.x + 2 < cr.x + 14) { killFrog('drown', 'otter'); return; }
  }
  /* the lady frog hops on when the frog lands beside her */
  const L = game.lady;
  if (L && !f.lady && !f.hop && lane && L.lane === lane && Math.abs(L.x - f.x) < 10) {
    f.lady = true; game.lady = null;
    Sound.fly();
  }
}

function frogLost() {
  game.lives--;
  game.frog.dying = null;
  if (game.lives <= 0) { game.state = 'gameover'; game.stateT = 0; saveHigh(game.high); Sound.play('gameOver'); return; }
  resetFrog();
  game.state = 'play';
  Sound.play('main');
}

/* ------------------------------------------------------------------ *
 * Timer, bay creatures, lady frog, snakes and otters
 * ------------------------------------------------------------------ */
function updateTimer() {
  const t = game.timer;
  if (!isFinite(t.steps)) return;
  if (--t.pace > 0) return;
  t.pace = TIMER_PACE;
  t.steps--;
  if (t.steps === 10 && !t.warned) { t.warned = true; Sound.timeWarn(); }
  if (t.steps <= 0) { t.steps = 0; killFrog('squash', 'timeout'); }
}

function updateBay() {
  const b = game.bay;
  b.counter = (b.counter + 1) & 255;
  if (b.counter === 0) {
    const empty = [];
    for (let i = 0; i < 5; i++) if (!game.homes[i]) empty.push(i);
    if (!empty.length) { b.slot = -1; return; }
    b.slot = empty[Math.floor(rand() * empty.length)];
    b.kind = (game.level % 2 === 1 || game.level < 2) ? 'fly' : 'gator';   // ROM: odd levels fly, even levels gator
  }
  if (b.slot >= 0 && game.homes[b.slot]) b.slot = -1;
}
function bayVisible() {
  const b = game.bay;
  if (b.slot < 0) return null;
  if (b.kind === 'fly') return b.counter < 112 ? 'fly' : null;
  if (b.counter < 80) return 'gatorA';
  if (b.counter < 176) return 'gatorB';
  return null;
}

/* drifting creatures (ROM: from level 3, a second one from level 6;
   spawn chance (level*8+128)/256 per attempt) */
function updateCreatures() {
  if (game.level < 3) return;
  const want = game.level >= 6 ? 2 : 1;
  while (game.creatures.length < want) game.creatures.push({ active: false, cool: 120 + Math.floor(rand() * 120) });
  for (const cr of game.creatures) {
    if (!cr.active) {
      if (--cr.cool > 0) continue;
      cr.cool = 180 + Math.floor(rand() * 240);
      if (rand() * 256 > Math.min(255, game.level * 8 + 128)) continue;
      const kinds = ['snake'];
      if (game.level >= 4) kinds.push('otter');
      if (game.level >= 5) kinds.push('logsnake');
      cr.kind = kinds[Math.floor(rand() * kinds.length)];
      cr.dir = rand() < 0.5 ? -1 : 1;
      cr.active = true; cr.t = 0;
      if (cr.kind === 'snake') { cr.y = MEDIAN_Y; cr.x = cr.dir > 0 ? -32 : SW; cr.lane = null; cr.speed = 0.75; }
      else if (cr.kind === 'otter') {
        cr.lane = game.lanes[rand() < 0.5 ? 1 : 4]; cr.y = cr.lane.y;
        cr.x = cr.dir > 0 ? -16 : SW; cr.speed = 1;
      } else {
        cr.lane = game.lanes[2]; cr.y = cr.lane.y;
        cr.log = cr.lane.objs[0]; cr.rel = 16; cr.dir = 1; cr.speed = 0.5;
      }
      continue;
    }
    cr.t++;
    if (cr.kind === 'logsnake') {
      cr.rel += cr.dir * cr.speed;
      if (cr.rel < 2) { cr.rel = 2; cr.dir = 1; }
      if (cr.rel > cr.log.w - 34) { cr.rel = cr.log.w - 34; cr.dir = -1; }
      const xs = objXs(cr.lane, cr.log);
      cr.x = xs[xs.length - 1] + cr.rel;
      if (cr.x > SW + 20) cr.x = xs[0] + cr.rel;
      if (cr.t > 900) cr.active = false;
    } else {
      cr.x += cr.dir * cr.speed;
      if (cr.x < -40 || cr.x > SW + 8) cr.active = false;
    }
  }
}

/* the lady frog rides a long log in the third river lane (from level 3) */
function updateLady() {
  if (game.level < 3) return;
  const L = game.lady;
  if (!L) {
    if (game.frog.lady) return;
    game.ladyCool = (game.ladyCool || 0) - 1;
    if (game.ladyCool > 0) return;
    game.ladyCool = 600 + Math.floor(rand() * 600);
    const lane = game.lanes[2];
    game.lady = { lane, log: lane.objs[Math.floor(rand() * lane.objs.length)], rel: 24, dir: 1, hop: 0, t: 0, x: -100, face: 1 };
    return;
  }
  L.t++;
  if (L.hop > 0) { L.hop--; L.rel += L.dir * 2; }
  else if (L.t % 40 === 0) {
    if (L.rel + L.dir * 16 < 4 || L.rel + L.dir * 16 > L.log.w - 20) L.dir = -L.dir;
    L.hop = 8; L.face = L.dir > 0 ? 1 : 3;
  }
  const xs = objXs(L.lane, L.log);
  L.x = xs[0] + L.rel;
  if (L.x + 16 < 0 && xs.length > 1) L.x = xs[1] + L.rel;
  if (L.x + 16 < 0) L.x = xs[0] + L.rel + RING;
  if (L.t > 1500) game.lady = null;
}

/* ------------------------------------------------------------------ *
 * Main update: one 60Hz frame
 * ------------------------------------------------------------------ */
function tick() {
  if (game.paused) return;
  game.frame++;
  game.stateT++;
  Sound.pump();
  /* lanes always move (menu backdrop too) */
  for (const lane of game.lanes) {
    stepLane(lane);
    for (const o of lane.objs) if (o.dive) o.dive.t++;
  }
  for (const p of game.popups) p.t--;
  game.popups = game.popups.filter(p => p.t > 0);
  if (game.ouch && --game.ouch.t <= 0) game.ouch = null;

  switch (game.state) {
    case 'menu':
      break;
    case 'ready':
      if (game.stateT >= 60) { game.state = 'play'; game.stateT = 0; }
      break;
    case 'play':
      updateTimer();
      if (game.state !== 'play') break;
      updateBay();
      updateCreatures();
      updateLady();
      updateFrog();
      break;
    case 'home':
      if (game.stateT === 1 && game.frog.lady) game.frog.lady = false;
      if (game.stateT >= 70) {
        if (game.homes.every(h => h)) {
          addScore(SCORE_ALL_HOME);
          game.state = 'levelend'; game.stateT = 0;
          Sound.play('levelComplete');
        } else {
          resetFrog();
          game.state = 'play'; game.stateT = 0;
          Sound.play('main');
        }
      }
      break;
    case 'levelend':
      if (game.stateT >= 150) {
        game.level++;
        startLevel(false);
        game.state = 'play'; game.stateT = 0;
        Sound.play('main');
      }
      break;
    case 'gameover':
      if (game.stateT === 150) showOverlay('over');
      break;
  }
}

/* ------------------------------------------------------------------ *
 * Rendering
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
let SCALE = 1;

function drawLane(c, lane) {
  for (const o of lane.objs) for (const x of objXs(lane, o)) {
    if (x + o.w <= 0 || x >= SW) continue;
    const y = lane.y;
    if (o.kind === 'turtle') {
      const fr = turtleFrame(o);
      if (fr < 0) continue;
      for (let k = 0; k < o.w / 16; k++) c.drawImage(sprite(fr), x + k * 16, y);
    } else if (o.croc) {
      c.drawImage(sprite(SP.CROC[0]), x, y);
      c.drawImage(sprite(SP.CROC[1]), x + 16, y);
      c.drawImage(sprite(SP.CROC[2]), x + 32, y);
      if (!crocMouthOpen()) { c.fillStyle = PAL[1]; c.fillRect(x + 40, y + 4, 8, 6); c.drawImage(sprite(SP.CROC[1], 0, false), x + 32, y); }
    } else if (o.kind === 'log') {
      const n = o.w / 16;
      c.drawImage(sprite(SP.LOG_L), x, y);
      for (let k = 1; k < n - 1; k++) c.drawImage(sprite(SP.LOG_M), x + k * 16, y);
      c.drawImage(sprite(SP.LOG_R), x + (n - 1) * 16, y);
    } else if (o.kind === 'truck') {
      c.drawImage(sprite(SP.TRUCK_A), x, y);
      c.drawImage(sprite(SP.TRUCK_B), x + 16, y);
    } else {
      const n = o.kind === 'car1' ? SP.CAR1 : o.kind === 'car2' ? SP.CAR2 : o.kind === 'dozer' ? SP.DOZER : SP.RACE;
      c.drawImage(sprite(n), x, y);
    }
  }
}

function frogSprite(f) {
  if (!f.hop) return SP.FROG[2];
  const s = f.hop.step;
  return s < 2 ? SP.FROG[2] : s < 4 ? SP.FROG[1] : SP.FROG[0];
}
function deathSprite(d) {
  const seq = d.cause === 'squash' ? [SP.SQUASH[0], SP.SQUASH[1], SP.SQUASH[2], SP.SKULL, -1]
                                   : [SP.SPLASH[0], SP.SPLASH[1], SP.SPLASH[2], SP.SKULL, -1];
  return seq[Math.min(d.phase, 4)];
}

function render() {
  const c = ctx;
  c.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  c.imageSmoothingEnabled = false;
  if (!bgCanvas) buildBackground();
  c.drawImage(bgCanvas, 0, 0);

  /* home bays */
  for (let i = 0; i < 5; i++) {
    if (game.homes[i]) {
      const flash = game.state === 'levelend' && Math.floor(game.stateT / 8) % 2 === 1;
      if (!flash) c.drawImage(sprite(SP.HOME_FROG), BAY_X[i], HOME_Y);
    }
  }
  const bv = bayVisible();
  if (bv && !game.homes[game.bay.slot]) {
    const bx = BAY_X[game.bay.slot];
    if (bv === 'fly') c.drawImage(sprite(SP.FLY), bx, HOME_Y);
    else if (bv === 'gatorA') c.drawImage(sprite(SP.GATOR_A), bx + 8, HOME_Y);
    else { c.drawImage(sprite(SP.GATOR_A), bx - 8, HOME_Y); c.drawImage(sprite(SP.GATOR_B), bx + 8, HOME_Y); }
  }

  for (const lane of game.lanes) drawLane(c, lane);

  /* creatures and the lady frog */
  for (const cr of game.creatures) {
    if (!cr.active) continue;
    const x = Math.round(cr.x), y = cr.y;
    if (cr.kind === 'otter') c.drawImage(sprite(Math.floor(cr.t / 30) % 2 ? SP.OTTER_UP : SP.OTTER[0], 0, cr.dir < 0), x, y);
    else {
      const fr = SP.SNAKE[Math.floor(cr.t / 10) % 3];
      const flip = cr.dir > 0;
      c.drawImage(sprite(flip ? fr[1] : fr[0], 0, flip), x, y);
      c.drawImage(sprite(flip ? fr[0] : fr[1], 0, flip), x + 16, y);
    }
  }
  if (game.lady) c.drawImage(sprite(SP.LADY[game.lady.hop ? 1 : 2], game.lady.face), Math.round(game.lady.x), game.lady.y);

  /* the frog */
  const f = game.frog;
  if (f && game.state !== 'menu') {
    if (f.dying) {
      const n = deathSprite(f.dying);
      if (n >= 0) c.drawImage(sprite(n), f.x, f.y);
    } else if (game.state === 'home') {
      /* the frog sits in its bay; the arcade shows the home sprite at once */
    } else if (game.state !== 'gameover') {
      const blink = f.grace > 0 && Math.floor(game.frame / 4) % 2 === 0;
      if (!blink) {
        c.drawImage(sprite(frogSprite(f), f.face), f.x, f.y);
        if (f.lady) c.drawImage(sprite(SP.LADY[f.hop ? 1 : 2], f.face), f.x, f.y);
      }
    }
  }
  if (game.ouch) {
    const seq = game.ouch.cause === 'squash' ? SP.SQUASH : SP.SPLASH;
    c.drawImage(sprite(seq[Math.min(2, Math.floor((24 - game.ouch.t) / 8))]), game.ouch.x, game.ouch.y);
  }
  for (const p of game.popups) c.drawImage(sprite(p.sprite), p.x, p.y);
  if (game.state === 'home' && game.homeInfo) {
    drawText(c, 'TIME ' + game.homeInfo.time, 72, HOME_Y + 24, C_WHITE);
  }

  drawHUD(c);
}

function drawHUD(c) {
  /* header: score and high score, arcade placement */
  drawText(c, '1-UP', 32, 0, C_WHITE);
  drawText(c, 'HI-SCORE', 80, 0, C_WHITE);
  const sc = String(game.score % 1000000).padStart(5, '0');
  drawText(c, sc, 24, 8, C_RED);
  drawText(c, String(Math.max(game.high, game.score) % 1000000).padStart(5, '0'), 88, 8, C_RED);
  if (S.invulnerable) drawText(c, 'INVULNERABLE', 64, 16, C_CYAN);
  else if (S.preset !== 'original') drawText(c, S.preset.toUpperCase(), 92, 16, C_CYAN);

  /* bottom row: lives, level markers, time bar */
  const lives = Math.max(0, Math.min(game.lives - 1, 8));   // frogs in reserve, like the arcade
  for (let i = 0; i < lives; i++) c.drawImage(icon(LIFE_ICON, 'life'), 1 + i * 8, 241);
  const lv = Math.min(game.level, 15);
  for (let i = 0; i < lv; i++) c.drawImage(icon(LEVEL_ICON, 'level'), 216 - i * 7, 241);
  const steps = isFinite(game.timer.steps) ? Math.min(TIMER_STEPS, game.timer.steps) : TIMER_STEPS;
  const w = steps * 2;
  c.fillStyle = steps <= 10 ? PAL[C_RED] : PAL[C_GREEN];
  if (w > 0) c.fillRect(192 - w, 248, w, 8);
  drawText(c, 'TIME', 194, 248, C_YELLOW);
  if (game.state === 'ready') drawText(c, 'READY', 92, MEDIAN_Y + 4, C_YELLOW);
  if (game.state === 'levelend' && Math.floor(game.stateT / 16) % 2 === 0) drawText(c, 'LEVEL ' + game.level + ' CLEAR', 56, MEDIAN_Y + 4, C_YELLOW);
  if (game.state === 'gameover') drawText(c, 'GAME OVER', 76, MEDIAN_Y + 4, C_RED);
}

function resize() {
  const maxW = window.innerWidth - 12;
  const maxH = window.innerHeight - 12;
  let s = Math.min(maxW / SW, maxH / SH);
  s = s >= 2 ? Math.floor(s) : Math.max(0.5, s);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  SCALE = Math.max(1, Math.round(s * dpr));
  canvas.width = SW * SCALE;
  canvas.height = SH * SCALE;
  canvas.style.width = (SW * s) + 'px';
  canvas.style.height = (SH * s) + 'px';
  ctx.imageSmoothingEnabled = false;
}

/* ------------------------------------------------------------------ *
 * Menu / overlay
 * ------------------------------------------------------------------ */
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const subEl = document.getElementById('sub');
const presetRow = document.getElementById('presets');
const knobsEl = document.getElementById('knobs');
const invulnBtn = document.getElementById('invuln');
const invRow = document.getElementById('invrow');
const highEl = document.getElementById('high');
const playBtn = document.getElementById('play');
let overlayMode = 'menu';

const presetBtns = {};
for (const name of PRESET_ORDER) {
  const b = document.createElement('button');
  b.textContent = name.toUpperCase();
  b.addEventListener('click', () => { Sound.unlock(); applyPreset(name); refreshMenu(); });
  presetRow.appendChild(b);
  presetBtns[name] = b;
}
const knobEls = {};
for (const k of KNOBS) {
  const lbl = document.createElement('span'); lbl.className = 'k'; lbl.textContent = k.label;
  const minus = document.createElement('button'); minus.textContent = '-'; minus.className = 'knob';
  const val = document.createElement('span'); val.className = 'v';
  const plus = document.createElement('button'); plus.textContent = '+'; plus.className = 'knob';
  minus.addEventListener('click', () => { Sound.unlock(); bumpKnob(k, -1); });
  plus.addEventListener('click', () => { Sound.unlock(); bumpKnob(k, 1); });
  const wrapM = document.createElement('span'); wrapM.className = 'knob'; wrapM.appendChild(minus);
  const wrapP = document.createElement('span'); wrapP.className = 'knob'; wrapP.appendChild(plus);
  knobsEl.appendChild(lbl); knobsEl.appendChild(wrapM); knobsEl.appendChild(val); knobsEl.appendChild(wrapP);
  knobEls[k.key] = val;
}
function bumpKnob(k, d) {
  let v = S[k.key];
  if (k.bool) v = !v;
  else if (k.choices) { const i = Math.max(0, Math.min(k.choices.length - 1, k.choices.indexOf(v) + d)); v = k.choices[i]; }
  else v = Math.max(k.min, Math.min(k.max, v + d * k.step));
  setKnob(k.key, v);
  refreshMenu();
}
invulnBtn.addEventListener('click', () => { Sound.unlock(); S.invulnerable = !S.invulnerable; saveSettings(); refreshMenu(); });

function refreshMenu() {
  for (const name of PRESET_ORDER) presetBtns[name].classList.toggle('sel', S.preset === name);
  for (const k of KNOBS) { knobEls[k.key].textContent = k.fmt(S[k.key]); knobEls[k.key].classList.toggle('on', !!S[k.key] && k.bool); }
  invulnBtn.textContent = 'INVULNERABLE: ' + (S.invulnerable ? 'ON' : 'OFF');
  invulnBtn.classList.toggle('sel', S.invulnerable);
  const h = loadHigh();
  highEl.innerHTML = 'PRESET: ' + S.preset.toUpperCase() + (S.invulnerable ? ' (INVULNERABLE)' : '') +
    '<br>HIGH SCORE ' + String(h).padStart(5, '0') + (S.invulnerable ? ' *' : '');
  if (overlayMode === 'menu') subEl.innerHTML = S.preset === 'original' ? 'ARCADE DIP DEFAULTS: 3 FROGS, 32 SEC, EXTRA AT 20000' :
    S.preset === 'kid' ? 'SLOW TRAFFIC, NO CLOCK, FIVE FROGS' : 'HOP ACROSS THE ROAD AND THE RIVER';
}

function showOverlay(mode) {
  overlayMode = mode;
  overlay.classList.remove('hidden');
  const cfg = mode !== 'menu';
  presetRow.style.display = cfg ? 'none' : '';
  knobsEl.style.display = cfg ? 'none' : '';
  invRow.style.display = cfg ? 'none' : '';
  highEl.style.display = cfg ? 'none' : '';
  if (mode === 'pause') {
    titleEl.textContent = 'PAUSED'; titleEl.style.color = '#ffff00';
    playBtn.textContent = 'RESUME';
    subEl.innerHTML = 'LEVEL ' + game.level + ' &mdash; SCORE ' + game.score + '<br>ESC FOR THE MENU';
  } else if (mode === 'over') {
    titleEl.textContent = 'GAME OVER'; titleEl.style.color = '#ff5555';
    playBtn.textContent = 'PLAY AGAIN';
    subEl.innerHTML = 'SCORE ' + game.score + (game.score >= game.high && game.score > 0 ? ' &mdash; NEW BEST!' : ' &mdash; BEST ' + game.high) +
      '<br>LEVEL ' + game.level + ' &mdash; ' + game.homesThisGame + ' FROGS HOME';
  } else {
    titleEl.textContent = 'FROGGER'; titleEl.style.color = '#21de00';
    playBtn.textContent = 'PLAY';
    refreshMenu();
  }
}
function hideOverlay() { overlay.classList.add('hidden'); }

function startPlaying() {
  Sound.unlock();
  hideOverlay();
  game.paused = false;
  newGame();
}
playBtn.addEventListener('click', () => {
  if (overlayMode === 'pause') { game.paused = false; hideOverlay(); }
  else startPlaying();
});
function togglePause() {
  if (game.state === 'menu' || game.state === 'gameover') return;
  game.paused = !game.paused;
  if (game.paused) showOverlay('pause'); else hideOverlay();
}
function toMenu() {
  if (game.state !== 'menu') saveHigh(game.high);
  Sound.stopMusic();
  game.paused = false;
  game.state = 'menu';
  game.level = S.level;
  game.score = 0;
  game.lives = S.lives;
  startLevel(true);
  game.frog = null;
  showOverlay('menu');
}

/* ------------------------------------------------------------------ *
 * Input
 * ------------------------------------------------------------------ */
window.addEventListener('keydown', (e) => {
  const k = e.key;
  let d = null;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') d = 'up';
  else if (k === 'ArrowDown' || k === 's' || k === 'S') d = 'down';
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') d = 'left';
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') d = 'right';
  if (d) {
    if (overlay.classList.contains('hidden')) { e.preventDefault(); Sound.unlock(); if (!e.repeat) press(d); }
    return;
  }
  if (k === ' ' || k === 'Enter') {
    if (!overlay.classList.contains('hidden')) {
      const a = document.activeElement;
      if (a && a.tagName === 'BUTTON' && a !== playBtn) return;   // let a focused knob button take it
      e.preventDefault(); playBtn.click();
    } else { e.preventDefault(); togglePause(); }
    return;
  }
  if (k === 'p' || k === 'P') { togglePause(); return; }
  if (k === 'm' || k === 'M') { Sound.unlock(); Sound.toggle(); return; }
  if (k === 'Escape') { if (game.state === 'menu') return; toMenu(); return; }
  if (k === 'i' || k === 'I') { if (overlayMode === 'menu' && !overlay.classList.contains('hidden')) { S.invulnerable = !S.invulnerable; saveSettings(); refreshMenu(); } return; }
  if (k >= '1' && k <= '4' && overlayMode === 'menu' && !overlay.classList.contains('hidden')) {
    Sound.unlock(); applyPreset(PRESET_ORDER[parseInt(k, 10) - 1]); refreshMenu();
  }
});

let touchX = 0, touchY = 0;
canvas.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  touchX = t.clientX; touchY = t.clientY;
  Sound.unlock();
}, { passive: true });
canvas.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchX, dy = t.clientY - touchY;
  if (Math.abs(dx) < 14 && Math.abs(dy) < 14) { press('up'); return; }
  press(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
}, { passive: true });

document.addEventListener('visibilitychange', () => {
  if (document.hidden && game.state === 'play' && !game.paused) togglePause();
});

/* ------------------------------------------------------------------ *
 * Main loop: fixed 60Hz steps
 * ------------------------------------------------------------------ */
const STEP = 1 / 60;
let last = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 30) { tick(); acc -= STEP; }
  render();
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */
loadSettings();
game.lives = S.lives;
game.level = S.level;
startLevel(true);
game.frog = null;
game.state = 'menu';
showOverlay('menu');
resize();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);

/* test hook (tools/test.js appends an export here) */
// EXPORT-POINT
})();
</script>
