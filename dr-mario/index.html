<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>DR. MARIO</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Courier New", Courier, monospace; font-weight: bold;
    color: #fff; -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #stage { position: relative; }
  canvas#screen { display: block; background: #000; image-rendering: pixelated; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; gap: 7px;
    background: rgba(0,0,0,.86); text-align: center; padding: 8px 10px 10px; overflow-y: auto;
  }
  #overlay.hidden { display: none; }
  #logo { image-rendering: pixelated; margin-top: 2px; }
  #sub { margin: 0; font-size: 12px; line-height: 1.6; color: #e8e8e8; letter-spacing: 1px; min-height: 1.6em; }
  #sub b { color: #fcd8a8; }
  #presets { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #presets .lbl, .knob .lbl { font-size: 10px; color: #f8b800; letter-spacing: 1px; }
  #presets button, .btnrow button {
    min-width: 64px; height: 28px; font: inherit; font-size: 11px; letter-spacing: 1px; color: #fff; padding: 0 8px;
    background: #301060; border: 2px solid #b8a0f8; border-radius: 14px; cursor: pointer;
  }
  #presets button:hover, .btnrow button:hover { border-color: #fff; }
  #presets button.sel { background: #f8d878; border-color: #fff; color: #000; }
  #presets.row-sel .lbl { color: #ffff60; }
  #presets .custom { font-size: 11px; color: #fcd8a8; letter-spacing: 1px; }
  #knobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2px 10px; width: 100%; max-width: 720px; }
  .knob { display: grid; grid-template-columns: 1fr 26px 128px 26px; align-items: center; gap: 4px;
          padding: 1px 6px; border-radius: 4px; border: 1px solid transparent; }
  .knob.sel { border-color: #ffff60; background: rgba(255,255,96,.08); }
  .knob .lbl { text-align: left; }
  .knob .val { font-size: 11px; color: #fff; letter-spacing: 1px; }
  .knob button {
    width: 26px; height: 22px; font: inherit; font-size: 13px; color: #fff; padding: 0;
    background: #301060; border: 2px solid #b8a0f8; border-radius: 4px; cursor: pointer; line-height: 1;
  }
  .knob button:hover { border-color: #fff; }
  .knob.on .val { color: #ffff60; }
  .knob.nes .lbl { color: #58d854; }
  #highs { font-size: 10px; color: #bdbdbd; letter-spacing: 1px; line-height: 1.7; }
  #highs b { color: #fff; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #play {
    font: inherit; font-size: 15px; letter-spacing: 3px; padding: 9px 22px; min-width: 120px; height: auto;
    color: #000; background: #58d854; border: 2px solid #58d854; border-radius: 18px; cursor: pointer;
  }
  #play:hover, #play.sel { background: #fff; border-color: #ffff60; }
  .hint { margin: 0; font-size: 10px; color: #8b8b8b; line-height: 1.8; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" width="256" height="224"></canvas>
  <div id="overlay">
    <canvas id="logo" width="208" height="72"></canvas>
    <p id="sub"></p>
    <div id="presets"><span class="lbl">PRESET</span></div>
    <div id="knobs"></div>
    <div id="highs"></div>
    <div class="btnrow">
      <button id="play">PLAY</button>
      <button id="resume">RESUME</button>
      <button id="quit">QUIT TO TITLE</button>
    </div>
    <p class="hint">&larr;&rarr; / A D move &nbsp;&middot;&nbsp; &darr; / S drop faster &nbsp;&middot;&nbsp; Z / J turn left &nbsp;&middot;&nbsp; X / K turn right &nbsp;&middot;&nbsp; SPACE hard drop (if on)<br>
      ENTER = START &nbsp;&middot;&nbsp; P pause &nbsp;&middot;&nbsp; M sound &nbsp;&middot;&nbsp; ESC this menu &nbsp;&middot;&nbsp; menu: &uarr;&darr; row, &larr;&rarr; change, 1-4 presets, ENTER play</p>
  </div>
</div>

   virus count, match-3, landing preview, hard drop, slower auto-repeat,

  if (G.cfg.noGameOver) drawText('NO GAME OVER', 8, 16, NES32[0x30]);
  if (G.flash && (G.flash & 4)) {
    for (let y = 40; y < 216; y++) for (let x = 96; x < 160; x++) if (((x + y) & 1) === 0) fb[y * SW + x] = NES32[0x30];
  }
}

/* ------------------------------------------------------------------ *
 * Controller: keyboard -> NES pad bits, read at the NMI (getInputs)
 * ------------------------------------------------------------------ */
const keyBits = {
  ArrowRight: BTN.right, d: BTN.right, D: BTN.right,
  ArrowLeft: BTN.left, a: BTN.left, A: BTN.left,
  ArrowDown: BTN.down, s: BTN.down, S: BTN.down,
  ArrowUp: BTN.up, w: BTN.up, W: BTN.up,
  z: BTN.b, Z: BTN.b, j: BTN.b, J: BTN.b,
  x: BTN.a, X: BTN.a, k: BTN.a, K: BTN.a,
  Enter: BTN.start, p: BTN.start, P: BTN.start, Backspace: BTN.b
};
const pad = { held: 0, latch: 0, hard: false, prev: 0 };
function readPad() {
  const cur = pad.held | pad.latch;
  pad.latch = 0;
  G.pressed = cur & ~G.held & 0xFF;
  G.held = cur;
  G.hardPressed = pad.hard; pad.hard = false;
}
function padDown(bit) { pad.held |= bit; pad.latch |= bit; }
function padUp(bit) { pad.held &= ~bit; }

/* ------------------------------------------------------------------ *
 * Menu overlay (presets, knobs, high scores)
 * ------------------------------------------------------------------ */
const overlay = document.getElementById('overlay');
const presetsEl = document.getElementById('presets');
const knobsEl = document.getElementById('knobs');
const highsEl = document.getElementById('highs');
const subEl = document.getElementById('sub');
const playBtn = document.getElementById('play');
const resumeBtn = document.getElementById('resume');
const quitBtn = document.getElementById('quit');
const menu = { row: 0, rows: [], open: true };
const presetBtns = {}; const knobRows = {}; let customLbl = null;

(function buildMenu() {
  for (const p of PRESET_ORDER) {
    const b = document.createElement('button'); b.textContent = p.toUpperCase();
    b.addEventListener('click', () => { applyPreset(p); refreshMenu(); });
    presetsEl.appendChild(b); presetBtns[p] = b;
  }
  customLbl = document.createElement('span'); customLbl.className = 'custom'; presetsEl.appendChild(customLbl);
  for (const k of KNOBS) {
    const row = document.createElement('div'); row.className = 'knob' + (k.nes ? ' nes' : '');
    const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = k.label;
    const minus = document.createElement('button'); minus.textContent = '-';
    const val = document.createElement('span'); val.className = 'val';
    const plus = document.createElement('button'); plus.textContent = '+';
    minus.addEventListener('click', () => { stepKnob(k.key, -1); refreshMenu(); });
    plus.addEventListener('click', () => { stepKnob(k.key, 1); refreshMenu(); });
    row.appendChild(lbl); row.appendChild(minus); row.appendChild(val); row.appendChild(plus);
    knobsEl.appendChild(row); knobRows[k.key] = { row, val };
  }
  menu.rows = ['presets'].concat(KNOBS.map(k => k.key), ['play']);
  // logo: the capsule from the real title screen (tiles 3..28 x 5..13)
  const lc = document.getElementById('logo').getContext('2d');
  const li = lc.createImageData(208, 72), l32 = new Uint32Array(li.data.buffer);
  const nt = NTS.title, pal = ART.pal.title;
  for (let ty = 0; ty < 9; ty++) for (let tx = 0; tx < 26; tx++) {
    const X = tx + 3, Y = ty + 5, t = nt[Y * 32 + X];
    const at = nt[0x3C0 + (Y >> 2) * 8 + (X >> 2)], p4 = ((at >> (((Y & 2) << 1) | (X & 2))) & 3) * 4;
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      const p = TILES[(3 * 256 + t) * 64 + y * 8 + x];
      l32[(ty * 8 + y) * 208 + tx * 8 + x] = p ? NES32[pal[p4 + p]] : 0;
    }
  }
  lc.putImageData(li, 0, 0);
})();

function refreshMenu() {
  const p = presetName();
  for (const q of PRESET_ORDER) presetBtns[q].classList.toggle('sel', q === p);
  customLbl.textContent = p === 'custom' ? 'CUSTOM' : '';
  presetsEl.classList.toggle('row-sel', menu.rows[menu.row] === 'presets');
  for (const k of KNOBS) {
    const r = knobRows[k.key], v = settings[k.key];
    r.val.textContent = k.fmt ? k.fmt(v) : String(v);
    r.row.classList.toggle('sel', menu.rows[menu.row] === k.key);
    r.row.classList.toggle('on', k.key === 'noGameOver' && v === 1);
  }
  playBtn.classList.toggle('sel', menu.rows[menu.row] === 'play');
  const parts = PRESET_ORDER.concat(['custom']).map(q => {
    const h = getHigh(highKey(q, 0)), hn = getHigh(highKey(q, 1));
    return q.toUpperCase() + ' <b>' + (h || '-') + '</b>' + (hn ? ' (' + hn + '*)' : '');
  });
  highsEl.innerHTML = 'HIGH SCORES: ' + parts.join(' &middot; ') + '<br>* = set with NO GAME OVER on (kept separately)';
  const inGame = G.romMode >= 2;
  resumeBtn.style.display = inGame ? '' : 'none';
  quitBtn.style.display = inGame ? '' : 'none';
}
function showOverlay(text) {
  subEl.innerHTML = text || '';
  overlay.classList.remove('hidden'); menu.open = true; refreshMenu();
}
function hideOverlay() { overlay.classList.add('hidden'); menu.open = false; }
function overlayOpen() { return menu.open; }
function openMenu() {
  pad.held = 0; pad.latch = 0;
  Sound.hush();
  showOverlay(G.romMode >= 2 ? 'PAUSED &nbsp; RESUME, or change settings and PLAY to start a new game.' :
    'Pick a preset, then PLAY. The <b>green</b> rows are the NES options screen; the others are kid helpers.');
}
function resume() { hideOverlay(); }
/* PLAY: go to the NES options screen (level / speed / music), START begins */
function startPlaying() {
  hideOverlay();
  if (G.romMode >= 2) { recordScore(); }
  Sound.init();
  G.romMode = 1; G.paused = false; Sound.setPaused(false);
  G.gameOver = false; G.stageClear = false; P.levelFailFlag = 0; G.curFail = 0;
  G.gen = mainProgram();
}
function quitToTitle() {
  if (G.romMode >= 2) recordScore();
  hideOverlay(); Sound.setPaused(false); G.paused = false; P.levelFailFlag = 0; G.curFail = 0;
  G.romMode = 0; G.gen = mainProgram();
}
playBtn.addEventListener('click', () => startPlaying());
resumeBtn.addEventListener('click', () => resume());
quitBtn.addEventListener('click', () => quitToTitle());

window.addEventListener('keydown', e => {
  const k = e.key;
  Sound.init();
  if (k === 'm' || k === 'M') { Sound.setMuted(!Sound.isMuted()); return; }
  if (overlayOpen()) {
    const row = menu.rows[menu.row];
    if (k === 'ArrowDown') { menu.row = (menu.row + 1) % menu.rows.length; refreshMenu(); }
    else if (k === 'ArrowUp') { menu.row = (menu.row + menu.rows.length - 1) % menu.rows.length; refreshMenu(); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') {
      const d = k === 'ArrowLeft' ? -1 : 1;
      if (row === 'presets') { let i = PRESET_ORDER.indexOf(presetName()); i = i < 0 ? 0 : Math.max(0, Math.min(3, i + d)); applyPreset(PRESET_ORDER[i]); }
      else if (KNOB[row]) stepKnob(row, d);
      refreshMenu();
    } else if (k >= '1' && k <= '4') { applyPreset(PRESET_ORDER[+k - 1]); refreshMenu(); }
    else if (k === 'Enter') startPlaying();
    else if (k === 'Escape' && G.romMode >= 2) resume();
    else return;
    if (e.preventDefault) e.preventDefault();
    return;
  }
  if (k === 'Escape') { openMenu(); if (e.preventDefault) e.preventDefault(); return; }
  if (k === ' ' || k === 'Spacebar') {
    if (G.romMode < 2) padDown(BTN.start); else pad.hard = true;
    if (e.preventDefault) e.preventDefault(); return;
  }
  const b = keyBits[k];
  if (b) { if (!e.repeat) padDown(b); if (e.preventDefault) e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === ' ' || k === 'Spacebar') { padUp(BTN.start); return; }
  const b = keyBits[k]; if (b) padUp(b);
});
window.addEventListener('blur', () => { pad.held = 0; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.romMode === 4 && G.enablePause && !G.paused && !overlayOpen()) openMenu();
});

/* ------------------------------------------------------------------ *
 * Layout and main loop (fixed 60 Hz timestep)
 * ------------------------------------------------------------------ */
function layout() {
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / SW, window.innerHeight / VIS_H)));
  canvas.style.width = SW * s + 'px'; canvas.style.height = VIS_H * s + 'px';
  const st = document.getElementById('stage'); st.style.width = SW * s + 'px'; st.style.height = VIS_H * s + 'px';
  const logo = document.getElementById('logo'); const ls = s >= 3 ? 2 : 1;
  logo.style.width = 208 * ls + 'px'; logo.style.height = 72 * ls + 'px';
}
window.addEventListener('resize', layout);

let last = 0, acc = 0;
const STEP = 1000 / 60;
function update() { if (!overlayOpen()) step(); }
function frame(ts) {
  if (!last) last = ts;
  acc += Math.min(250, ts - last); last = ts;
  let n = 0;
  while (acc >= STEP && n < 8) { update(); acc -= STEP; n++; }
  if (n) render();
  requestAnimationFrame(frame);
}

loadSettings();
G.cfg = makeCfg();
layout();
step(); step(); step();                       // draw the title screen behind the menu
openMenu();
render();
requestAnimationFrame(frame);
window.addEventListener('pointerdown', function first() { Sound.init(); window.removeEventListener('pointerdown', first); });
})();
</script>
</body>
</html>
